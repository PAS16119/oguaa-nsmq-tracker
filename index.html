  async function resolvePendingReview(examId, studentName, qid, decision){
    const rec = await sGet(`exam_attempt:${examId}:${studentName}`);
    if(!rec || !rec.pending) return;
    const idx = rec.pending.findIndex(p=>p.qid===qid);
    if(idx<0) return;
    const item = rec.pending[idx];
    rec.pending.splice(idx,1);
    const earned = decision==='correct' ? item.points : -(item.penaltyIfWrong||0);
    rec.score = (rec.score||0) + earned;
    if(!rec.subjectScores) rec.subjectScores = {};
    if(!rec.subjectScores[item.subject]) rec.subjectScores[item.subject] = {earned:0, max:item.points};
    rec.subjectScores[item.subject].earned += earned;
    await sSet(`exam_attempt:${examId}:${studentName}`, rec);
    toast(`Marked ${decision}.`, 'success');
    await loadPendingReviewsIntoUi(examId);
    await refreshExamResults(examId);
  }

  async function publishExamToAssessments(examId){
    if(!ui.isStaff) return;
    const ex = (DB.exams||[]).find(e=>e.id===examId);
    if(!ex) return;
    const subjectMax = {}; SUBJECTS.forEach(s=>{ subjectMax[s]=0; });
    (ex.questions||[]).forEach(qq=>{ subjectMax[qq.subject] = (subjectMax[qq.subject]||0) + (qq.type==='riddle'?5:(qq.points||1)); });
    const scores = {};
    let anySubmitted = false;
    let stillPending = 0;
    for(const s of DB.students){
      const rec = await sGet(`exam_attempt:${examId}:${s.name}`);
      if(rec && rec.submitted && rec.subjectScores){
        const entry = {};
        SUBJECTS.forEach(subj=>{
          if(subjectMax[subj]>0) entry[subj] = Math.max(0, (rec.subjectScores[subj] && rec.subjectScores[subj].earned) || 0);
        });
        scores[s.name] = entry;
        anySubmitted = true;
        if(rec.pending && rec.pending.length) stillPending += rec.pending.length;
      }
    }
    if(!anySubmitted){ toast('No submitted attempts yet — nothing to publish.', 'error'); return; }
    DB.assessments = (DB.assessments||[]).filter(a=>a.id!==ex.publishedAssessmentId);
    const as = { id: uid('as'), name: ex.title, maxScore: null, subjectMax, date: new Date(ex.createdAt).toISOString().slice(0,10), createdAt: Date.now(), fromExam:true, examId: ex.id, examTitle: ex.title, scores };
    DB.assessments.push(as);
    await sSet('assessments', DB.assessments);
    ex.publishedAssessmentId = as.id;
    await sSet('exams', DB.exams);
    logAudit('Published exam to Assessments', `${ex.title} (${Object.keys(scores).length} student${Object.keys(scores).length!==1?'s':''})`);
    toast(stillPending>0 ? `Published — ${stillPending} answer(s) still need review and will update the score when resolved.` : 'Exam scores published to Assessments — they now feed into student reports.', 'success');
    render();
  }

  /* ============================= LIVE EXAMS: TAKING (paced, one question at a time) ============================= */
  let examTimerInterval = null;
  // Reveals the next riddle clue by appending it directly to the DOM, rather than doing
  // a full render() — a full render would recreate the answer <input>, wiping out
  // whatever the student had already started typing right as a new clue lands.
  function revealNextRiddleClueInPlace(qq, revealedCount){
    const clues = qq.clues||[];
    const container = document.getElementById('exam-riddle-clues');
    if(container){
      const existing = container.querySelectorAll('p').length;
      for(let c=existing; c<revealedCount; c++){
        const p = document.createElement('p');
        p.style.margin = '4px 0';
        p.innerHTML = `<strong>Clue ${c+1}:</strong> ${escapeHtml(clues[c])}`;
        container.appendChild(p);
      }
    }
    const ptsEl = document.getElementById('exam-riddle-pts');
    if(ptsEl){
      const nextCluePts = revealedCount<=1 ? 5 : (revealedCount===2 ? 4 : 3);
      ptsEl.textContent = nextCluePts;
    }
  }
  function stopExamTimer(){
    if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval = null; }
  }
  function startExamTimer(){
    stopExamTimer();
    examTimerInterval = setInterval(()=>{
      if(!ui.examAttempt){ stopExamTimer(); return; }
      const {exam, name, record} = ui.examAttempt;
      if(record.submitted){ stopExamTimer(); return; }
      const qOrder = getShuffledQuestionOrder(exam, name);
      const qq = (exam.questions||[]).find(qz=>qz.id===qOrder[record.currentIndex||0]);
      if(!qq){ stopExamTimer(); return; }
      const elapsed = Date.now() - (record.questionStartedAt||Date.now());
      const timeLimitMs = questionTimeLimitSec(qq, exam)*1000;
      const remaining = timeLimitMs - elapsed;
      if(remaining<=0){
        timeoutCurrentQuestion(); // async; next tick(s) read the updated state
        return;
      }
      const el = document.getElementById('exam-timer-display');
      if(el) el.textContent = formatMs(remaining);
      if(qq.type==='riddle'){
        const revealedCount = Math.min((qq.clues||[]).length, Math.floor(elapsed/((exam.riddleClueSeconds||5)*1000))+1);
        if(revealedCount !== ui.examLastRevealedCount){
          ui.examLastRevealedCount = revealedCount;
          revealNextRiddleClueInPlace(qq, revealedCount);
        }
      }
    }, 1000);
  }

  async function startOrResumeExam(){
    const codeEl = q('#f-take-code');
    const nameEl = q('#f-take-name');
    const pinEl = q('#f-take-pin');
    const code = (codeEl ? codeEl.value : '').trim().toUpperCase();
    const name = nameEl ? nameEl.value : '';
    const pin = (pinEl ? pinEl.value : '').trim();
    ui.examTakeError = null;
    if(!code || !name){ ui.examTakeError = 'Pick your name and enter the exam code.'; render(); return; }
    const exams = await sGet('exams');
    if(exams) DB.exams = exams;
    const studentPins = await sGet('student_pins');
    if(studentPins) DB.studentPins = studentPins;
    const ex = (DB.exams||[]).find(e=>e.code && e.code.toUpperCase()===code);
    if(!ex){ ui.examTakeError = 'No exam found with that code.'; render(); return; }
    if(!ex.questions || ex.questions.length===0){ ui.examTakeError = 'This exam has no questions yet — check with your coach.'; render(); return; }
    // Student-level PINs persist across exams — only exam-level pins from before this
    // feature existed fall back to the old per-exam value.
    const requiredPin = (DB.studentPins && DB.studentPins[name]) || (ex.studentPins && ex.studentPins[name]);
    if(requiredPin){
      if(!pin){ ui.examTakeError = 'Enter your PIN.'; render(); return; }
      if(pin !== requiredPin){ ui.examTakeError = 'That PIN doesn\'t match this name — check with your coach.'; render(); return; }
    }
    let record = await sGet(`exam_attempt:${ex.id}:${name}`);
    const now = Date.now();
    if(record && record.submitted){
      stopExamTimer(); stopReaderPoll();
      ui.examAttempt = { exam: ex, name, record };
      render();
      return;
    }
    if(!record){
      if(ex.status!=='open'){ ui.examTakeError = 'This exam is not currently open.'; render(); return; }
      record = { examId: ex.id, name, startedAt: now, currentIndex:0, questionStartedAt: now, perQuestionResults:{}, submitted:false, submittedAt:null, score:null, maxScore:null, subjectScores:null, pending:[], timedOutCount:0 };
      await sSet(`exam_attempt:${ex.id}:${name}`, record);
    }
    ui.examLastRevealedCount = null;
    ui.examAttempt = { exam: ex, name, record };

    if(ex.mode==='reader'){
      startReaderPoll();
      render();
      return;
    }

    // Catch up on any question(s) that fully timed out while the student was away.
    const qOrder = getShuffledQuestionOrder(ex, name);
    let guard = 0;
    while(ui.examAttempt && !ui.examAttempt.record.submitted && guard < qOrder.length+1){
      guard++;
      const idx = ui.examAttempt.record.currentIndex||0;
      if(idx >= qOrder.length){ await finalizeExamAttempt(); break; }
      const qq = (ex.questions||[]).find(qz=>qz.id===qOrder[idx]);
      if(!qq) break;
      const elapsed = now - (ui.examAttempt.record.questionStartedAt||now);
      if(elapsed >= questionTimeLimitSec(qq, ex)*1000){
        await timeoutCurrentQuestion();
      } else break;
    }
    if(ui.examAttempt && !ui.examAttempt.record.submitted) startExamTimer();
    render();
  }

  let examReaderPollInterval = null;
  function stopReaderPoll(){
    if(examReaderPollInterval){ clearInterval(examReaderPollInterval); examReaderPollInterval = null; }
  }
  function startReaderPoll(){
    stopReaderPoll();
    examReaderPollInterval = setInterval(async ()=>{
      if(!ui.examAttempt){ stopReaderPoll(); return; }
      const {exam, name} = ui.examAttempt;
      let freshEx = exam, rec = ui.examAttempt.record;
      try{
        const exams = await sGet('exams');
        const found = (exams||[]).find(e=>e.id===exam.id);
        if(found) freshEx = found;
        const freshRec = await sGet(`exam_attempt:${exam.id}:${name}`);
        if(freshRec) rec = freshRec;
      } catch(e){ /* transient network hiccup — try again next tick */ }
      const changed = freshEx.readerIndex!==ui.examAttempt.exam.readerIndex || rec.submitted!==ui.examAttempt.record.submitted || JSON.stringify(rec.perQuestionResults)!==JSON.stringify(ui.examAttempt.record.perQuestionResults);
      ui.examAttempt.exam = freshEx;
      ui.examAttempt.record = rec;
      if(rec.submitted) stopReaderPoll();
      if(changed) render();
    }, 2500);
  }

  async function submitReaderAnswer(){
    if(!ui.examAttempt) return;
    const {exam, name, record} = ui.examAttempt;
    const qq = (exam.questions||[])[exam.readerIndex||0];
    if(!qq) return;
    let raw;
    if(qq.type==='mcq' || qq.type==='true_false'){
      const checked = q('input[name="q-current"]:checked');
      if(!checked){ toast('Pick an option first.', 'error'); return; }
      raw = checked.value;
    } else {
      const inputEl = q('#exam-text-input');
      raw = inputEl ? inputEl.value : '';
      if(!raw.trim()){ toast('Type your answer first.', 'error'); return; }
    }
    if(!record.perQuestionResults) record.perQuestionResults = {};
    if(record.perQuestionResults[qq.id]) return; // already answered — guard double submit
    const outcome = resolveQuestionOutcome(qq, raw, exam, qq.type==='riddle' ? 1 : undefined);
    record.perQuestionResults[qq.id] = { ...outcome, rawAnswer: raw||'', timedOut:false };
    await sSet(`exam_attempt:${exam.id}:${name}`, record);
    render();
  }

  async function persistExamAttempt(){
    if(!ui.examAttempt) return;
    const {exam, name, record} = ui.examAttempt;
    await sSet(`exam_attempt:${exam.id}:${name}`, record);
  }

  async function advanceOrFinalize(){
    if(!ui.examAttempt) return;
    const {exam, name, record} = ui.examAttempt;
    const qOrder = getShuffledQuestionOrder(exam, name);
    record.currentIndex = (record.currentIndex||0) + 1;
    record.questionStartedAt = Date.now();
    ui.examLastRevealedCount = null;
    if(record.currentIndex >= qOrder.length){
      await finalizeExamAttempt();
    } else {
      await persistExamAttempt();
      render();
    }
  }

  async function answerCurrentQuestion(rawAnswer, clueIndex, isTimeout){
    if(!ui.examAttempt) return;
    const {exam, name, record} = ui.examAttempt;
    const qOrder = getShuffledQuestionOrder(exam, name);
    const qid = qOrder[record.currentIndex||0];
    if(!qid) return;
    if(!record.perQuestionResults) record.perQuestionResults = {};
    if(record.perQuestionResults[qid]) return; // guard against double-submit
    const qq = (exam.questions||[]).find(qz=>qz.id===qid);
    if(!qq) return;
    const outcome = resolveQuestionOutcome(qq, rawAnswer, exam, clueIndex);
    record.perQuestionResults[qid] = { ...outcome, rawAnswer: rawAnswer||'', timedOut: !!isTimeout };
    if(isTimeout) record.timedOutCount = (record.timedOutCount||0) + 1;
    await advanceOrFinalize();
  }

  async function timeoutCurrentQuestion(){
    await answerCurrentQuestion(undefined, undefined, true);
  }

  async function submitCurrentAnswer(){
    if(!ui.examAttempt) return;
    const {exam, name, record} = ui.examAttempt;
    const qOrder = getShuffledQuestionOrder(exam, name);
    const qq = (exam.questions||[]).find(qz=>qz.id===qOrder[record.currentIndex||0]);
    if(!qq) return;
    if(qq.type==='mcq' || qq.type==='true_false'){
      const checked = q('input[name="q-current"]:checked');
      if(!checked){ toast('Pick an option first.', 'error'); return; }
      await answerCurrentQuestion(checked.value, undefined, false);
    } else if(qq.type==='riddle'){
      const inputEl = q('#exam-riddle-input');
      const raw = inputEl ? inputEl.value : '';
      if(!raw.trim()){ toast('Type your answer first.', 'error'); return; }
      const elapsed = Date.now() - (record.questionStartedAt||Date.now());
      const revealedCount = Math.min((qq.clues||[]).length, Math.floor(elapsed/((exam.riddleClueSeconds||5)*1000))+1);
      await answerCurrentQuestion(raw, revealedCount, false);
    } else {
      const inputEl = q('#exam-text-input');
      const raw = inputEl ? inputEl.value : '';
      if(!raw.trim()){ toast('Type your answer first.', 'error'); return; }
      await answerCurrentQuestion(raw, undefined, false);
    }
  }

  // Aggregates whatever's in record.perQuestionResults into a final score/subject
  // breakdown/pending list and marks the record submitted. Shared by both the self-paced
  // finalize (triggered by the student finishing) and the reader-mode batch finalize
  // (triggered by the coach ending the session for everyone at once).
  function finalizeAttemptScore(exam, record){
    let score=0, maxScore=0;
    const subjectScores = {};
    const pending = [];
    (exam.questions||[]).forEach(qq=>{
      const maxPts = qq.type==='riddle' ? 5 : (qq.points||1);
      maxScore += maxPts;
      if(!subjectScores[qq.subject]) subjectScores[qq.subject] = {earned:0, max:0};
      subjectScores[qq.subject].max += maxPts;
      const res = (record.perQuestionResults||{})[qq.id];
      if(!res) return; // never reached/answered
      if(res.status==='pending'){
        pending.push({ qid: qq.id, subject: qq.subject, points: res.cluePts!=null?res.cluePts:maxPts, rawAnswer: res.rawAnswer, hint: res.hint, penaltyIfWrong: res.penaltyIfWrong||0 });
      } else {
        score += res.earned;
        subjectScores[qq.subject].earned += res.earned;
      }
    });
    record.submitted = true;
    record.submittedAt = Date.now();
    record.score = score;
    record.maxScore = maxScore;
    record.subjectScores = subjectScores;
    record.pending = pending;
    return record;
  }

  async function finalizeExamAttempt(){
    if(!ui.examAttempt) return;
    stopExamTimer();
    const {exam, name, record} = ui.examAttempt;
    if(record.submitted) return;
    finalizeAttemptScore(exam, record);
    await sSet(`exam_attempt:${exam.id}:${name}`, record);
    ui.examAttempt = { exam, name, record };
    toast('Exam submitted.', 'success');
    render();
  }

  function exitExamAttempt(){
    stopExamTimer();
    stopReaderPoll();
    ui.examAttempt = null;
    render();
  }

  async function generateFixtureForStage(stageIdx, mode){
    if(!ui.isStaff){ alert('Staff or coach access is required to generate a fixture.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    const seedIds = mode==='norepeat' ? stage.competitorIds.filter(cid=>{
      const c = t.competitors.find(x=>x.id===cid); return c && c.seed;
    }) : [];

    if(mode==='norepeat'){
      const result = generateNoRepeatFixture(stage.competitorIds, stage.gamesPerCompetitor, seedIds);
      if(!result.ok){ ui.lastFixtureError = result.reason; toast(result.reason, 'error'); render(); return; }
      const rounds = packIntoRounds(result.matches);
      stage.matches = [];
      rounds.forEach(round=>{
        round.forEach(m=>{
          stage.matches.push({id:uid('m'), slots:m.slots, results:{}, completed:false});
        });
      });
    } else {
      // serpentine — needs a rank order; use current standings if any prior data, else input order
      const priorStandings = computeStandings(t, stage);
      let rankedIds;
      const anyPlayed = priorStandings.some(s=>s.played>0);
      rankedIds = anyPlayed ? priorStandings.map(s=>s.cid) : stage.competitorIds.slice();
      const groups = generateSerpentineFixture(rankedIds, 3);
      // validate group sizes are all 3
      const bad = groups.find(g=>g.slots.length!==3);
      if(bad){
        const msg = 'Balanced grouping needs the competitor count to be a multiple of 3. Adjust qualifier count and try again.';
        ui.lastFixtureError = msg; toast(msg, 'error'); render(); return;
      }
      stage.matches = groups.map(g=>({id:uid('m'), slots:g.slots, results:{}, completed:false}));
    }
    ui.lastFixtureError = null;
    saveCurrentTournament();
    render();
  }

  async function generateFinalFixture(stageIdx, gamesCount){
    if(!ui.isStaff){ alert('Staff or coach access is required to generate a fixture.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    stage.gamesPerCompetitor = gamesCount;
    stage.matches = [];
    for(let i=0;i<gamesCount;i++){
      stage.matches.push({id:uid('m'), slots:stage.competitorIds.slice(), results:{}, completed:false});
    }
    saveCurrentTournament();
    render();
  }

  async function finishLiveMatch(mi){
    if(!ui.isScorer){ alert('Scorer, staff, or coach access is required.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const m = stage.matches[mi];
    if(!m.live){ toast('Nothing scored yet.', 'error'); return; }
    const seatTotals = computeSeatTotals(m);
    const totals = {}; m.slots.forEach((cid,i)=>{ totals[cid] = seatTotals[i]; });
    const ranked = computeRanksFromScores(totals);
    const anyTie = Object.values(ranked).some(r=>r.tied);
    m.results = ranked;
    m.completed = true;
    saveCurrentTournament();
    toast(anyTie ? 'Tied score detected — points for that position were split evenly.' : 'Match result saved.', anyTie?'info':'success');
    render();
  }

  async function advanceStage(){
    if(!ui.isStaff){ alert('Staff or coach access is required.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const labelEl = q('#f-next-label');
    const label = labelEl ? (labelEl.value.trim() || 'Next stage') : 'Next stage';
    const standings = computeStandings(t, stage);
    const qualified = (ui.qualifySelection && ui.qualifySelection.length>=3)
      ? ui.qualifySelection.slice()
      : standings.slice(0, suggestQualifyN(standings.length)).map(s=>s.cid);
    stage.qualifyN = qualified.length;
    stage.qualifiedIds = qualified;
    ui.qualifySelection = null;
    ui.qualifySelectionStage = null;

    const nextStage = {
      key: 'stage'+(t.stages.length),
      label,
      gamesPerCompetitor: qualified.length===3 ? 1 : 1,
      competitorIds: qualified,
      matches: [], qualifyN:null, locked:false
    };
    t.stages.push(nextStage);
    t.currentStageIndex = t.stages.length-1;
    ui.viewingStageIdx = t.currentStageIndex;
    saveCurrentTournament();
    render();
  }

  async function declareChampion(){
    if(!ui.isStaff){ alert('Staff or coach access is required.'); return; }
    const pickEl = q('#f-champion-pick');
    if(!pickEl) return;
    currentTournament.champion = pickEl.value;
    saveCurrentTournament();
    render();
  }

  /* ============================= UTIL ============================= */
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ============================= INIT ============================= */
  async function init(){
    const students = await sGet('students');
    const legacyRoster = await sGet('roster'); // migrate from the old free-text roster
    const tIndex = await sGet('tournament_index');
    const accessPins = await sGet('access_pins');
    const legacyCoachPin = await sGet('coach_pin'); // migrate from the old single-PIN system
    const meetings = await sGet('meetings');
    const assessments = await sGet('assessments');
    const weights = await sGet('selection_weights');
    const notes = await sGet('student_notes');
    const exams = await sGet('exams');
    const auditLog = await sGet('audit_log');
    const studentPins = await sGet('student_pins');
    if(students){
      DB.students = students;
    } else if(legacyRoster && legacyRoster.length){
      DB.students = legacyRoster.map(name=>({ id: uid('stu'), name, yearOfAdmission:'', class:'', createdAt: Date.now() }));
      await sSet('students', DB.students); // one-time migration — year/class left blank, fill in on the Students tab
    } else {
      DB.students = [];
    }
    DB.tIndex = tIndex || [];
    DB.meetings = meetings || [];
    DB.assessments = assessments || [];
    DB.weights = weights || {attendance:30, assessment:30, quiz:40};
    DB.notes = notes || {};
    DB.exams = exams || [];
    DB.auditLog = auditLog || [];
    DB.studentPins = studentPins || {};
    if(accessPins){
      DB.pins = accessPins;
    } else if(legacyCoachPin){
      DB.pins = {coach: legacyCoachPin, staff:null, scorer:null};
      await sSet('access_pins', DB.pins); // one-time migration
    } else {
      DB.pins = {coach:null, staff:null, scorer:null};
    }
    DB.fullCache = [];
    // preload all tournament blobs for profile aggregation
    for(const summary of DB.tIndex){
      const full = await sGet('tournament:'+summary.id);
      if(full) DB.fullCache.push(full);
    }
    render();
  }

  init();
})();
</script>
