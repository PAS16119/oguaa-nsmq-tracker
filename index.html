    sSet('student_notes', DB.notes);
    ui.editingNotesFor = null;
    toast('Note saved.', 'success');
    render();
  }

  function buildContestBreakdown(){
    const out = {};
    function ensure(name){
      if(!out[name]) out[name] = {
        bySubject: Object.fromEntries(SUBJECTS.map(s=>[s,{correct:0,wrong:0,pts:0}])),
        byRound: {
          fundamentals:{pts:0,correct:0,wrong:0},
          speedRace:{pts:0,correct:0,wrong:0},
          potd:{pts:0,count:0},
          trueFalse:{pts:0,correct:0,wrong:0},
          riddles:{pts:0,solved:0}
        }
      };
      return out[name];
    }
    (DB.fullCache||[]).forEach(t=>{
      (t.stages||[]).forEach(stage=>{
        (stage.matches||[]).forEach(m=>{
          if(!m.completed || !m.live) return;
          const cidNames = {};
          m.slots.forEach(cid=>{
            const comp = (t.competitors||[]).find(c=>c.id===cid);
            if(comp && comp.type!=='guest') cidNames[cid] = comp.memberNames && comp.memberNames.length ? comp.memberNames : [comp.name];
          });
          (m.substitutions||[]).forEach(s=>{
            if(cidNames[s.inCid]) return;
            const comp = (t.competitors||[]).find(c=>c.id===s.inCid);
            if(comp && comp.type!=='guest') cidNames[s.inCid] = comp.memberNames && comp.memberNames.length ? comp.memberNames : [comp.name];
          });
          function credit(cid, subject, pts, isCorrect, roundKey){
            const names = cidNames[cid]; if(!names) return;
            names.forEach(nm=>{
              const p = ensure(nm);
              if(subject){
                p.bySubject[subject].pts += pts;
                if(isCorrect===true) p.bySubject[subject].correct++;
                if(isCorrect===false) p.bySubject[subject].wrong++;
              }
              const rb = p.byRound[roundKey];
              rb.pts += pts;
              if(roundKey==='potd'){ rb.count++; return; }
              if(roundKey==='riddles'){ if(isCorrect) rb.solved++; return; }
              if(isCorrect===true) rb.correct++;
              if(isCorrect===false) rb.wrong++;
            });
          }
          function creditGridRound(roundKey){
            const info = ROUND_INFO[roundKey];
            (m.live[roundKey]||[]).forEach(slot=>{
              Object.entries(slot.turns||{}).forEach(([cid, turn])=>{
                if(turn.mainScore!=null){
                  credit(cid, slot.subject, turn.mainScore, turn.mainScore>=info.mainCorrect, roundKey);
                }
                if(turn.bonusCid && turn.bonusResult){
                  const pts = turn.bonusResult==='correct' ? info.bonusCorrect : info.bonusWrong;
                  credit(turn.bonusCid, slot.subject, pts, turn.bonusResult==='correct', roundKey);
                }
              });
            });
          }
          creditGridRound('fundamentals');
          (m.live.speedRace||[]).forEach(item=>{
            (item.attempts||[]).forEach((att,idx)=>{
              if(!att || !att.cid || !att.result) return;
              const ladder = ROUND_INFO.speedRace.ladder[idx]!==undefined?ROUND_INFO.speedRace.ladder[idx]:1;
              const pts = att.result==='correct'?ladder:ROUND_INFO.speedRace.wrong;
              credit(att.cid, item.subject, pts, att.result==='correct', 'speedRace');
            });
          });
          if(m.live.potd && !(m.live.skip&&m.live.skip.potd)){
            Object.entries(m.live.potd.scores||{}).forEach(([cid,score])=>{
              credit(cid, m.live.potd.subject, parseFloat(score)||0, null, 'potd');
            });
          }
          creditGridRound('trueFalse');
          (m.live.riddles||[]).forEach(item=>{
            if(item.winnerCid && item.clue){
              const pts = ROUND_INFO.riddles.cluePoints[item.clue]||ROUND_INFO.riddles.cluePoints[3];
              credit(item.winnerCid, item.subject, pts, true, 'riddles');
            }
          });
        });
      });
    });
    return out;
  }

  /* ============================= SQUAD: ATTENDANCE, ASSESSMENTS, AGGREGATE SCORE ============================= */
  function computeAttendancePct(name){
    let present=0, total=0;
    (DB.meetings||[]).forEach(mt=>{
      if(mt.attendance && Object.prototype.hasOwnProperty.call(mt.attendance, name)){
        total++;
        if(mt.attendance[name]) present++;
      }
    });
    return { pct: total>0 ? (present/total*100) : 0, count: total, present };
  }

  // Returns the max score for a given subject on an assessment — supports per-subject
  // maxes (used by auto-published exam results, where subjects can have different
  // question counts) with a uniform as.maxScore as the fallback for manually entered tests.
  function subjectMaxFor(as, subject){
    if(as.subjectMax && as.subjectMax[subject]!=null) return as.subjectMax[subject];
    return as.maxScore;
  }

  function computeAssessmentPct(name){
    let sum=0, count=0;
    (DB.assessments||[]).forEach(as=>{
      if(!as.scores || !Object.prototype.hasOwnProperty.call(as.scores, name)) return;
      const rec = as.scores[name];
      if(typeof rec === 'number'){
        // legacy: one total score out of maxScore
        if(!(as.maxScore>0)) return;
        sum += (rec/as.maxScore)*100;
        count++;
      } else if(rec && typeof rec === 'object'){
        // per-subject: each subject out of its own max, combined into one % for this assessment
        let subjTotal=0, subjMax=0;
        SUBJECTS.forEach(s=>{
          const v = rec[s];
          if(v!==undefined && v!==null && v!==''){
            const mx = subjectMaxFor(as, s);
            if(mx>0){ subjTotal += (parseFloat(v)||0); subjMax += mx; }
          }
        });
        if(subjMax>0){ sum += (subjTotal/subjMax)*100; count++; }
      }
    });
    return { pct: count>0 ? sum/count : 0, count };
  }

  // Subject-wise exam average across all assessments, for report breakdowns and weak/strong-subject flags.
  function computeAssessmentSubjectPct(name){
    const out = {};
    SUBJECTS.forEach(s=>{ out[s] = {sum:0, count:0}; });
    (DB.assessments||[]).forEach(as=>{
      const rec = as.scores ? as.scores[name] : undefined;
      if(!rec || typeof rec !== 'object') return;
      SUBJECTS.forEach(s=>{
        const v = rec[s];
        const mx = subjectMaxFor(as, s);
        if(v!==undefined && v!==null && v!=='' && mx>0){
          out[s].sum += (parseFloat(v)/mx)*100;
          out[s].count++;
        }
      });
    });
    SUBJECTS.forEach(s=>{ out[s].pct = out[s].count>0 ? out[s].sum/out[s].count : null; });
    return out;
  }

  // Compares a student's earlier assessment scores against their more recent ones to
  // surface whether they're trending up or down over time — not just a flat average.
  function computeAssessmentTrend(name){
    const relevant = (DB.assessments||[])
      .filter(as=>as.scores && Object.prototype.hasOwnProperty.call(as.scores, name))
      .sort((a,b)=>a.createdAt-b.createdAt);
    const pctFor = as=>{
      const rec = as.scores[name];
      if(typeof rec==='number') return as.maxScore>0 ? (rec/as.maxScore)*100 : null;
      if(rec && typeof rec==='object'){
        let total=0, max=0;
        SUBJECTS.forEach(s=>{
          const v = rec[s];
          if(v!==undefined && v!==null && v!==''){
            const mx = subjectMaxFor(as, s);
            if(mx>0){ total += parseFloat(v)||0; max += mx; }
          }
        });
        return max>0 ? (total/max)*100 : null;
      }
      return null;
    };
    const pcts = relevant.map(pctFor).filter(p=>p!=null);
    if(pcts.length<4) return null; // too few data points to say anything meaningful
    const mid = Math.floor(pcts.length/2);
    const avg = arr=>arr.reduce((a,b)=>a+b,0)/arr.length;
    const earlierAvg = avg(pcts.slice(0,mid));
    const laterAvg = avg(pcts.slice(mid));
    return { earlierAvg, laterAvg, delta: laterAvg-earlierAvg, count: pcts.length };
  }

  // Turns whatever weakness data is available (contest subject, exam subject, question
  // type) into one concrete "practice this next" line — the piece that closes the loop
  // from measuring performance to actually doing something about it.
  function buildRecommendation(name, bd, asmSubj, typeStats){
    const candidates = [];
    if(bd){
      SUBJECTS.forEach(s=>{
        const v = bd.bySubject[s];
        const attempts = v.correct+v.wrong;
        if(attempts>=3){
          const acc = v.correct/attempts;
          candidates.push({ label:`${s} in contests`, acc, weight:attempts });
        }
      });
    }
    SUBJECTS.forEach(s=>{
      const v = asmSubj[s];
      if(v.count>=2 && v.pct!=null){
        candidates.push({ label:`${s} in exams/assessments`, acc:v.pct/100, weight:v.count });
      }
    });
    if(typeStats){
      Object.entries(typeStats).forEach(([type,v])=>{
        const attempts = v.correct+v.wrong;
        if(attempts>=3){
          candidates.push({ label:`${QTYPE_LABELS[type]||type} questions`, acc:v.correct/attempts, weight:attempts });
        }
      });
    }
    if(candidates.length===0) return null;
    candidates.sort((a,b)=>a.acc-b.acc);
    const weakest = candidates[0];
    if(weakest.acc>=0.75) return null; // nothing weak enough to flag
    return `Recommended focus for ${name}: ${weakest.label} (${Math.round(weakest.acc*100)}% accuracy across ${weakest.weight} attempt${weakest.weight!==1?'s':''}).`;
  }

  function computeQuizPct(name, profiles){
    const p = profiles[name];
    if(!p || p.totalPlayed===0) return null;
    const val = ((3 - p.avgRank)/2)*100; // rank1=100%, rank2=50%, rank3=0%
    return Math.max(0, Math.min(100, val));
  }

  function computeAggregate(attPct, attCount, asmPct, asmCount, quizPct){
    const w = DB.weights;
    const parts = [];
    if(attCount>0) parts.push({v:attPct, w:w.attendance||0});
    if(asmCount>0) parts.push({v:asmPct, w:w.assessment||0});
    if(quizPct!=null) parts.push({v:quizPct, w:w.quiz||0});
    const totalW = parts.reduce((a,b)=>a+b.w,0);
    if(parts.length===0 || totalW<=0) return null;
    return parts.reduce((a,b)=>a+b.v*b.w,0)/totalW;
  }

        <div style="max-width:90px;"><input type="number" id="f-exam-negpenalty" value="1" min="0" step="0.5" title="Points deducted per wrong MCQ/True-False answer"></div>
      </div>
      <div class="row" style="margin-top:6px; align-items:center;">
        <div style="flex:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="f-exam-shortneg" checked style="width:auto;"><label for="f-exam-shortneg" style="margin:0; font-size:13px;">Short answer / numeric / riddle: penalize wrong answers</label></div>
        <div style="max-width:90px;"><input type="number" id="f-exam-shortpenalty" value="1" min="0" step="0.5" title="Points deducted per wrong short-answer/numeric/riddle answer"></div>
      </div>
      <div class="row" style="margin-top:6px; align-items:center;" id="f-exam-shuffle-row">
        <div style="flex:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="f-exam-shuffle" checked style="width:auto;"><label for="f-exam-shuffle" style="margin:0; font-size:13px;">Shuffle question &amp; option order per student</label></div>
      </div>
      <p class="small-note" style="margin-top:6px;">Running out the clock loses the marks for that question but does not trigger the wrong-answer penalty — only an answer that's actually submitted and wrong does. Selecting an MCQ/True-False option submits it immediately and moves to the next question.</p>
      <div class="row" style="margin-top:8px;"><div style="flex:0;"><button class="btn btn-brass" data-create-exam="1">Create</button></div></div>`;
    }
    html += `</div>`;

    const exams = (DB.exams||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(exams.length===0){
      html += `<div class="empty card"><div class="display">No exams yet</div><p>Create one above to get started.</p></div>`;
    }
    exams.forEach(ex=>{ html += renderExamListItem(ex); });
    return html;
  }

  const QTYPE_LABELS = { mcq:'Multiple choice', true_false:'True / False', short:'Short answer', numeric:'Numeric (with units)', riddle:'Riddle (clue-by-clue)' };

  function questionTimeLimitSec(qq, exam){
    const noCalcSec = (exam && exam.noCalcSeconds) || 15;
    const calcSec = (exam && exam.calcSeconds) || 35;
    const clueSec = (exam && exam.riddleClueSeconds) || 5;
    if(qq.type==='riddle') return (qq.clues||[]).length*clueSec + clueSec;
    return qq.requiresCalculation ? calcSec : noCalcSec;
  }

  function renderQuestionSummary(qq, exam){
    let detail = '';
    if(qq.type==='mcq' || qq.type==='true_false'){
      detail = `Correct: ${escapeHtml((qq.options||[])[qq.correctIndex]||'')}`;
    } else if(qq.type==='short'){
      detail = `Accepted: ${(qq.acceptedAnswers||[]).map(escapeHtml).join(', ')}`;
    } else if(qq.type==='numeric'){
      const units = (qq.units||[]).join(' / ');
      detail = `Answer: ${qq.correctValue}${qq.tolerance?` (±${qq.tolerance})`:''}${qq.unitRequired && units ? ' '+escapeHtml(units) : (qq.unitRequired?' — unit required':' — unit optional')}`;
    } else if(qq.type==='riddle'){
      detail = `${(qq.clues||[]).length} clue${(qq.clues||[]).length!==1?'s':''} · answer: ${(qq.acceptedAnswers||[]).map(escapeHtml).join(', ')} · 5/4/3 pts by clue reached`;
    }
    const timing = qq.type==='riddle' ? `${questionTimeLimitSec(qq,exam)}s total` : `${questionTimeLimitSec(qq,exam)}s${qq.requiresCalculation?' (calculation)':''}`;
    return `<span class="pill">${escapeHtml(qq.subject)}</span> <span class="pill" style="opacity:.75;">${QTYPE_LABELS[qq.type]||qq.type}</span> <span class="pill" style="opacity:.75;">${timing}</span> <span style="font-size:13px;">${escapeHtml(qq.text)}</span>
      <div class="small-note" style="margin-top:2px;">${detail}${qq.type!=='riddle'?` · ${qq.points||1} pt${(qq.points||1)!==1?'s':''}`:''}</div>`;
  }

  function renderExamListItem(ex){
    const expanded = ui.expandedExamId === ex.id;
    const qCount = (ex.questions||[]).length;
    const badgeCls = ex.status==='open' ? 'status-live' : (ex.status==='closed' ? 'status-done' : '');
    let html = `<div class="t-list-item" data-toggle-exam="${ex.id}">
      <div><h3>${escapeHtml(ex.title)}</h3><p>${qCount} question${qCount!==1?'s':''}${ex.publishedAssessmentId?' · published to reports':''}</p></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="status-badge ${badgeCls}">${ex.status}</span>
        <span class="pill">${expanded?'▾':'▸'}</span>
      </div>
    </div>`;
    if(!expanded) return html;

    html += `<div class="card" style="background:var(--panel-2); margin-top:-4px; margin-bottom:14px;">`;
    html += `<div class="row" style="align-items:center;">
      <div><span class="pill gold mono" style="font-size:14px;">${ex.code}</span> <span class="small-note">exam code — share with the group</span></div>
    </div>`;
    html += `<div class="row" style="margin-top:10px;">`;
    if(ex.status==='draft') html += `<div style="flex:0;"><button class="btn btn-sm btn-brass" data-exam-open="${ex.id}">Open exam (students can start)</button></div>`;
    if(ex.status==='open') html += `<div style="flex:0;"><button class="btn btn-sm" data-exam-close="${ex.id}">Close (stop new starts)</button></div>`;
    if(ex.status==='closed') html += `<div style="flex:0;"><button class="btn btn-sm" data-exam-open="${ex.id}">Reopen</button></div>`;
    if(ui.isCoach) html += `<div style="flex:0;"><button class="btn btn-sm btn-danger" data-exam-delete="${ex.id}">Delete exam</button></div>`;
    html += `</div>`;
    html += `<p class="small-note" style="margin-top:8px;">Students sign in with their own PIN — same one every exam. Manage PINs from Home → Data &amp; access → Student PINs.</p>`;
    if(ex.mode==='reader') html += renderReaderConsole(ex);

    html += `<div class="divider"></div><h3 class="display" style="font-size:14px;margin:0 0 8px;">Questions</h3>`;
    (ex.questions||[]).forEach(qq=>{
      html += `<div class="row" style="align-items:flex-start; margin-bottom:8px;">
        <div style="flex:1;">${renderQuestionSummary(qq, ex)}</div>
        <div style="flex:0;"><button class="btn btn-sm btn-danger" data-exam-delete-question="${ex.id}|${qq.id}">✕</button></div>
      </div>`;
    });
    if(qCount===0) html += `<p class="small-note">No questions yet — add the first one below.</p>`;

    html += renderQuestionBuilder(ex.id);

    html += `<div class="divider"></div>
      <div class="flex-between">
        <h3 class="display" style="font-size:14px;margin:0;">Live results</h3>
        <button class="btn btn-sm btn-ghost" data-exam-refresh-results="${ex.id}">↻ Refresh</button>
      </div>`;
    if(ui.examMonitor && ui.examMonitor.examId===ex.id){
      const mon = ui.examMonitor;
      html += `<p class="small-note" style="margin:6px 0;">${mon.submittedCount} of ${DB.students.length} submitted${mon.avg!=null?` · average ${Math.round(mon.avg)}%`:''}${mon.pendingCount?` · <strong>${mon.pendingCount} answer${mon.pendingCount!==1?'s':''} need review</strong>`:''}</p>`;
      html += `<table><thead><tr><th>Student</th><th>Status</th><th>Score</th><th></th></tr></thead><tbody>`;
      mon.rows.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{
        html += `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.status)}</td><td class="mono">${r.score!=null?r.score+'/'+r.maxScore+(r.pending?' *':''):'—'}</td><td>${r.score!=null?`<button class="btn btn-sm btn-ghost" data-exam-view-transcript="${ex.id}|${escapeAttr(r.name)}">View answers</button>`:''}</td></tr>`;
      });
      html += `</tbody></table>`;
      if(mon.pendingCount>0) html += `<p class="small-note" style="margin-top:4px;">* provisional — includes unreviewed short-answer/numeric/riddle responses</p>`;
      html += `<div class="row" style="margin-top:10px;">
        <div style="flex:0;"><button class="btn btn-sm ${mon.pendingCount?'btn-brass':''}" data-exam-review="${ex.id}">Review ${mon.pendingCount?`(${mon.pendingCount})`:'answers'}</button></div>
        <div style="flex:0;"><button class="btn btn-sm btn-brass" data-exam-publish="${ex.id}">${ex.publishedAssessmentId?'Republish':'Publish'} scores to Assessments</button></div>
      </div>`;
    } else {
      html += `<p class="small-note">Tap Refresh to load live scores.</p>`;
    }

    if(ui.examReview && ui.examReview.examId===ex.id){
      html += `<div class="divider"></div><h3 class="display" style="font-size:14px;margin:0 0 8px;">Needs review</h3>`;
      if(ui.examReview.items.length===0){
        html += `<p class="small-note">Nothing pending — every short-answer, numeric, and riddle response has been matched automatically.</p>`;
      }
      ui.examReview.items.forEach(it=>{
        html += `<div class="card" style="background:var(--panel); margin-bottom:8px;">
          <p class="small-note" style="margin:0 0 4px;">${escapeHtml(it.studentName)} · ${escapeHtml(it.subject)} · up to ${it.points} pt${it.points!==1?'s':''}</p>
          <p style="margin:0 0 4px; font-size:13px;">${escapeHtml(it.questionText)}</p>
          <p style="margin:0 0 4px;"><strong>Answered:</strong> ${escapeHtml(String(it.rawAnswer||'(blank)'))}</p>
          ${it.acceptedAnswers ? `<p class="small-note" style="margin:0 0 4px;">Accepted: ${it.acceptedAnswers.map(escapeHtml).join(', ')}</p>` : ''}
          ${it.hint ? `<p class="small-note" style="margin:0 0 4px; color:var(--brass-soft);">${escapeHtml(it.hint)}</p>` : ''}
          <div class="row"><div style="flex:0;"><button class="btn btn-sm btn-brass" data-exam-review-decide="${ex.id}|${escapeAttr(it.studentName)}|${it.qid}|correct">✓ Correct</button></div>
          <div style="flex:0;"><button class="btn btn-sm" data-exam-review-decide="${ex.id}|${escapeAttr(it.studentName)}|${it.qid}|incorrect">✕ Incorrect</button></div></div>
        </div>`;
      });
    }

    if(ui.examTranscript && ui.examTranscript.examId===ex.id){
      html += renderExamTranscript(ex, ui.examTranscript.studentName, ui.examTranscript.record);
    }

    html += `</div>`;
    return html;
  }

  function renderExamTranscript(ex, studentName, record){
    let html = `<div class="divider"></div>
      <div class="flex-between"><h3 class="display" style="font-size:14px;margin:0;">${escapeHtml(studentName)}'s answers</h3>
      <button class="btn btn-sm btn-ghost" data-exam-close-transcript="1">✕ Close</button></div>`;
    (ex.questions||[]).forEach((qq,i)=>{
      const res = (record.perQuestionResults||{})[qq.id];
      if(!res){ html += `<p class="small-note" style="margin:6px 0;">Q${i+1}. ${escapeHtml(qq.text)} — not reached.</p>`; return; }
      const statusLabel = { correct:'✓ Correct', incorrect:'✕ Incorrect', pending:'⏳ Pending review', unanswered:'— Unanswered (no penalty)' }[res.status] || res.status;
      const statusColor = res.status==='correct' ? 'var(--brass-soft)' : (res.status==='incorrect' ? '#e06a6a' : 'var(--muted)');
      let answerDisplay = res.rawAnswer || '(blank)';
      if((qq.type==='mcq'||qq.type==='true_false') && res.rawAnswer!==''){
        const idx = parseInt(res.rawAnswer);
        answerDisplay = (qq.options && qq.options[idx]!=null) ? qq.options[idx] : res.rawAnswer;
      }
      html += `<div class="card" style="background:var(--panel-2); margin-bottom:8px;">
        <p class="small-note" style="margin:0 0 4px;">Q${i+1} · ${escapeHtml(qq.subject)} · ${QTYPE_LABELS[qq.type]||qq.type}${res.timedOut?' · timed out':''}</p>
        <p style="margin:0 0 4px; font-size:13px;">${escapeHtml(qq.type==='riddle'?`Riddle: ${(qq.clues||[])[0]||''}`:qq.text)}</p>
        <p style="margin:0 0 4px;"><strong>Answered:</strong> ${escapeHtml(String(answerDisplay))}</p>
        ${(qq.type==='mcq'||qq.type==='true_false') ? `<p class="small-note" style="margin:0 0 4px;">Correct option: ${escapeHtml(qq.options[qq.correctIndex]||'')}</p>` : ''}
        ${qq.acceptedAnswers ? `<p class="small-note" style="margin:0 0 4px;">Accepted: ${qq.acceptedAnswers.map(escapeHtml).join(', ')}</p>` : ''}
        <p style="margin:0; font-weight:600; color:${statusColor};">${statusLabel}${res.status!=='pending'?` · ${res.earned>=0?'+':''}${res.earned} pt${Math.abs(res.earned)!==1?'s':''}`:''}</p>
      </div>`;
    });
    return html;
  }

  function renderReaderConsole(ex){
    const idx = ex.readerIndex||0;
    const qq = (ex.questions||[])[idx];
    let html = `<div class="card" style="background:var(--panel); margin-top:10px;">
      <h3 style="margin:0 0 8px; font-size:14px;">Reader console — question ${idx+1} of ${(ex.questions||[]).length}</h3>`;
    if(qq){
      html += `<p class="small-note" style="margin:0 0 4px;">${escapeHtml(qq.subject)} · ${QTYPE_LABELS[qq.type]||qq.type}</p>`;
      if(qq.type==='riddle'){
        html += `<div style="margin:0 0 8px;">${(qq.clues||[]).map((c,i)=>`<p style="margin:2px 0; font-size:13px;"><strong>Clue ${i+1}:</strong> ${escapeHtml(c)}</p>`).join('')}
          <p class="small-note">Accepted: ${(qq.acceptedAnswers||[]).map(escapeHtml).join(', ')}</p></div>`;
      } else {
        html += `<p style="font-weight:600; margin:0 0 8px;">${escapeHtml(qq.text)}</p>`;
        if(qq.type==='mcq' || qq.type==='true_false'){
          html += `<ul style="margin:0 0 8px; padding-left:18px;">${(qq.options||[]).map((o,i)=>`<li>${i===qq.correctIndex?'<strong>':''}${escapeHtml(o)}${i===qq.correctIndex?' ✓</strong>':''}</li>`).join('')}</ul>`;
        } else if(qq.acceptedAnswers){
          html += `<p class="small-note" style="margin:0 0 8px;">Accepted: ${qq.acceptedAnswers.map(escapeHtml).join(', ')}</p>`;
        } else if(qq.correctValue!=null){
          html += `<p class="small-note" style="margin:0 0 8px;">Answer: ${qq.correctValue}${qq.tolerance?` (±${qq.tolerance})`:''}${qq.units&&qq.units.length?' '+escapeHtml(qq.units.join(' / ')):''}</p>`;
        }
      }
    } else {
      html += `<p class="small-note">No questions in this exam yet.</p>`;
    }
    html += `<div class="row">
      <div style="flex:0;"><button class="btn btn-sm" data-reader-prev="${ex.id}" ${idx<=0?'disabled':''}>← Previous</button></div>
      <div style="flex:0;"><button class="btn btn-sm btn-brass" data-reader-next="${ex.id}" ${idx>=(ex.questions||[]).length-1?'disabled':''}>Next question →</button></div>
      <div style="flex:0;"><button class="btn btn-sm btn-danger" data-reader-finish="${ex.id}">Finish exam for everyone</button></div>
    </div>`;
    html += `</div>`;
    return html;
  }

  function renderQuestionBuilder(examId){
    const opts4 = [0,1,2,3];
    let html = `<div class="divider"></div><h3 class="display" style="font-size:14px;margin:0 0 8px;">Add a question</h3>
      <div class="row">
        <div><label class="field">Type</label><select id="f-eq-type-${examId}" data-eq-type-select="${examId}">
          <option value="mcq">Multiple choice</option>
          <option value="true_false">True / False</option>
          <option value="short">Short answer (one/few words)</option>
          <option value="numeric">Numeric — with units</option>
          <option value="riddle">Riddle — clues revealed one at a time</option>
        </select></div>
        <div><label class="field">Subject</label><select id="f-eq-subject-${examId}">${SUBJECTS.map(s=>`<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('')}</select></div>
        <div id="eq-points-wrap-${examId}"><label class="field">Points</label><input type="number" id="f-eq-points-${examId}" min="1" value="2" style="max-width:80px;"></div>
      </div>
      <div id="eq-calc-wrap-${examId}" class="row" style="margin-top:6px; align-items:center;">
        <div style="flex:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="f-eq-calc-${examId}" style="width:auto;"><label for="f-eq-calc-${examId}" style="margin:0; font-size:13px;">Requires calculation (gives 35s instead of 15s)</label></div>
      </div>
      <div style="margin-top:8px;"><textarea id="f-eq-text-${examId}" rows="2" placeholder="Question text"></textarea></div>`;

    // MCQ group
    html += `<div id="eq-group-mcq-${examId}">`;
    opts4.forEach(i=>{
      html += `<div class="row" style="margin-top:6px; align-items:center;">
        <div style="flex:0;"><input type="radio" name="f-eq-correct-${examId}" value="${i}" id="f-eq-correct-${examId}-${i}"></div>
        <div><input type="text" id="f-eq-opt-${examId}-${i}" placeholder="Option ${i+1}"></div>
      </div>`;
    });
    html += `<p class="small-note" style="margin-top:4px;">Tick the radio next to the correct option.</p></div>`;

    // True/False group
    html += `<div id="eq-group-true_false-${examId}" style="display:none;">
      <div class="row" style="margin-top:6px;">
        <div style="flex:0; display:flex; align-items:center; gap:6px;"><input type="radio" name="f-eq-tf-${examId}" value="0" id="f-eq-tf-${examId}-0"><label for="f-eq-tf-${examId}-0" style="margin:0;">True is correct</label></div>
        <div style="flex:0; display:flex; align-items:center; gap:6px;"><input type="radio" name="f-eq-tf-${examId}" value="1" id="f-eq-tf-${examId}-1"><label for="f-eq-tf-${examId}-1" style="margin:0;">False is correct</label></div>
      </div>
    </div>`;

    // Short answer group
    html += `<div id="eq-group-short-${examId}" style="display:none;">
      <div style="margin-top:6px;"><input type="text" id="f-eq-short-accepted-${examId}" placeholder="Accepted answers, separated by | (e.g. mitochondria | mitochondrion)"></div>
      <p class="small-note" style="margin-top:4px;">Marking is case/spacing-insensitive. Close-but-not-exact answers are queued for you to approve instead of auto-failed.</p>
    </div>`;

    // Numeric group
    html += `<div id="eq-group-numeric-${examId}" style="display:none;">
      <div class="row" style="margin-top:6px;">
        <div><label class="field">Correct value</label><input type="number" step="any" id="f-eq-num-value-${examId}" placeholder="e.g. 5"></div>
        <div><label class="field">Tolerance (±)</label><input type="number" step="any" min="0" value="0" id="f-eq-num-tol-${examId}"></div>
      </div>
      <div style="margin-top:6px;"><input type="text" id="f-eq-num-units-${examId}" placeholder="Accepted units, separated by | (e.g. m^2 | m2 | sqm)"></div>
      <div class="row" style="margin-top:6px; align-items:center;">
        <div style="flex:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="f-eq-num-unitreq-${examId}" checked style="width:auto;"><label for="f-eq-num-unitreq-${examId}" style="margin:0; font-size:13px;">Unit required (a bare number is marked wrong)</label></div>
      </div>
    </div>`;

    // Riddle group
    html += `<div id="eq-group-riddle-${examId}" style="display:none;">
      <p class="small-note" style="margin:6px 0 4px;">One clue per line. Clue 1 shows immediately; each next clue appears 5 seconds later. Answering on clue 1 scores 5 pts, clue 2 scores 4, clue 3 or later scores 3.</p>
      <textarea id="f-eq-riddle-clues-${examId}" rows="4" placeholder="I am a unicellular free-living organism.&#10;I belong to the phylum Rhizopoda.&#10;I move using pseudopodia."></textarea>
      <div style="margin-top:6px;"><input type="text" id="f-eq-riddle-accepted-${examId}" placeholder="Accepted answers, separated by | (e.g. amoeba | ameba)"></div>
    </div>`;

    html += `<button class="btn btn-sm" style="margin-top:10px;" data-exam-add-question="${examId}">Add question</button>
      <button class="btn btn-sm btn-ghost" style="margin-top:10px; margin-left:6px;" data-toggle-exam-bulk="${examId}">${ui.examBulkOpen[examId]?'▾ Hide bulk-add':'⇪ Bulk-add (paste many)'}</button>`;

    if(ui.examBulkOpen[examId]){
      html += `<div class="card" style="background:var(--panel); margin-top:10px;">
        <p class="small-note" style="margin:0 0 6px;">One question per line, fields separated by <code>||</code>. Use <code>;</code> to separate lists within a field (accepted answers, units, clues). Blank lines and lines starting with # are ignored.</p>
        <pre style="font-size:11px; white-space:pre-wrap; background:var(--panel-2); padding:8px; border-radius:6px; margin:0 0 8px;"># MCQ||Subject||Question||OptA||OptB||OptC||OptD||CorrectLetter(A-D)||Points||Calc(Y/N)
MCQ||Biology||Powerhouse of the cell?||Nucleus||Mitochondria||Ribosome||Golgi||B||2||N
# TF||Subject||Statement||True/False||Points||Calc(Y/N)
TF||Physics||Light travels faster than sound||True||2||N
# SHORT||Subject||Question||accepted;answers||Points||Calc(Y/N)
SHORT||Biology||Organelle that does photosynthesis?||chloroplast;chloroplasts||3||N
# NUMERIC||Subject||Question||value||tolerance||units;alt||UnitRequired(Y/N)||Points||Calc(Y/N)
NUMERIC||Mathematics||Area of a 2m×2.5m rectangle?||5||0||m^2;m2;sqm||Y||3||Y
# RIDDLE||Subject||clue1;clue2;clue3||accepted;answers
RIDDLE||Biology||I am unicellular and free-living.;I belong to phylum Rhizopoda.;I move using pseudopodia.||amoeba;ameba</pre>
        <textarea id="f-eq-bulk-${examId}" rows="6" placeholder="Paste your lines here…"></textarea>
        <button class="btn btn-sm btn-brass" style="margin-top:8px;" data-exam-add-bulk="${examId}">Add all valid lines</button>
      </div>`;
    }
    return html;
  }

  function renderExamTaking(){
    const {exam, name, record} = ui.examAttempt;
    if(record.submitted){
      const provisional = record.pending && record.pending.length>0;
      return `<div class="card" style="text-align:center;">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">${escapeHtml(exam.title)}</div>
        <div class="display" style="font-size:28px;color:var(--brass-soft);margin:8px 0;">${record.score} / ${record.maxScore}${provisional?' *':''}</div>
        <p class="sub">${escapeHtml(name)}${record.timedOutCount?` · ${record.timedOutCount} question${record.timedOutCount!==1?'s':''} timed out (no penalty, just no marks)`:' · submitted'}</p>
        ${provisional?`<p class="small-note">* ${record.pending.length} answer${record.pending.length!==1?'s':''} still need${record.pending.length===1?'s':''} your coach's review — this score may change.</p>`:''}
        <button class="btn" data-exit-exam="1" style="margin-top:10px;">Done</button>
      </div>`;
    }
    if(exam.mode==='reader') return renderReaderExamTaking(exam, name, record);

    const qOrder = getShuffledQuestionOrder(exam, name);
    const idx = record.currentIndex||0;
    const qid = qOrder[idx];
    const qq = (exam.questions||[]).find(qz=>qz.id===qid);
    if(!qq){
      return `<div class="card"><p class="small-note">Wrapping up…</p></div>`;
    }
    const elapsed = Date.now() - (record.questionStartedAt||Date.now());
    const timeLimitMs = questionTimeLimitSec(qq, exam)*1000;
    const remainingMs = Math.max(0, timeLimitMs - elapsed);

    let html = `<div class="card">
      <div class="flex-between">
        <div>
          <h2 style="margin:0;">${escapeHtml(exam.title)}</h2>
          <p class="sub" style="margin:2px 0 0;">${escapeHtml(name)} · Question ${idx+1} of ${qOrder.length}</p>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;">Time left</div>
          <div id="exam-timer-display" class="mono" style="font-size:22px;color:var(--brass-soft);">${formatMs(remainingMs)}</div>
        </div>
      </div>
    </div>`;

    html += `<div class="card">
      <p class="small-note" style="margin-bottom:2px;">${escapeHtml(qq.subject)} · ${QTYPE_LABELS[qq.type]||qq.type}${qq.type!=='riddle'?` · ${qq.points||1} pt${(qq.points||1)!==1?'s':''}`:''}</p>`;

    if(qq.type==='riddle'){
      const clues = qq.clues||[];
      const revealedCount = Math.min(clues.length, Math.floor(elapsed/((exam.riddleClueSeconds||5)*1000))+1);
      const nextCluePts = revealedCount<=1 ? 5 : (revealedCount===2 ? 4 : 3);
      html += `<div id="exam-riddle-clues">`;
      for(let c=0;c<revealedCount;c++){
        html += `<p style="margin:4px 0;"><strong>Clue ${c+1}:</strong> ${escapeHtml(clues[c])}</p>`;
      }
      html += `</div>
        <input type="text" id="exam-riddle-input" placeholder="Who or what am I?">
        <button class="btn btn-brass" style="margin-top:8px;" data-exam-answer-riddle="1" id="exam-riddle-answer-btn">Answer now — worth <span id="exam-riddle-pts">${nextCluePts}</span> pt${nextCluePts!==1?'s':''} if correct</button>`;
    } else {
      html += `<p style="font-weight:600; margin:4px 0 10px;">${escapeHtml(qq.text)}</p>`;
      if(qq.type==='mcq' || qq.type==='true_false'){
        const order = getShuffledOptionOrder(exam, name, qq);
        order.forEach(oi=>{
          const opt = qq.options[oi];
          html += `<label style="display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--hair); border-radius:7px; margin-bottom:6px; cursor:pointer;">
            <input type="radio" name="q-current" value="${oi}" data-exam-answer-choice="1">
            <span>${escapeHtml(opt)}</span>
          </label>`;
        });
        html += `<p class="small-note" style="margin-top:4px;">Tap an option to answer — it submits instantly and moves you on.</p>`;
      } else if(qq.type==='short'){
        html += `<input type="text" id="exam-text-input" placeholder="Your answer">
          <button class="btn btn-brass" style="margin-top:8px;" data-exam-answer-submit="1">Submit answer</button>`;
      } else if(qq.type==='numeric'){
        html += `<input type="text" id="exam-text-input" placeholder="e.g. 5m^2 — include the unit">
          <p class="small-note" style="margin-top:4px;">Include the unit with your answer.</p>
          <button class="btn btn-brass" style="margin-top:8px;" data-exam-answer-submit="1">Submit answer</button>`;
      }
    }
    html += `</div>`;
    return html;
  }

  function renderReaderExamTaking(exam, name, record){
    const idx = exam.readerIndex||0;
    const qq = (exam.questions||[])[idx];
    let html = `<div class="card">
      <h2 style="margin:0;">${escapeHtml(exam.title)}</h2>
      <p class="sub" style="margin:2px 0 0;">${escapeHtml(name)} · Question ${idx+1} of ${(exam.questions||[]).length} · reader-led</p>
    </div>`;
    if(!qq){
      html += `<div class="card" style="text-align:center;"><p class="small-note">Waiting for the coach to start the first question…</p></div>`;
      return html;
    }
    const already = record.perQuestionResults && record.perQuestionResults[qq.id];
    if(already){
      html += `<div class="card" style="text-align:center;"><p class="small-note">✓ Answer locked in — waiting for the coach to move to the next question.</p></div>`;
      return html;
    }
    html += `<div class="card">
      <p class="small-note" style="margin-bottom:2px;">${escapeHtml(qq.subject)} · ${QTYPE_LABELS[qq.type]||qq.type}${qq.type!=='riddle'?` · ${qq.points||1} pt${(qq.points||1)!==1?'s':''}`:''}</p>`;
    if(qq.type==='riddle'){
      html += `<div>${(qq.clues||[]).map((c,i)=>`<p style="margin:4px 0;"><strong>Clue ${i+1}:</strong> ${escapeHtml(c)}</p>`).join('')}</div>
        <input type="text" id="exam-text-input" placeholder="Your answer">
        <button class="btn btn-brass" style="margin-top:8px;" data-exam-answer-submit-reader="1">Submit answer</button>`;
    } else {
      html += `<p style="font-weight:600; margin:4px 0 10px;">${escapeHtml(qq.text)}</p>`;
      if(qq.type==='mcq' || qq.type==='true_false'){
        (qq.options||[]).forEach((opt,oi)=>{
          html += `<label style="display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--hair); border-radius:7px; margin-bottom:6px; cursor:pointer;">
            <input type="radio" name="q-current" value="${oi}" data-exam-answer-choice-reader="1">
            <span>${escapeHtml(opt)}</span>
          </label>`;
        });
        html += `<p class="small-note" style="margin-top:4px;">Tap an option to lock in your answer.</p>`;
      } else if(qq.type==='numeric'){
        html += `<input type="text" id="exam-text-input" placeholder="e.g. 5m^2 — include the unit">
          <p class="small-note" style="margin-top:4px;">Include the unit with your answer.</p>
          <button class="btn btn-brass" style="margin-top:8px;" data-exam-answer-submit-reader="1">Submit answer</button>`;
      } else {
        html += `<input type="text" id="exam-text-input" placeholder="Your answer">
          <button class="btn btn-brass" style="margin-top:8px;" data-exam-answer-submit-reader="1">Submit answer</button>`;
      }
    }
    html += `</div>`;
    return html;
  }

    let matched = null;
    if(DB.pins.coach && val===DB.pins.coach) matched='coach';
    else if(DB.pins.staff && val===DB.pins.staff) matched='staff';
    else if(DB.pins.scorer && val===DB.pins.scorer) matched='scorer';
    if(matched){
      ui.role = matched;
      syncRoleFlags();
      ui.pinModal = null;
      render();

      render();

  }

  async function createTournamentFromForm(){
    if(!ui.isStaff){ alert('Staff or coach access is required to create a tournament.'); return; }
    const f = newTForm;
    const name = (f.name||'').trim() || 'Untitled tournament';
    let competitors = [];
    if(f.matchFormat==='individual'){
      competitors = f.names.map((n,i)=>({id:uid('c'), name:n, seed:f.seedIds.includes(i), type:'individual'}));
    } else {
      competitors = f.teams.map((tm,i)=>({id:uid('c'), name:tm[0]+' & '+tm[1], memberNames:tm, seed:f.seedIds.includes(i), type:'team'}));
    }
    const guestCompetitors = f.guests.map((n,i)=>({id:uid('c'), name:n, seed:f.guestSeedIds.includes(i), type:'guest'}));
    competitors = competitors.concat(guestCompetitors);
    if(competitors.length<3){
      alert('Add at least 3 competitors (or teams/guests) before creating the tournament.');
      return;
    }
    const t = {
      id: uid('t'),
      name,
      createdAt: Date.now(),
      matchFormat: f.matchFormat,
      competitors,
      stages: [{
        key:'prelims', label:'Prelims',
        gamesPerCompetitor: f.gamesPerCompetitor,
        competitorIds: competitors.map(c=>c.id),
        matches: [], qualifyN:null, locked:false
      }],
      currentStageIndex: 0,
      champion: null
    };
    await sSet('tournament:'+t.id, t);
    DB.tIndex.push({id:t.id, name:t.name, createdAt:t.createdAt, matchFormat:t.matchFormat, status:'live', stageLabel:'Prelims', competitorCount:competitors.length});
    await sSet('tournament_index', DB.tIndex);
    if(!DB.fullCache) DB.fullCache = [];
    DB.fullCache.push(t);
    currentTournament = t;
    ui.tId = t.id;
    ui.view = 'tournament';
    newTForm = null;
    render();
  }

  let tournamentUnsub = null;
  let pendingLocalSaves = 0; // count of our own writes still "in flight" — absorb their echo, don't re-render for them
  function stopWatchingTournament(){
    if(tournamentUnsub){ tournamentUnsub(); tournamentUnsub = null; }
    pendingLocalSaves = 0;
  }

  async function openTournament(id){
    stopWatchingTournament();
    const t = await sGet('tournament:'+id);
    if(!t){ alert('Could not load this tournament.'); return; }
    currentTournament = t;
    ui.tId = id;
    ui.view = 'tournament';
    ui.qualifySelection = null;
    ui.qualifySelectionStage = null;
    ui.viewingStageIdx = t.currentStageIndex;
    ui.lastFixtureError = null;
    render();
    // live sync: any device's changes to this tournament now appear here automatically
    tournamentUnsub = window.storage.subscribe('tournament:'+id, (val)=>{
      if(!val || ui.tId!==id || ui.view!=='tournament') return;
      if(pendingLocalSaves>0){
        // this is (most likely) our own write echoing back — data's already current
        // locally, so just absorb it silently instead of re-rendering on top of
        // whatever the person is doing right now (this was causing every click to
        // lag and occasionally swallow taps, like "Score live" not opening)
        pendingLocalSaves--;
        currentTournament = val;
        return;
      }
      currentTournament = val;
      const idx = (DB.fullCache||[]).findIndex(x=>x.id===id);
      if(idx>=0) DB.fullCache[idx] = val;
      render();
    });
  }

  async function addSubstituteToStage(stageIdx, isGuest){
    if(!ui.isStaff){ alert('Staff or coach access is required to add a substitute.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    let name;
    if(isGuest){
      const input = q(`#f-sub-add-guest-${stageIdx}`);
      name = (input ? input.value : '').trim();
    } else {
      const sel = q(`#f-sub-add-name-${stageIdx}`);
      name = sel ? sel.value : '';
    }
    if(!name){ toast('Pick or type a name first.', 'error'); return; }
    let comp = isGuest ? null : t.competitors.find(c=>c.name===name);
    if(!comp){
      comp = { id: uid('c'), name, seed:false, type: isGuest?'guest':'individual' };
      t.competitors.push(comp);
    }
    if(!stage.competitorIds.includes(comp.id)) stage.competitorIds.push(comp.id);
    saveCurrentTournament();
    toast(`${name} added — use the seat dropdown on a match below to swap them in for the absent contestant.`, 'success');
    render();
  }

  // Mid-match substitution: swaps a seat's occupant for a chosen round onward, pulling
  // from the FULL student roster (not just those originally picked for the tournament).
  // Earlier rounds keep their recorded scores under whoever actually played them; the
  // seat's total for standings still combines everyone who ever sat in it.
  async function performSubstitution(mi, isGuest){
    if(!ui.isStaff){ alert('Staff or coach access is required to substitute.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const m = stage.matches[mi];
    const seatEl = q(`#f-sub-seat-${mi}`);
    const roundEl = q(`#f-sub-round-${mi}`);
    const seatIndex = seatEl ? parseInt(seatEl.value) : 0;
    const atRoundKey = roundEl ? roundEl.value : ROUND_ORDER[0];
    let name;
    if(isGuest){
      const input = q(`#f-sub-guest-${mi}`);
      name = (input ? input.value : '').trim();
    } else {
      const sel = q(`#f-sub-in-${mi}`);
      name = sel ? sel.value : '';
    }
    if(!name){ toast('Pick or type who\'s coming in.', 'error'); return; }
    let comp = isGuest ? null : t.competitors.find(c=>c.name===name);
    if(!comp){
      comp = { id: uid('c'), name, seed:false, type: isGuest?'guest':'individual' };
      t.competitors.push(comp);
    }
    if(!stage.competitorIds.includes(comp.id)) stage.competitorIds.push(comp.id);
    const outCid = seatCidForRound(m, seatIndex, atRoundKey);
    if(outCid===comp.id){ toast(`${name} is already in that seat.`, 'error'); return; }
    if(!m.substitutions) m.substitutions = [];

      pendingLocalSaves = Math.max(0, pendingLocalSaves-1);

  /* ============================= BACKUP: EXPORT / IMPORT ============================= */
  const BACKUP_VERSION = 1;

  async function exportBackup(){
    if(!ui.isCoach || ui.backupBusy) return;
    ui.backupBusy = 'export';
    render();
    try{
      // Full tournament blobs may not all be in DB.fullCache (e.g. right after a fresh
      // load), so re-fetch each one from its own key to guarantee a complete backup.
      const tournaments = [];
      for(const summary of DB.tIndex){
        const full = await sGet('tournament:'+summary.id);
        if(full) tournaments.push(full);
      }
      // Exam attempts live at their own per-student keys, not in local state — pull every
      // one so the backup includes actual student answers, not just published summaries.
      const examAttempts = {};
      for(const ex of (DB.exams||[])){
        for(const s of DB.students){
          const rec = await sGet(`exam_attempt:${ex.id}:${s.name}`);
          if(rec) examAttempts[`${ex.id}:${s.name}`] = rec;
        }
      }
      const backup = {
        backupVersion: BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        students: DB.students,
        tournamentIndex: DB.tIndex,
        tournaments,
        meetings: DB.meetings,
        assessments: DB.assessments,
        weights: DB.weights,
        notes: DB.notes,
        exams: DB.exams,
        examAttempts,
        pins: DB.pins
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `oguaa-nsmq-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast('Backup downloaded.', 'success');
    } catch(e){
      console.error('export failed', e);
      toast('Backup failed — check the console for details.', 'error');
    }
    ui.backupBusy = null;
    render();
  }

  async function importBackupFile(file){
    if(!ui.isCoach || ui.backupBusy) return;
    if(!file) return;
    let backup;
    try{
      const text = await file.text();
      backup = JSON.parse(text);
    } catch(e){
      toast('Could not read that file — is it a backup JSON from this app?', 'error');
      return;
    }
    if(!backup || !Array.isArray(backup.students) || !Array.isArray(backup.tournamentIndex)){
      toast('That file doesn\'t look like a valid backup.', 'error');
      return;
    }
    ui.backupBusy = 'import';
    render();
    try{
      await sSet('students', backup.students||[]);
      await sSet('tournament_index', backup.tournamentIndex||[]);
      for(const t of (backup.tournaments||[])){
        await sSet('tournament:'+t.id, t);
      }
      await sSet('meetings', backup.meetings||[]);
      await sSet('assessments', backup.assessments||[]);
      if(backup.weights) await sSet('selection_weights', backup.weights);
      await sSet('student_notes', backup.notes||{});
      await sSet('exams', backup.exams||[]);
      if(backup.pins) await sSet('access_pins', backup.pins);
      for(const [key, rec] of Object.entries(backup.examAttempts||{})){
        const [examId, ...rest] = key.split(':');
        const name = rest.join(':');
        await sSet(`exam_attempt:${examId}:${name}`, rec);
      }
      await logAudit('Restored backup', `${(backup.students||[]).length} students, ${(backup.tournaments||[]).length} tournaments, exported ${backup.exportedAt||'unknown date'}`);
      toast('Backup restored — reloading…', 'success');
      setTimeout(()=>window.location.reload(), 1200);
    } catch(e){
      console.error('import failed', e);
      toast('Restore failed partway through — check the console before trying again.', 'error');
      ui.backupBusy = null;
      render();
    }
  }

  /* ============================= LIVE EXAMS: GRADING HELPERS ============================= */
  function normalizeText(s){
    return String(s||'').trim().toLowerCase().replace(/[.\s]+$/,'').replace(/\s+/g,' ');
  }
  function normalizeUnit(s){
    return String(s||'').toLowerCase().replace(/\s+/g,'').replace(/\^/g,'');
  }
  function levenshtein(a,b){
    const m=a.length, n=b.length;
    const dp = Array.from({length:m+1}, ()=>new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) dp[i][0]=i;
    for(let j=0;j<=n;j++) dp[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
    return dp[m][n];
  }
  function commonPrefixLen(a,b){
    let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++; return i;
  }

  // Decides whether a wrong short-answer/riddle response is close enough to be worth a
  // human glancing at (typo, partial phrase, missing word) versus outright unrelated —
  // so "osmosis" for "gravitational force" is marked wrong immediately, while "gravity"
  // or a misspelled "graviational force" gets queued for a quick manual look.
  function findCloseAcceptedAnswer(norm, accepted){
    let closest=null, closestDist=Infinity, isClose=false;
    accepted.forEach(a=>{
      if(!a) return;
      const d = levenshtein(norm, a);
      if(d<closestDist){ closestDist=d; closest=a; }
      const ratio = d/Math.max(norm.length, a.length, 1);
      const substringMatch = a.length>=4 && (norm.includes(a) || a.includes(norm));
      const wordsA = a.split(' ').filter(w=>w.length>=4);
      const wordsN = norm.split(' ').filter(w=>w.length>=4);
      const sharedWord = wordsA.some(wa=>wordsN.some(wn=>wa===wn || levenshtein(wa,wn)<=1));
      const prefixClose = wordsA.some(wa=>wordsN.some(wn=>{
        const pre = commonPrefixLen(wa,wn);
        return pre>=5 && pre/Math.min(wa.length,wn.length)>=0.7;
      }));
      if(ratio<=0.34 || substringMatch || sharedWord || prefixClose) isClose = true;
    });
    return { closest, isClose };
  }

  function gradeShortLikeAnswer(question, rawAnswer, isNumeric, shortPenalty, overridePoints, overrideCluePts){
    const raw = (rawAnswer||'').toString();
    if(!raw.trim()) return {status:'unanswered', earned:0};
    if(!isNumeric){
      const norm = normalizeText(raw);
      const accepted = (question.acceptedAnswers||[]).map(normalizeText);
      if(accepted.includes(norm)) return {status:'correct', earned: overridePoints!=null?overridePoints:(question.points||1)};
      const {closest, isClose} = findCloseAcceptedAnswer(norm, accepted);
      if(isClose){
        return {status:'pending', earned:0, hint:`Close to "${closest}" — possible typo or partial answer, check manually`, penaltyIfWrong:shortPenalty, cluePts:overrideCluePts};
      }
      return {status:'incorrect', earned:-shortPenalty};
    }
    const m = raw.trim().match(/^(-?\d+(?:\.\d+)?)\s*(.*)$/);
    if(!m) return {status:'pending', earned:0, hint:"Couldn't read a number from this answer — review manually", penaltyIfWrong:shortPenalty};
    const val = parseFloat(m[1]);
    const tol = question.tolerance||0;
    if(Math.abs(val-question.correctValue) > tol) return {status:'incorrect', earned:-shortPenalty};
    if(question.unitRequired){
      const acceptedUnits = (question.units||[]).map(normalizeUnit).filter(Boolean);
      const unitPart = normalizeUnit(m[2]);
      if(acceptedUnits.length===0) return {status:'pending', earned:0, hint:'No accepted units configured — review manually', penaltyIfWrong:shortPenalty};
      if(!unitPart) return {status:'incorrect', earned:-shortPenalty}; // right number, missing unit -> wrong
      if(!acceptedUnits.includes(unitPart)) return {status:'pending', earned:0, hint:`Unit "${m[2].trim()}" isn't in the accepted list — check manually`, penaltyIfWrong:shortPenalty};
    }
    return {status:'correct', earned: overridePoints!=null?overridePoints:(question.points||1)};
  }

  function riddleCluePoints(clueIndex){
    return clueIndex<=1 ? 5 : (clueIndex===2 ? 4 : 3);
  }

  // Resolves the outcome of a single question at the moment it's answered (or timed
  // out). Called once per question, immediately — not deferred to the end of the exam —
  // since the exam is now paced one question at a time.
  function resolveQuestionOutcome(question, rawAnswer, exam, clueIndex){
    const mcqPenalty = exam.negativeMarking ? (exam.negativePenalty!=null?exam.negativePenalty:1) : 0;
    const shortPenalty = exam.shortNegativeMarking ? (exam.shortPenalty!=null?exam.shortPenalty:1) : 0;
    const pts = question.points||1;

    if(question.type==='mcq' || question.type==='true_false'){
      if(rawAnswer===undefined || rawAnswer===null || rawAnswer===''){
        return {status:'unanswered', earned:0};
      }
      if(parseInt(rawAnswer)===question.correctIndex) return {status:'correct', earned:pts};
      return {status:'incorrect', earned:-mcqPenalty};
    }
    if(question.type==='short') return gradeShortLikeAnswer(question, rawAnswer, false, shortPenalty);
    if(question.type==='numeric') return gradeShortLikeAnswer(question, rawAnswer, true, shortPenalty);
    if(question.type==='riddle'){
      const cluePts = riddleCluePoints(clueIndex||1);
      return gradeShortLikeAnswer(question, rawAnswer, false, shortPenalty, cluePts, cluePts);
    }
    return {status:'pending', earned:0, hint:'Unknown question type', penaltyIfWrong:0};
  }

  function seededRandom(seedStr){
    let h = 0;
    for(let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i))|0; }
    return function(){
      h = (h*1103515245 + 12345) & 0x7fffffff;
      return h / 0x7fffffff;
    };
  }
  function seededShuffle(arr, seedStr){
    const rand = seededRandom(seedStr);
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(rand()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function getShuffledQuestionOrder(exam, name){
    const ids = (exam.questions||[]).map(qq=>qq.id);
    if(!exam.shuffleQuestions) return ids;
    return seededShuffle(ids, exam.id+'|'+name+'|q');
  }
  function getShuffledOptionOrder(exam, name, question){
    const idxs = (question.options||[]).map((_,i)=>i);
    if(!exam.shuffleQuestions) return idxs;
    return seededShuffle(idxs, exam.id+'|'+name+'|o|'+question.id);
  }
  function generatePin(){
    return String(Math.floor(1000 + Math.random()*9000));
  }

  async function readerAdvance(examId, delta){

  // Parses one bulk-import line into a question object, or returns an error string.
  function parseBulkQuestionLine(line){
    const parts = line.split('||').map(s=>s.trim());
    const kind = (parts[0]||'').toUpperCase();
    const yn = v => /^y/i.test((v||'').trim());
    try{
      if(kind==='MCQ'){
        const [, subject, text, a, b, c, d, correctLetter, pts, calc] = parts;
        if(!subject||!text||!a||!b||!c||!d||!correctLetter) return {error:'MCQ needs subject, text, 4 options, and a correct letter'};
        const idx = {A:0,B:1,C:2,D:3}[correctLetter.trim().toUpperCase()];
        if(idx===undefined) return {error:`Correct letter "${correctLetter}" must be A, B, C, or D`};
        return {question:{ id:uid('q'), subject, type:'mcq', text, options:[a,b,c,d], correctIndex:idx, points: parseFloat(pts)||2, requiresCalculation: yn(calc) }};
      }
      if(kind==='TF'){
        const [, subject, text, answer, pts, calc] = parts;
        if(!subject||!text||!answer) return {error:'TF needs subject, statement, and True/False'};
        const isTrue = /^t/i.test(answer.trim());
        return {question:{ id:uid('q'), subject, type:'true_false', text, options:['True','False'], correctIndex:isTrue?0:1, points: parseFloat(pts)||2, requiresCalculation: yn(calc) }};
      }
      if(kind==='SHORT'){
        const [, subject, text, accepted, pts, calc] = parts;
        if(!subject||!text||!accepted) return {error:'SHORT needs subject, question, and accepted answer(s)'};
        return {question:{ id:uid('q'), subject, type:'short', text, acceptedAnswers: accepted.split(';').map(s=>s.trim()).filter(Boolean), points: parseFloat(pts)||3, requiresCalculation: yn(calc) }};
      }
      if(kind==='NUMERIC'){
        const [, subject, text, value, tol, units, unitReq, pts, calc] = parts;
        if(!subject||!text||value===undefined||value==='') return {error:'NUMERIC needs subject, question, and value'};
        const unitRequired = unitReq===undefined ? true : yn(unitReq);
        const unitList = (units||'').split(';').map(s=>s.trim()).filter(Boolean);
        if(unitRequired && unitList.length===0) return {error:'NUMERIC with unit required needs at least one accepted unit'};
        return {question:{ id:uid('q'), subject, type:'numeric', text, correctValue: parseFloat(value), tolerance: parseFloat(tol)||0, units: unitList, unitRequired, points: parseFloat(pts)||3, requiresCalculation: yn(calc) }};
      }
      if(kind==='RIDDLE'){
        const [, subject, cluesRaw, acceptedRaw] = parts;
        const clues = (cluesRaw||'').split(';').map(s=>s.trim()).filter(Boolean);
        const accepted = (acceptedRaw||'').split(';').map(s=>s.trim()).filter(Boolean);
        if(!subject||clues.length===0||accepted.length===0) return {error:'RIDDLE needs subject, at least one clue, and accepted answer(s)'};
        return {question:{ id:uid('q'), subject, type:'riddle', text:`Riddle (${clues.length} clues)`, clues, acceptedAnswers:accepted, points:5, requiresCalculation:false }};
      }
      return {error:`Unknown question type "${parts[0]}"`};
    } catch(e){
      return {error:'Could not parse this line'};
    }
  }

  async function addExamQuestionsBulk(examId){
    if(!ui.isStaff) return;
    const ex = (DB.exams||[]).find(e=>e.id===examId);
    if(!ex) return;
    const textEl = q(`#f-eq-bulk-${examId}`);
    const raw = textEl ? textEl.value : '';
    const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#'));
    if(lines.length===0){ toast('Paste at least one question line.', 'error'); return; }
    let added=0; const errors=[];
    lines.forEach((line,i)=>{
      const result = parseBulkQuestionLine(line);
      if(result.question){ ex.questions.push(result.question); added++; }
      else errors.push(`Line ${i+1}: ${result.error}`);
    });
    if(added>0){ await sSet('exams', DB.exams); }
    if(errors.length===0){
      toast(`Added ${added} question${added!==1?'s':''}.`, 'success');
      if(textEl) textEl.value = '';
    } else {
      toast(`Added ${added}, skipped ${errors.length}: ${errors.slice(0,3).join(' · ')}${errors.length>3?'…':''}`, 'error');
    }
    render();
  }

  async function addExamQuestion(examId){
    if(!ui.isStaff) return;
    const ex = (DB.exams||[]).find(e=>e.id===examId);
    if(!ex) return;
    const typeEl = q(`#f-eq-type-${examId}`);
    const subjEl = q(`#f-eq-subject-${examId}`);
    const textEl = q(`#f-eq-text-${examId}`);
    const ptsEl = q(`#f-eq-points-${examId}`);
    const calcEl = q(`#f-eq-calc-${examId}`);
    const type = typeEl ? typeEl.value : 'mcq';
    const subject = subjEl ? subjEl.value : SUBJECTS[0];
    const points = ptsEl ? (parseFloat(ptsEl.value)||1) : 1;
    const requiresCalculation = calcEl ? !!calcEl.checked : false;
    let question = { id: uid('q'), subject, type, points, requiresCalculation };

    if(type==='riddle'){
      const cluesEl = q(`#f-eq-riddle-clues-${examId}`);
      const acceptedEl = q(`#f-eq-riddle-accepted-${examId}`);
      const clues = (cluesEl ? cluesEl.value : '').split('\n').map(s=>s.trim()).filter(Boolean);
      const accepted = (acceptedEl ? acceptedEl.value : '').split('|').map(s=>s.trim()).filter(Boolean);
      if(clues.length===0){ toast('Add at least one clue, one per line.', 'error'); return; }
      if(accepted.length===0){ toast('Enter at least one accepted answer.', 'error'); return; }
      question.text = `Riddle (${clues.length} clue${clues.length!==1?'s':''})`;
      question.clues = clues;
      question.acceptedAnswers = accepted;
      question.points = 5; // best case (answered on clue 1); actual award is 5/4/3 based on clues revealed
    } else {
      const text = (textEl ? textEl.value : '').trim();
      if(!text){ toast('Add the question text.', 'error'); return; }
      question.text = text;
      if(type==='mcq'){
        const optEls = [0,1,2,3].map(i=>q(`#f-eq-opt-${examId}-${i}`));
        const correctEl = q(`input[name="f-eq-correct-${examId}"]:checked`);
        const options = optEls.map(el=>(el ? el.value : '').trim());
        if(options.some(o=>!o)){ toast('Fill in all 4 options.', 'error'); return; }
        if(!correctEl){ toast('Mark which option is correct.', 'error'); return; }
        question.options = options;
        question.correctIndex = parseInt(correctEl.value);
      } else if(type==='true_false'){
        const correctEl = q(`input[name="f-eq-tf-${examId}"]:checked`);
        if(!correctEl){ toast('Mark whether True or False is correct.', 'error'); return; }
        question.options = ['True','False'];
        question.correctIndex = parseInt(correctEl.value);
      } else if(type==='short'){
        const acceptedEl = q(`#f-eq-short-accepted-${examId}`);
        const accepted = (acceptedEl ? acceptedEl.value : '').split('|').map(s=>s.trim()).filter(Boolean);
        if(accepted.length===0){ toast('Enter at least one accepted answer.', 'error'); return; }
        question.acceptedAnswers = accepted;
      } else if(type==='numeric'){
        const valEl = q(`#f-eq-num-value-${examId}`);
        const tolEl = q(`#f-eq-num-tol-${examId}`);
        const unitsEl = q(`#f-eq-num-units-${examId}`);
        const unitReqEl = q(`#f-eq-num-unitreq-${examId}`);
        const correctValue = valEl ? parseFloat(valEl.value) : NaN;
        if(isNaN(correctValue)){ toast('Enter the correct numeric value.', 'error'); return; }
        const unitRequired = unitReqEl ? !!unitReqEl.checked : true;
        const units = (unitsEl ? unitsEl.value : '').split('|').map(s=>s.trim()).filter(Boolean);
        if(unitRequired && units.length===0){ toast('List at least one accepted unit, or untick "unit required".', 'error'); return; }
        question.correctValue = correctValue;
        question.tolerance = tolEl ? (parseFloat(tolEl.value)||0) : 0;
        question.units = units;
        question.unitRequired = unitRequired;
      }
    }

    ex.questions.push(question);
    await sSet('exams', DB.exams);
    toast('Question added.', 'success');
    render();
  }

  async function refreshExamResults(examId){
    const ex = (DB.exams||[]).find(e=>e.id===examId);
    if(!ex) return;
    const rows = [];
    let pendingCount = 0;
    for(const s of DB.students){
      const rec = await sGet(`exam_attempt:${examId}:${s.name}`);
      let status = 'Not started', score=null, maxScore=null, pending=false;
      if(rec){
        if(rec.submitted){
          status = rec.timedOutCount ? `Submitted (${rec.timedOutCount} timed out)` : 'Submitted';
          score = rec.score; maxScore = rec.maxScore;
          if(rec.pending && rec.pending.length){ pending = true; pendingCount += rec.pending.length; }
        } else status = `In progress (Q${(rec.currentIndex||0)+1})`;
      }
      rows.push({ name: s.name, status, score, maxScore, pending });
    }
    const submitted = rows.filter(r=>r.score!=null);
    const avg = submitted.length>0 ? submitted.reduce((a,r)=>a+(r.maxScore>0?(r.score/r.maxScore)*100:0),0)/submitted.length : null;
    ui.examMonitor = { examId, rows, avg, submittedCount: submitted.length, pendingCount };
    render();
  }
