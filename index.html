<style>
  :root{
    --ink:#0E1826;
    --panel:#152238;
    --panel-2:#1C2E4A;
    --hair:#2A3B57;
    --paper:#F4EFE3;
    --brass:#C9A227;
    --brass-soft:#E4C868;
    --green:#4F9A6E;
    --red:#C1553B;
    --text:#EAEFF6;
    --muted:#8FA1BC;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Fraunces',serif;}

  /* ---------- Header ---------- */
  header.top{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--hair);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark-img{
    width:44px;height:44px;border-radius:8px;object-fit:cover;
    flex-shrink:0; box-shadow:0 0 0 1px var(--hair);
  }
  .brand h1{font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0; letter-spacing:0.2px;}
  .brand p{margin:0; font-size:12px; color:var(--muted); letter-spacing:0.4px; text-transform:uppercase;}
  nav.tabs{display:flex; gap:4px; flex-wrap:wrap;}
  nav.tabs button{
    background:transparent; border:1px solid transparent; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:999px; cursor:pointer; transition:all .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:var(--panel-2); color:var(--brass-soft); border-color:var(--hair);}

  main{max-width:960px; margin:0 auto; padding:24px 20px;}

  /* ---------- Generic components ---------- */
  .card{
    background:var(--panel); border:1px solid var(--hair); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:16px;
  }
  .card h2{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0 0 4px;}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:10px 16px; border-radius:8px; border:1px solid var(--hair);
    background:var(--panel-2); color:var(--text); cursor:pointer; transition:all .15s;
  }
  .btn:hover{border-color:var(--brass);}
  .btn-brass{background:var(--brass); border-color:var(--brass); color:var(--ink);}
  .btn-brass:hover{background:var(--brass-soft);}
  .btn-ghost{background:transparent;}
  .btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:rgba(193,85,59,0.12);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  input[type=text], input[type=number], select, textarea{
    background:var(--ink); border:1px solid var(--hair); color:var(--text);
    border-radius:6px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:14px;
    width:100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--brass); outline-offset:1px;
  }
  label.field{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.3px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .row > div{flex:1; min-width:140px;}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--panel-2); border:1px solid var(--hair); border-radius:999px;
    padding:4px 10px; font-size:12px; color:var(--muted);
  }
  .pill.gold{color:var(--brass-soft); border-color:var(--brass);}
  .empty{
    text-align:center; padding:40px 20px; color:var(--muted);
  }
  .empty .display{font-size:16px; color:var(--text); margin-bottom:6px;}
  .warn-box{
    background:rgba(193,85,59,0.1); border:1px solid var(--red); border-radius:8px;
    padding:10px 14px; font-size:13px; color:#E9A594; margin-bottom:12px;
  }
  .ok-box{
    background:rgba(79,154,110,0.1); border:1px solid var(--green); border-radius:8px;
    padding:10px 14px; font-size:13px; color:#A8D6BB; margin-bottom:12px;
  }
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--hair);
  }
  td{padding:9px 10px; border-bottom:1px solid rgba(42,59,87,0.5);}
  tr:last-child td{border-bottom:none;}
  .rank-num{font-family:'IBM Plex Mono',monospace; color:var(--brass-soft); font-weight:600;}
  .seed-star{color:var(--brass-soft); margin-left:3px;}

  /* ---------- Tournament list ---------- */
  .t-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background:var(--panel); border:1px solid var(--hair);
    border-radius:var(--radius); margin-bottom:10px; cursor:pointer; transition:border-color .15s;
  }
  .t-list-item:hover{border-color:var(--brass);}
  .t-list-item h3{font-family:'Fraunces',serif; font-size:16px; margin:0 0 3px; font-weight:600;}
  .t-list-item p{margin:0; font-size:12px; color:var(--muted);}
  .status-badge{
    font-size:10px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700;
    padding:3px 8px; border-radius:999px;
  }
  .status-live{background:rgba(201,162,39,0.15); color:var(--brass-soft);}
  .status-done{background:rgba(79,154,110,0.15); color:var(--green);}

  /* ---------- Stage stepper ---------- */
  .stepper{display:flex; align-items:center; gap:0; margin-bottom:18px; overflow-x:auto;}
  .step{
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    color:var(--muted); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .step.active{color:var(--brass-soft);}
  .step.done{color:var(--green);}
  .step-dot{width:8px;height:8px;border-radius:50%; background:var(--hair);}
  .step.active .step-dot{background:var(--brass-soft);}
  .step.done .step-dot{background:var(--green);}
  .step-sep{width:24px; height:1px; background:var(--hair);}

  /* ---------- Match ticket ---------- */
  .match-ticket{
    background:var(--panel); border:1px dashed var(--hair); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; position:relative;
  }
  .match-ticket .m-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .match-ticket .m-head .m-label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .m-players{display:grid; gap:8px;}
  .m-player-row{
    display:flex; align-items:center; gap:10px; background:var(--ink);
    border:1px solid var(--hair); border-radius:7px; padding:8px 10px;
  }
  .m-player-row .name{flex:1; font-weight:600; font-size:14px;}
  .m-player-row select, .m-player-row input{width:auto; min-width:88px;}
  .m-player-row .score-input{width:70px;}
  .completed-tag{color:var(--green); font-size:11px; font-weight:700; text-transform:uppercase;}
  .live-scorer{border-top:1px dashed var(--hair); margin-top:12px; padding-top:12px;}
  .live-totals{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .live-total-chip{
    background:var(--panel-2); border:1px solid var(--brass); border-radius:8px;
    padding:8px 12px; display:flex; flex-direction:column; gap:2px; min-width:90px;
  }
  .live-total-chip span:first-child{font-size:11px; color:var(--muted);}
  .live-total-chip span:last-child{font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--brass-soft); font-weight:600;}
  .round-block{margin-bottom:16px;}
  .round-head{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--brass-soft); margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .round-head .pill{font-size:10px; text-transform:none; letter-spacing:0;}
  .round-item{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    background:var(--ink); border:1px solid var(--hair); border-radius:7px;
    padding:7px 9px; margin-bottom:6px; font-size:13px;
  }
  .round-item select{width:auto; min-width:80px; padding:6px 8px; font-size:12px;}
  .attempt-slot{display:inline-flex; align-items:center; gap:4px; background:var(--panel-2); border-radius:6px; padding:3px 5px;}
  .bonus-arrow{font-size:11px; color:var(--muted); white-space:nowrap;}
  .subj-row{display:flex; justify-content:space-between; font-size:12px; padding:3px 0; color:var(--muted);}
  .subj-row .mono{color:var(--text);}
  .grid-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:4px;}
  table.score-grid{border-collapse:collapse; font-size:12px;}
  table.score-grid th, table.score-grid td{
    border:1px solid var(--hair); padding:6px 5px; text-align:center; vertical-align:top; white-space:nowrap;
  }
  table.score-grid th{background:var(--panel-2); font-weight:600;}
  .grid-q-label{font-size:10px; color:var(--muted); text-transform:uppercase; margin-bottom:3px;}
  .grid-name-col{
    text-align:left !important; min-width:110px; position:sticky; left:0;
    background:var(--panel); z-index:2; font-weight:600;
  }
  th.grid-name-col{background:var(--panel-2); z-index:3;}
  .mini-select{width:64px; font-size:11px; padding:3px 2px; margin:0 auto;}
  .grid-cell-value{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; margin-bottom:4px; color:var(--muted);}
  .grid-cell-value.pos{color:var(--green);}
  .grid-cell-value.neg{color:var(--red);}
  .grid-toggle{display:flex; gap:3px; justify-content:center; margin-bottom:4px;}
  .gbtn{
    width:22px; height:22px; padding:0; font-size:11px; border-radius:4px;
    border:1px solid var(--hair); background:var(--ink); color:var(--muted); cursor:pointer;
  }
  .gbtn.on-correct{background:var(--brass); color:var(--ink); border-color:var(--brass);}
  .gbtn.on-wrong{background:var(--red); color:#fff; border-color:var(--red);}
  .grid-total{font-weight:700; color:var(--brass-soft); background:var(--panel-2);}
  .print-only-name{display:none;}

  /* ---------- Standings ---------- */
  .form-dots{display:flex; gap:3px;}
  .form-dot{width:7px;height:7px;border-radius:50%;}
  .form-1{background:var(--brass-soft);}
  .form-2{background:#7996B8;}
  .form-3{background:#4A5C7A;}

  /* ---------- Profile card ---------- */
  .profile-card{
    background:var(--panel); border:1px solid var(--hair); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px;
  }
  .profile-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .profile-head h3{font-family:'Fraunces',serif; margin:0; font-size:17px;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:10px; margin-top:10px;}
  .stat-box{text-align:center; background:var(--ink); border-radius:8px; padding:8px 4px;}
  .stat-box .v{font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--brass-soft); font-weight:600;}
  .stat-box .l{font-size:10px; color:var(--muted); text-transform:uppercase; margin-top:2px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,10,18,0.7); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:var(--panel); border:1px solid var(--hair); border-radius:12px;
    padding:22px; max-width:420px; width:100%;
  }
  .modal h3{font-family:'Fraunces',serif; margin:0 0 8px;}
  .modal p{font-size:13px; color:var(--muted); margin:0 0 16px;}
  .modal .actions{display:flex; gap:10px; justify-content:flex-end;}

  .loading-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px;}
  .checkbox-row input{width:auto;}
  .small-note{font-size:12px; color:var(--muted); margin-top:8px;}
  .divider{height:1px; background:var(--hair); margin:16px 0;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  a.link-btn{color:var(--brass-soft); font-size:13px; font-weight:600; text-decoration:none; cursor:pointer;}
  a.link-btn:hover{text-decoration:underline;}
  .tag-remove{cursor:pointer; color:var(--red); font-weight:700; margin-left:4px;}
  .name-chip{
    display:inline-flex; align-items:center; background:var(--panel-2); border:1px solid var(--hair);
    border-radius:999px; padding:5px 10px 5px 12px; font-size:13px; margin:3px 4px 3px 0;
  }
  @media (max-width:600px){
    header.top{padding:16px 14px;}
    main{padding:16px 14px;}
    nav.tabs{width:100%; justify-content:flex-start;}
  }
  @media print{
    body{background:#fff;}
    #app{background:#fff; color:#111;}
    header.top, .stepper, .no-print, [data-nav], [data-open-t],
    button:not(.keep-print), select, input, .modal-backdrop, .name-chip .tag-remove{
      display:none !important;
    }
    .print-only-name{display:inline; font-weight:600; color:#111;}
    .card{border:1px solid #ccc; background:#fff; box-shadow:none; page-break-inside:avoid;}
    .match-ticket{border:1px solid #999; page-break-inside:avoid;}
    .mono, .rank-num, td, th{color:#111 !important;}
    table{border:1px solid #ccc;}
    th, td{border-bottom:1px solid #ddd;}
  }
</style>

<script type="module">
  // ---- Firebase-backed storage shim ----
  // Replaces Claude-artifact window.storage with a real shared backend so
  // this app works when deployed independently (e.g. on Vercel).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, get as fbGet, set as fbSet, remove as fbRemove, onValue as fbOnValue
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdaKKoga1GwS96RpKQSLpP5p7Hq9M_oXo",
    authDomain: "oguaa-nsmq.firebaseapp.com",
    databaseURL: "https://oguaa-nsmq-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "oguaa-nsmq",
    storageBucket: "oguaa-nsmq.firebasestorage.app",
    messagingSenderId: "758676948712",
    appId: "1:758676948712:web:b0ccab1939a21bbe9beb5d"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  const ROOT = "oguaa_nsmq"; // matches the security rule path

  function safeKey(key){
    // Firebase RTDB paths can't contain . # $ [ ] — sanitize just in case
    return String(key).replace(/[.#$\[\]:]/g, "_");
  }

  window.storage = {
    async get(key){
      const snap = await fbGet(ref(db, ROOT + "/" + safeKey(key)));
      if(!snap.exists()) return null;
      return { key, value: snap.val(), shared: true };
    },
    async set(key, value){
      try{
        await fbSet(ref(db, ROOT + "/" + safeKey(key)), value);
        return { key, value, shared: true };
      }catch(e){
        console.error("firebase set failed", key, e);
        return null;
      }
    },
    async delete(key){
      try{
        await fbRemove(ref(db, ROOT + "/" + safeKey(key)));
        return { key, deleted:true, shared: true };
      }catch(e){
        return null;
      }
    },
    async list(){
      return { keys: [], shared: true }; // not used by this app
    },
    // Real-time subscription: calls onChange(value) immediately and again
    // whenever the data changes on any device. Returns an unsubscribe function.
    subscribe(key, onChange){
      const r = ref(db, ROOT + "/" + safeKey(key));
      const unsub = fbOnValue(r, snap=>{
        if(!snap.exists()){ onChange(null); return; }
        const raw = snap.val();
        // Values are always written as JSON strings (see set() / sSet), so
        // parse here too — otherwise callbacks get a raw string instead of
        // the object they expect (this was breaking renderTournament).
        try{ onChange(JSON.parse(raw)); }
        catch(e){ onChange(raw); }
      });
      return unsub;
    }
  };
</script>

<script type="module">
(function(){
  "use strict";
  const LOGO_SRC = "nsmq-logo.jpg";

  /* ============================= STORAGE HELPERS ============================= */
  async function sGet(key){
    try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  async function sSet(key, val){
    try{ return await window.storage.set(key, JSON.stringify(val), true); }
    catch(e){ console.error('storage set failed', key, e); return null; }
  }
  async function sDelete(key){
    try{ return await window.storage.delete(key, true); }
    catch(e){ return null; }
  }

  /* ============================= APP STATE ============================= */
  let DB = { students: [], tIndex: [], pins: {coach:null, staff:null, scorer:null}, meetings: [], assessments: [], weights: {attendance:30, assessment:30, quiz:40}, notes: {} };
  function studentNames(){ return DB.students.map(s=>s.name); }
  let currentTournament = null;          // full loaded tournament object
  let ui = {
    view:'home',            // home | new | tournament | profiles | squad
    tId:null,
    profileFilter:'',
    confirmModal:null,      // {title, body, onConfirm}
    role:'viewer',          // 'viewer' | 'scorer' | 'staff' | 'coach' — resets on page reload by design
    isCoach:false,          // true only when role==='coach' — full access
    isStaff:false,          // true for 'coach' or 'staff' — day-to-day operations
    isScorer:false,         // true for 'coach','staff','scorer' — can record match results
    pinModal:null,          // {mode:'setup'|'unlock', value:'', error:''}
    settingsOpen:false,     // whether the coach Settings (PIN management) panel is open
    qualifySelection:null,  // array of cids currently ticked to advance
    qualifySelectionStage:null, // which stage.key the selection belongs to
    editingNameCid:null,    // competitor id currently being renamed
    viewingStageIdx:null,   // which stage index is currently being viewed (may differ from live stage)
    openLiveScorerKey:null, // "stageIdx|matchIndex" of the match currently expanded for live scoring
    expandedProfile:null,   // name of student whose contest-analysis panel is expanded
    expandedMeeting:null,   // meeting id currently expanded for attendance entry
    expandedAssessment:null,// assessment id currently expanded for score entry
    editingNotesFor:null,   // student name whose notes textarea is open for editing
    studentFilter:'',       // search filter on the Students registry view
    lastFixtureError:null,  // persistent (not just toast) message when fixture generation last failed
    editingStudentId:null   // student id currently being edited in the registry
  };

  function syncRoleFlags(){
    ui.isCoach = (ui.role === 'coach');
    ui.isStaff = (ui.role === 'coach' || ui.role === 'staff');
    ui.isScorer = (ui.role === 'coach' || ui.role === 'staff' || ui.role === 'scorer');
  }

  function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ============================= FIXTURE ENGINE ============================= */
  // Greedy randomized: n competitors, g games each, no repeated pair, optional seed separation.
  function generateNoRepeatFixture(competitorIds, gamesEach, seedIds, maxAttempts){
    maxAttempts = maxAttempts || 4000;
    const seedSet = new Set(seedIds||[]);
    const n = competitorIds.length;
    if((n*gamesEach) % 3 !== 0){
      return {ok:false, reason:`${n} competitors × ${gamesEach} games = ${n*gamesEach} player-slots, which isn't divisible by 3. Adjust games-per-competitor or the roster size.`};
    }
    // basic feasibility: with no repeats, each competitor needs gamesEach*2 distinct
    // opponents, which can't exceed the (n-1) other people available.
    const maxGamesForNoRepeat = Math.floor((n-1)/2);
    if(gamesEach > maxGamesForNoRepeat){
      return {ok:false, reason:`With ${n} competitors, "no repeat opponents" only works up to ${maxGamesForNoRepeat} game${maxGamesForNoRepeat!==1?'s':''} each (since everyone would need ${gamesEach*2} different opponents, but only ${n-1} other people exist). Lower games-per-competitor to ${maxGamesForNoRepeat}, add more competitors, or use "Balanced seed groups" instead.`};
    }
    // feasibility check for seed separation: s <= 3n/(2g+3)
    if(seedSet.size>0){
      const maxSeeds = Math.floor((3*n)/(2*gamesEach+3));
      if(seedSet.size > maxSeeds){
        return {ok:false, reason:`Too many seeded/strong players for this pool. With ${n} competitors and ${gamesEach} games each, at most ${maxSeeds} can be kept apart from each other. You have ${seedSet.size} marked.`};
      }
    }
    for(let attempt=0; attempt<maxAttempts; attempt++){
      const res = attemptOnce(competitorIds, gamesEach, seedSet);
      if(res) return {ok:true, matches:res};
    }
    return {ok:false, reason:'Could not find a valid no-repeat schedule after many attempts. Try lowering games-per-competitor or the number of seeded players.'};
  }

  function attemptOnce(competitorIds, gamesEach, seedSet){
    const remaining = {}; competitorIds.forEach(c=> remaining[c]=gamesEach);
    const usedPairs = new Set();
    const triples = [];
    let guard = 0;
    while(true){
      guard++;
      if(guard>20000) return null;
      let avail = competitorIds.filter(c=>remaining[c]>0);
      if(avail.length===0) break;
      shuffleArr(avail);
      let found=false;
      outer:
      for(let i=0;i<avail.length;i++){
        for(let j=i+1;j<avail.length;j++){
          for(let k=j+1;k<avail.length;k++){
            const a=avail[i], b=avail[j], c=avail[k];
            if(remaining[a]<=0||remaining[b]<=0||remaining[c]<=0) continue;
            const strongCount = [a,b,c].filter(x=>seedSet.has(x)).length;
            if(strongCount>1) continue;
            const p1=pairKey(a,b), p2=pairKey(a,c), p3=pairKey(b,c);
            if(usedPairs.has(p1)||usedPairs.has(p2)||usedPairs.has(p3)) continue;
            triples.push([a,b,c]);
            usedPairs.add(p1); usedPairs.add(p2); usedPairs.add(p3);
            remaining[a]--; remaining[b]--; remaining[c]--;
            found=true;
            break outer;
          }
        }
      }
      if(!found) return null;
    }
    return triples;
  }
  function pairKey(a,b){ return [a,b].sort().join('|'); }
  function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

  // Balanced serpentine grouping by rank, group size 3, one match per group (single round)
  function generateSerpentineFixture(rankedIds, groupSize){
    groupSize = groupSize||3;
    const groups = [];
    const numGroups = Math.ceil(rankedIds.length/groupSize);
    for(let i=0;i<numGroups;i++) groups.push([]);
    let dir=1, gi=0;
    for(let i=0;i<rankedIds.length;i++){
      groups[gi].push(rankedIds[i]);
      gi += dir;
      if(gi===numGroups){ gi=numGroups-1; dir=-1; }
      else if(gi<0){ gi=0; dir=1; }
    }
    return groups.filter(g=>g.length>0).map(g=>({slots:g}));
  }

  function packIntoRounds(matches){
    // matches: array of [a,b,c]; returns rounds of disjoint-people matches
    const remaining = matches.map(m=>({slots:m}));
    const rounds = [];
    let guard=0;
    let pool = remaining.slice();
    while(pool.length>0 && guard<1000){
      guard++;
      const used = new Set();
      const roundMatches = [];
      const leftover = [];
      pool.forEach(m=>{
        const clash = m.slots.some(p=>used.has(p));
        if(!clash){ roundMatches.push(m); m.slots.forEach(p=>used.add(p)); }
        else leftover.push(m);
      });
      rounds.push(roundMatches);
      pool = leftover;
    }
    return rounds;
  }

  /* ============================= SCORING ============================= */
  const POINTS = {1:3, 2:2, 3:1};

  // Given {cid: score}, ranks contestants by score (highest first).
  // Ties split the points of the positions they occupy evenly, e.g.
  // two people tied for 1st each get (3+2)/2 = 2.5 points.
  /* ============================= NSMQ LIVE ROUND SCORING ============================= */
  const SUBJECTS = ['Biology','Physics','Chemistry','Mathematics'];
  const ROUND_INFO = {
    fundamentals: { label:'Fundamentals', count:8,  mainCorrect:3, mainPresets:[3,2,1,0], bonusCorrect:1, bonusWrong:-1 },
    speedRace:    { label:'Speed Race',   count:12, ladder:[3,2,1], wrong:-1 },
    potd:         { label:'Problem of the Day', max:10 },
    trueFalse:    { label:'True/False',   count:8,  mainCorrect:2, mainPresets:[2,-1], bonusCorrect:2, bonusWrong:-1 },
    riddles:      { label:'Riddles', count:4, cluePoints:{1:5,2:4,3:3} }
  };

  function makeGridSlots(m, count){
    // Each slot = one subject-question-position, and EVERY contestant has their own
    // turn at it (not one shared question). mainScore holds the marks actually
    // awarded (supports partial credit, e.g. a quizmaster giving 2 or 1 out of 3).
    // If a contestant's own turn isn't full marks, the bonus opens to the other
    // contestants and is credited under that same slot.
    return Array.from({length:count}, (_,i)=>{
      const turns = {};
      m.slots.forEach(cid=>{ turns[cid] = { mainScore:null, bonusCid:null, bonusResult:null }; });
      return { subject: SUBJECTS[Math.floor(i/2)%4], turns };
    });
  }

  function initLiveScoring(m){
    if(m.live) return;
    m.live = {
      fundamentals: makeGridSlots(m, ROUND_INFO.fundamentals.count),
      speedRace: Array.from({length:ROUND_INFO.speedRace.count},(_,i)=>({subject:SUBJECTS[i%4], attempts:[null,null,null]})),
      potd: { subject:'Biology', scores:{} },
      trueFalse: makeGridSlots(m, ROUND_INFO.trueFalse.count),
      riddles: Array.from({length:ROUND_INFO.riddles.count},(_,i)=>({subject:SUBJECTS[i%4], winnerCid:null, clue:null})),
      skip: { potd:false }
    };
  }

  // Scores a grid-style round (fundamentals or trueFalse) into totals.
  function scoreGridRound(m, roundKey, totals){
    const info = ROUND_INFO[roundKey];
    (m.live[roundKey]||[]).forEach(slot=>{
      Object.entries(slot.turns||{}).forEach(([cid, turn])=>{
        if(totals[cid]===undefined) return;
        if(turn.mainScore!=null) totals[cid] += turn.mainScore;
        if(turn.bonusCid && turn.bonusResult){
          const pts = turn.bonusResult==='correct' ? info.bonusCorrect : info.bonusWrong;
          if(totals[turn.bonusCid]===undefined) totals[turn.bonusCid]=0;
          totals[turn.bonusCid] += pts;
        }
      });
    });
  }

  function computeLiveTotals(m, slots){
    const totals = {}; slots.forEach(cid=>totals[cid]=0);
    if(!m.live) return totals;
    scoreGridRound(m, 'fundamentals', totals);
    (m.live.speedRace||[]).forEach(item=>{
      (item.attempts||[]).forEach((att,idx)=>{
        if(!att || !att.cid || !att.result) return;
        const pts = ROUND_INFO.speedRace.ladder[idx]!==undefined?ROUND_INFO.speedRace.ladder[idx]:1;
        totals[att.cid] += (att.result==='correct') ? pts : ROUND_INFO.speedRace.wrong;
      });
    });
    if(m.live.potd && !(m.live.skip && m.live.skip.potd)){
      Object.entries(m.live.potd.scores||{}).forEach(([cid,score])=>{
        totals[cid] = (totals[cid]||0) + (parseFloat(score)||0);
      });
    }
    scoreGridRound(m, 'trueFalse', totals);
    (m.live.riddles||[]).forEach(item=>{
      if(item.winnerCid && item.clue){
        totals[item.winnerCid] += (ROUND_INFO.riddles.cluePoints[item.clue]||ROUND_INFO.riddles.cluePoints[3]);
      }
    });
    return totals;
  }

  function computeRanksFromScores(scoresObj){
    const entries = Object.entries(scoresObj);
    entries.sort((a,b)=> b[1]-a[1]);
    const n = entries.length;
    const results = {};
    let i = 0;
    while(i<n){
      let j = i;
      while(j+1<n && entries[j+1][1]===entries[i][1]) j++;
      const posPoints = [];
      for(let k=i;k<=j;k++) posPoints.push(POINTS[k+1]!==undefined?POINTS[k+1]:0);
      const avgPoints = posPoints.reduce((a,b)=>a+b,0)/posPoints.length;
      const tied = j>i;
      for(let k=i;k<=j;k++){
        const cid = entries[k][0];
        results[cid] = { rank:i+1, score:entries[k][1], points:avgPoints, tied };
      }
      i = j+1;
    }
    return results;
  }

  function competitorName(t, cid){
    const c = (t.competitors||[]).find(x=>x.id===cid);
    return c ? c.name : '(unknown)';
  }
  function isGuestCompetitor(t, cid){
    const c = (t.competitors||[]).find(x=>x.id===cid);
    return !!(c && c.type==='guest');
  }
  function competitorMembers(t, cid){
    const c = (t.competitors||[]).find(x=>x.id===cid);
    return c && c.memberNames ? c.memberNames : null;
  }

  function computeStandings(t, stage){
    const stats = {};
    (stage.competitorIds||[]).forEach(cid=>{ stats[cid] = {cid, played:0, pts:0, score:0, ranks:[], firsts:0}; });
    (stage.matches||[]).forEach(m=>{
      if(!m.completed) return;
      m.slots.forEach(cid=>{
        const r = m.results && m.results[cid];
        if(!r || !stats[cid]) return;
        stats[cid].played++;
        // supports both new (fractional points, tie-aware) and any older (integer-rank-only) saved results
        stats[cid].pts += (typeof r.points==='number') ? r.points : (POINTS[r.rank]||0);
        stats[cid].score += (r.score||0);
        stats[cid].ranks.push(r.rank);
        if(r.rank===1) stats[cid].firsts++;
      });
    });
    const list = Object.values(stats);
    list.sort((a,b)=> b.pts-a.pts || b.score-a.score || b.firsts-a.firsts);
    return list;
  }

  /* ---- Toast notifications (replace jarring browser alert()) ---- */
  let toastEl = null;
  function toast(msg, kind){
    kind = kind || 'info'; // info | error | success
    if(!toastEl){
      toastEl = document.createElement('div');
      toastEl.id = 'toast-host';
      toastEl.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
      document.body.appendChild(toastEl);
    }
    const el = document.createElement('div');
    const colors = { info:'var(--panel-2)', error:'var(--red)', success:'var(--green)' };
    el.textContent = msg;
    el.style.cssText = `font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--text);background:var(--panel);border:1px solid ${colors[kind]};padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,0.35);max-width:90vw;text-align:center;opacity:0;transform:translateY(8px);transition:all .2s;`;
    toastEl.appendChild(el);
    requestAnimationFrame(()=>{ el.style.opacity='1'; el.style.transform='translateY(0)'; });
    setTimeout(()=>{
      el.style.opacity='0'; el.style.transform='translateY(8px)';
      setTimeout(()=>el.remove(), 250);
    }, 3200);
  }
  window.alert = (msg)=>toast(msg, 'error'); // catch any stray alert() calls too

          <div><select id="f-teamB">
            <option value="">Student B…</option>
            ${availableTeam.map(s=>`<option value="${escapeAttr(s.name)}" ${f.teamB===s.name?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}

          <div style="flex:0;"><button class="btn" data-add-team="1">Add team</button></div>
        </div>
        <div style="margin-top:12px;">`;
      f.teams.forEach((tm,i)=>{
        const seeded = f.seedIds.includes(i);
        html += `<span class="name-chip">${seeded?'★ ':''}${escapeHtml(tm[0])} &amp; ${escapeHtml(tm[1])}

        +`</div>`:''}
      </div>`;
    }

    html += `<div class="card">
      <h2>Guest schools <span class="pill">for friendlies &amp; trials</span></h2>
      <p class="sub">Invited a visiting school for a trial match? Add them here as a guest slot — they'll compete in the fixture like anyone else, but won't be tracked individually in Student Profiles or the Squad report, since we're not scoring their internal students.</p>
      <div class="row">
        <div><input type="text" id="f-guestinput" placeholder="Guest school / team name (e.g. Mfantsipim School)" value="${escapeAttr(f.guestNameInput)}"></div>

      </div>
      <div style="margin-top:12px;">`;
    f.guests.forEach((n,i)=>{
      const seeded = f.guestSeedIds.includes(i);
      html += `<span class="name-chip">🏫 ${seeded?'★ ':''}${escapeHtml(n)}
        <span class="tag-remove" data-remove-guest="${i}">✕</span></span>`;
    });
    html += `</div>
      <div class="small-note">${f.guests.length} guest slot${f.guests.length!==1?'s':''} added</div>
      ${f.guests.length>0?`<div class="divider"></div><label class="field">Mark strong / seeded guests (tap to toggle)</label><div>`+
        f.guests.map((n,i)=>`<button type="button" class="pill ${f.guestSeedIds.includes(i)?'gold':''}" data-toggle-guest-seed="${i}">${f.guestSeedIds.includes(i)?'★ ':''}🏫 ${escapeHtml(n)}</button>`).join(' ')
      +`</div>`:''}
    </div>`;

    html += `<div class="card">
        <h2>Prelim games per competitor</h2>
        <div class="row">
          <div style="max-width:140px;">
            <input type="number" id="f-games" min="1" value="${f.gamesPerCompetitor}">
          </div>
        </div>
        <p class="small-note">Total competitors × games must divide evenly by 3 (each match seats 3).</p>
      </div>
      <button class="btn btn-brass" data-create-tournament="1">Create tournament &amp; go to fixture</button>
    </div>`;
    return html;
  }

  /* ============================= TOURNAMENT DETAIL ============================= */
  function renderTournament(){
    if(!currentTournament) return `<div class="empty">Loading…</div>`;
    const t = currentTournament;
    if(ui.viewingStageIdx==null || ui.viewingStageIdx>=t.stages.length) ui.viewingStageIdx = t.currentStageIndex;
    const stageIdx = ui.viewingStageIdx;
    const stage = t.stages[stageIdx];
    const isCurrent = stageIdx === t.currentStageIndex;

    let html = `<a class="link-btn" data-nav="home">← All tournaments</a>
      <div class="flex-between" style="margin:14px 0 6px;">
        <h2 class="display" style="font-size:22px;margin:0;">${escapeHtml(t.name)}</h2>
        ${ui.isCoach ? `<button class="btn btn-danger btn-sm" data-reset-tournament="1">Delete tournament</button>` : ''}
      </div>`;

    html += `<div class="stepper">`;
    t.stages.forEach((s,i)=>{
      const cls = [];
      if(i===stageIdx) cls.push('active');
      if(i<t.currentStageIndex) cls.push('done');
      html += `<div class="step ${cls.join(' ')}" data-view-stage="${i}" style="cursor:pointer;">
        <span class="step-dot"></span>${escapeHtml(s.label)}${(i===t.currentStageIndex && i!==stageIdx)?' <span class="pill gold" style="margin-left:4px;">live</span>':''}
      </div>`;
      if(i<t.stages.length-1) html += `<div class="step-sep"></div>`;
    });
    html += `</div>`;

    if(!isCurrent){
      html += `<div class="ok-box">Viewing "${escapeHtml(stage.label)}" (completed) — read-only. Tap "${escapeHtml(t.stages[t.currentStageIndex].label)}" above to get back to the live stage.</div>`;
    }

    if(ui.isStaff && isCurrent && t.stages.length>1 && !t.champion){
      html += `<div style="margin-bottom:14px;"><a class="link-btn" data-undo-advance="1">← Undo advance, go back to "${escapeHtml(t.stages[stageIdx-1].label)}"</a></div>`;
    }

    if(t.champion){
      html += `<div class="card" style="text-align:center; border-color:var(--brass);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Champion</div>
        <div class="display" style="font-size:28px;color:var(--brass-soft);margin-top:6px;">🏆 ${escapeHtml(competitorName(t, t.champion))}</div>
        ${ui.isStaff?`<a class="link-btn" data-undo-champion="1" style="display:inline-block;margin-top:8px;">Undo this</a>`:''}
      </div>`;
    }

    html += renderStagePanel(t, stage, stageIdx, isCurrent);
    return html;
  }

  function renderStagePanel(t, stage, stageIdx, isCurrent){
    const canEdit = ui.isStaff && isCurrent;   // fixture setup, competitor edits, stage progression
    const canScore = ui.isScorer && isCurrent; // recording match results only
    let html = `<div class="card">
      <div class="flex-between">
        <div>
          <h2>${escapeHtml(stage.label)}</h2>
          <p class="sub">${stage.competitorIds.length} competitors · ${stage.gamesPerCompetitor} game${stage.gamesPerCompetitor>1?'s':''} each</p>
        </div>
      </div>`;

    if(!stage.matches || stage.matches.length===0){
      // Fixture not generated yet
      html += `<div class="divider"></div>`;
      if(!canEdit){
        html += `<p class="small-note">Fixture hasn't been generated yet — check back once your coach or staff lead sets it up.</p>`;
      } else {
        if(stageIdx===0) html += renderCompetitorEditPanel(t, stage);
        if(stage.competitorIds.length===3){
          html += `<p class="small-note">Only 3 competitors here — this is a straight decider match.</p>
            <div class="row">
              <div><label class="field">How many matches?</label><input type="number" id="f-stage-games" min="1" value="${stage.gamesPerCompetitor}"></div>
              <div style="flex:0;"><button class="btn btn-brass" data-gen-final="${stageIdx}">Generate</button></div>
            </div>`;
        } else if(stage.competitorIds.length>=3) {
          if(ui.lastFixtureError) html += `<div class="warn-box">${escapeHtml(ui.lastFixtureError)}</div>`;
          html += `<div class="row">
              <div style="flex:0;"><button class="btn btn-brass" data-gen-norepeat="${stageIdx}">Auto-generate (no repeat opponents)</button></div>
              <div style="flex:0;"><button class="btn" data-gen-serpentine="${stageIdx}">Auto-generate (balanced seed groups)</button></div>
            </div>
            <p class="small-note">"No repeat" spreads seeded players apart and guarantees nobody faces the same opponent twice — best for prelims. "Balanced seed groups" ranks competitors and snakes them into groups of 3 — best for knockout stages coming from a standings table.</p>`;
        }
      }
    } else {
      const anyCompleted = stage.matches.some(m=>m.completed);
      const canResetThis = anyCompleted ? ui.isCoach : canEdit;
      if(canResetThis){
        html += `<div class="divider"></div>
          <button class="btn btn-sm btn-ghost" data-reset-fixture="${stageIdx}">↺ ${anyCompleted?'Reset fixture (clears recorded results)':'Regenerate fixture'}</button>`;
      }
      html += renderFixtureWarnings(t, stage);
      html += `<div class="divider"></div>
        <div class="flex-between" style="margin-bottom:10px;">
          <h3 class="display" style="font-size:15px;margin:0;">Fixture</h3>
          <button class="btn btn-sm btn-ghost no-print" data-print-fixture="1">🖨 Print</button>
        </div>`;
      let matchCounter = 0;
      stage.matches.forEach((m)=>{
        matchCounter++;
        html += renderMatchTicket(t, stage, stageIdx, m, matchCounter, canEdit, canScore);
      });

      html += `<div class="divider"></div><h3 class="display" style="font-size:15px;margin:0 0 10px;">Standings</h3>`;
      html += renderStandingsTable(t, stage, stageIdx, canEdit);
    }

    html += `</div>`;
    return html;
  }

  function renderCompetitorEditPanel(t, stage){
    const g = stage.gamesPerCompetitor;
    const n = t.competitors.length;
    const seedCount = t.competitors.filter(c=>c.seed).length;
    const maxSeeds = Math.floor((3*n)/(2*g+3));
    const slotsOk = (n*g)%3===0;
    let html = `<div class="card" style="background:var(--panel-2); margin-bottom:14px;">
      <div class="flex-between">
        <h3 style="margin:0;font-size:14px;">Contestants &amp; seeds</h3>
        <span class="pill ${seedCount>maxSeeds?'':'gold'}">${seedCount} seeded · max ${maxSeeds} for ${n} people @ ${g} game${g>1?'s':''}</span>
      </div>
      <div style="margin-top:10px;">`;
    t.competitors.forEach(c=>{
      if(ui.editingNameCid===c.id){
        html += `<span class="name-chip" style="padding:4px 8px;">
          <input type="text" id="f-rename-${c.id}" value="${escapeAttr(c.name)}" style="width:140px;padding:4px 6px;">
          <button type="button" data-save-rename="${c.id}" style="background:none;border:none;color:var(--green);cursor:pointer;font-weight:700;margin-left:4px;">✓</button>
        </span>`;
      } else {
        html += `<span class="name-chip">
          <button type="button" data-edit-toggle-seed="${c.id}" style="background:none;border:none;color:${c.seed?'var(--brass-soft)':'var(--muted)'};cursor:pointer;padding:0;margin-right:4px;font-size:13px;">${c.seed?'★':'☆'}</button>
          ${c.type==='guest'?'🏫 ':''}${escapeHtml(c.name)}
          <button type="button" data-start-rename="${c.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;margin-left:5px;font-size:11px;">✏️</button>
          <span class="tag-remove" data-edit-remove-competitor="${c.id}">✕</span>
        </span>`;
      }
    });
    html += `</div>
      <div class="row" style="margin-top:10px;">
        <div><select id="f-edit-add-name">
          <option value="">${(()=>{const avail=DB.students.filter(s=>!t.competitors.some(c=>c.name===s.name));return avail.length?'Select a student…':'No available students left';})()}</option>
          ${DB.students.filter(s=>!t.competitors.some(c=>c.name===s.name)).map(s=>`<option value="${escapeAttr(s.name)}">${escapeHtml(s.name)}${s.class?' — '+escapeHtml(s.class):''}</option>`).join('')}
        </select></div>
        <div style="flex:0;"><button class="btn btn-sm" data-edit-add-competitor="1">Add</button></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div><input type="text" id="f-edit-add-guest" placeholder="Add a guest school (friendly/trial)…"></div>
        <div style="flex:0;"><button class="btn btn-sm" data-edit-add-guest="1">Add guest</button></div>
      </div>
      ${!slotsOk?`<div class="warn-box" style="margin-top:10px;">${n} competitors × ${g} games = ${n*g} slots, not divisible by 3. Add/remove a contestant or change games-per-competitor before generating.</div>`:''}
      ${seedCount>maxSeeds?`<div class="warn-box" style="margin-top:10px;">Too many seeds marked — untap ${seedCount-maxSeeds} of them (★ toggles it off) before generating.</div>`:''}
      <p class="small-note">Tap the star to mark/unmark a strong contestant. Guest schools (🏫) compete normally in the fixture but aren't tracked in Student Profiles or Squad reports.</p>
    </div>`;
    return html;
  }

  function renderFixtureWarnings(t, stage){
    // recompute duplicate pair / uneven appearance warnings live (in case of manual edits)
    const appearances = {}; const pairCount = {};
    stage.competitorIds.forEach(c=>appearances[c]=0);
    stage.matches.forEach(m=>{
      m.slots.forEach(c=>{ if(appearances[c]===undefined) appearances[c]=0; appearances[c]++; });
      for(let i=0;i<m.slots.length;i++) for(let j=i+1;j<m.slots.length;j++){
        const k = pairKey(m.slots[i], m.slots[j]);
        pairCount[k] = (pairCount[k]||0)+1;
      }
    });
    const uneven = Object.keys(appearances).filter(c=>appearances[c]!==stage.gamesPerCompetitor);
    const dupPairs = Object.keys(pairCount).filter(k=>pairCount[k]>1);
    if(uneven.length===0 && dupPairs.length===0) return '';
    let html = `<div class="warn-box">Fixture check: `;
    const bits = [];
    if(uneven.length>0) bits.push(`${uneven.length} competitor(s) don't have exactly ${stage.gamesPerCompetitor} games`);
    if(dupPairs.length>0 && stage.competitorIds.length>3) bits.push(`${dupPairs.length} pair(s) meet more than once`);
    html += bits.join(' · ') + `.</div>`;
    return html;
  }

  function renderMatchTicket(t, stage, stageIdx, m, num, canEdit, canScore){
    const mi = stage.matches.indexOf(m);
    const key = stageIdx+'|'+mi;
    const isOpen = ui.openLiveScorerKey === key;
    const rankLabel = {1:'1st',2:'2nd',3:'3rd'};
    const seatLabel = {0:'Seat 1',1:'Seat 2',2:'Seat 3'};

    let html = `<div class="match-ticket">
      <div class="m-head">
        <span class="m-label">Match ${num}${m.completed?' · <span class="completed-tag">Recorded</span>':''}</span>
        <div style="display:flex; gap:6px;">
          ${canEdit && !m.completed ? `<button type="button" class="btn btn-sm btn-ghost no-print" data-ballot-seats="${mi}" title="Randomly reorder who sits in Seat 1/2/3 — doesn't change who's competing">🎲 Ballot seats</button>` : ''}
          ${canScore ? `<button type="button" class="btn btn-sm ${isOpen?'btn-brass':'btn-ghost'} no-print" data-toggle-live-scorer="${key}">${isOpen?'▾ Hide scorer':'▸ '+(m.completed?'Edit score':'Score live')}</button>` : ''}
        </div>
      </div>
      <div class="m-players">`;

    m.slots.forEach((cid, slotIdx)=>{
      const isSeed = (t.competitors.find(c=>c.id===cid)||{}).seed;
      const isGuest = isGuestCompetitor(t, cid);
      const result = m.results && m.results[cid] ? m.results[cid] : null;
      const rankText = result && result.rank ? (result.tied?'T-':'')+rankLabel[result.rank] : '';
      if(canEdit && !m.completed){
        html += `<div class="m-player-row">
          <span class="pill" style="min-width:56px;">${seatLabel[slotIdx]}</span>
          <span class="print-only-name">${isGuest?'🏫 ':''}${escapeHtml(competitorName(t,cid))}${isSeed?' ★':''}</span>
          <select data-slot-edit="${mi}|${slotIdx}">
            ${stage.competitorIds.map(oc=>`<option value="${oc}" ${oc===cid?'selected':''}>${isGuestCompetitor(t,oc)?'🏫 ':''}${escapeHtml(competitorName(t,oc))}</option>`).join('')}
          </select>
        </div>`;
      } else {
        html += `<div class="m-player-row">
          <span class="pill" style="min-width:56px;">${seatLabel[slotIdx]}</span>
          <span class="name">${isGuest?'🏫 ':''}${escapeHtml(competitorName(t,cid))}${isSeed?'<span class="seed-star">★</span>':''}</span>
          ${m.completed ? `<span class="pill gold">${rankText}${result&&result.score!==undefined?' · '+result.score+' pts':''}</span>` : `<span class="pill">Pending</span>`}
        </div>`;
      }
    });
    html += `</div>`;

    if(isOpen){
      html += renderLiveScorer(t, m, mi);
    }
    html += `</div>`;
    return html;
  }

  function renderLiveScorer(t, m, mi){
    initLiveScoring(m);
    const names = {}; m.slots.forEach(cid=>names[cid]=competitorName(t,cid));
    const totals = computeLiveTotals(m, m.slots);

    let html = `<div class="live-scorer no-print">
      <div class="live-totals">`;
    m.slots.forEach(cid=>{
      html += `<div class="live-total-chip"><span>${escapeHtml(names[cid])}</span><span class="mono">${totals[cid]}</span></div>`;
    });
    html += `</div>`;

    html += renderMainBonusRound(m, mi, 'fundamentals', names, m.slots);
    html += renderSpeedRaceRound(m, mi, names, m.slots);
    html += renderPotdRound(m, mi, names, m.slots);
    html += renderMainBonusRound(m, mi, 'trueFalse', names, m.slots);
    html += renderRiddlesRound(m, mi, names, m.slots);

    html += `<div style="margin-top:14px;"><button class="btn btn-brass" data-finish-live-match="${mi}">✓ Finish match &amp; save score</button></div>`;
    html += `</div>`;
    return html;
  }

  function cellValueForGrid(slot, cid, info){
    let val = 0;
    const own = slot.turns[cid];
    if(own && own.mainScore!=null) val += own.mainScore;
    Object.entries(slot.turns).forEach(([ownerCid, turn])=>{
      if(ownerCid!==cid && turn.bonusCid===cid && turn.bonusResult){
        val += turn.bonusResult==='correct' ? info.bonusCorrect : info.bonusWrong;
      }
    });
    return val;
  }

  function renderMainBonusRound(m, mi, roundKey, names, slots){
    const info = ROUND_INFO[roundKey];
    const items = m.live[roundKey];
    const presetLabel = (v)=> v===info.mainCorrect ? `✓ ${v}` : (v<0 ? `✗ ${v}` : `${v}`);
    let html = `<div class="round-block">
      <div class="round-head">${info.label} <span class="pill">marks: ${info.mainPresets.join(' / ')} · bonus +${info.bonusCorrect}/${info.bonusWrong}</span></div>
      <div class="small-note" style="margin-bottom:8px;">Each contestant has their own question at every slot — tap the subject if the order isn't fixed, tap the marks actually awarded (partial credit allowed), and a bonus opens automatically to the other two if not full marks.</div>
      <div class="grid-scroll">
      <table class="score-grid">
        <thead><tr>
          <th class="grid-name-col">Contestant</th>
          ${items.map((slot,idx)=>`<th>
            <div class="grid-q-label">Q${idx+1}</div>
            <select class="mini-select" data-live-subject="${mi}|${roundKey}|${idx}">
              ${SUBJECTS.map(s=>`<option value="${s}" ${slot.subject===s?'selected':''}>${s.slice(0,4)}</option>`).join('')}
            </select>
          </th>`).join('')}
          <th>Total</th>
        </tr></thead>
        <tbody>`;
    slots.forEach(cid=>{
      let rowTotal = 0;
      let cells = '';
      items.forEach((slot, idx)=>{
        const own = slot.turns[cid] || {mainScore:null,bonusCid:null,bonusResult:null};
        const cellVal = cellValueForGrid(slot, cid, info);
        rowTotal += cellVal;
        const needsBonus = own.mainScore!=null && own.mainScore < info.mainCorrect;
        cells += `<td class="grid-cell">
          <div class="grid-cell-value ${cellVal>0?'pos':cellVal<0?'neg':''}">${cellVal}</div>
          <div class="grid-toggle">
            ${info.mainPresets.map(v=>`<button type="button" class="gbtn ${own.mainScore===v?(v===info.mainCorrect?'on-correct':'on-wrong'):''}" data-live-main-score="${mi}|${roundKey}|${idx}|${cid}|${v}">${presetLabel(v)}</button>`).join('')}
          </div>
          ${needsBonus ? `
            <select class="mini-select" data-live-bonus-cid="${mi}|${roundKey}|${idx}|${cid}">
              <option value="">Bonus…</option>
              ${slots.filter(oc=>oc!==cid).map(oc=>`<option value="${oc}" ${own.bonusCid===oc?'selected':''}>${escapeHtml(names[oc]).slice(0,8)}</option>`).join('')}
            </select>
            <div class="grid-toggle">
              <button type="button" class="gbtn ${own.bonusResult==='correct'?'on-correct':''}" data-live-bonus-result="${mi}|${roundKey}|${idx}|${cid}|correct" ${!own.bonusCid?'disabled':''}>✓</button>
              <button type="button" class="gbtn ${own.bonusResult==='wrong'?'on-wrong':''}" data-live-bonus-result="${mi}|${roundKey}|${idx}|${cid}|wrong" ${!own.bonusCid?'disabled':''}>✗</button>
            </div>
          `:''}
        </td>`;
      });
      html += `<tr><td class="grid-name-col">${escapeHtml(names[cid])}</td>${cells}<td class="mono grid-total">${rowTotal}</td></tr>`;
    });
    html += `</tbody></table></div></div>`;
    return html;
  }

  function renderSpeedRaceRound(m, mi, names, slots){
    let html = `<div class="round-block">
      <div class="round-head">Speed Race <span class="pill">1st +3 · 2nd +2 · 3rd +1 · wrong -1</span></div>`;
    m.live.speedRace.forEach((item, idx)=>{
      html += `<div class="round-item">
        <select data-live-subject="${mi}|speedRace|${idx}">
          ${SUBJECTS.map(s=>`<option value="${s}" ${item.subject===s?'selected':''}>${s}</option>`).join('')}
        </select>`;
      const ordinals = ['1st','2nd','3rd'];
      for(let slotPos=0; slotPos<3; slotPos++){
        if(slotPos>0){
          const prev = item.attempts[slotPos-1];
          if(!prev || prev.result!=='wrong') break; // only reveal next attempt after a wrong one
        }
        const att = item.attempts[slotPos];
        const usedCids = item.attempts.slice(0,slotPos).map(a=>a&&a.cid).filter(Boolean);
        html += `<span class="attempt-slot">
          <select data-live-speed-cid="${mi}|${idx}|${slotPos}">
            <option value="">${ordinals[slotPos]}…</option>
            ${slots.filter(cid=>!usedCids.includes(cid)).map(cid=>`<option value="${cid}" ${att&&att.cid===cid?'selected':''}>${escapeHtml(names[cid])}</option>`).join('')}
          </select>
          <button type="button" class="btn btn-sm ${att&&att.result==='correct'?'btn-brass':''}" data-live-speed-result="${mi}|${idx}|${slotPos}|correct" ${!att||!att.cid?'disabled':''}>✓</button>
          <button type="button" class="btn btn-sm ${att&&att.result==='wrong'?'btn-danger':''}" data-live-speed-result="${mi}|${idx}|${slotPos}|wrong" ${!att||!att.cid?'disabled':''}>✗</button>
        </span>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
    return html;
  }

  function renderPotdRound(m, mi, names, slots){
    const skipped = m.live.skip && m.live.skip.potd;
    let html = `<div class="round-block">

  function shareStandingsWhatsApp(stageIdx){
    const t = currentTournament;

  function exportStandingsCSV(stageIdx){
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    const standings = computeStandings(t, stage);
    let csv = 'Rank,Name,Played,Points,Score,Seeded\n';
    standings.forEach((s,i)=>{
      const isSeed = (t.competitors.find(c=>c.id===s.cid)||{}).seed;
      const name = competitorName(t,s.cid).replace(/"/g,'""');
      csv += `${i+1},"${name}",${s.played},${s.pts},${s.score},${isSeed?'Yes':'No'}\n`;
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${t.name.replace(/[^a-z0-9]+/gi,'-')}-${stage.label.replace(/[^a-z0-9]+/gi,'-')}-standings.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function suggestQualifyN(n){
    if(n>=20) return 9;
    if(n>=9) return Math.max(3, Math.min(9, Math.floor(n/2)));
    return 3;
  }
  function suggestNextLabel(t){
    const remaining = t.stages.length - (t.currentStageIndex+1);
    const stage = t.stages[t.currentStageIndex];
    const nextPoolGuess = stage.competitorIds.length;
    if(nextPoolGuess<=9 && nextPoolGuess>3) return 'Semifinals';
    if(nextPoolGuess<=27) return 'Quarterfinals';
    return 'Next round';
  }

  function computeDashboardStats(){
    const profiles = buildAllProfiles();

    let championCount = 0;
    (DB.fullCache||[]).forEach(t=>{
      (t.stages||[]).forEach(stage=>{
        (stage.matches||[]).forEach(m=>{ if(m.completed) matchCount++; });
      });
      if(t.champion) championCount++;

  function buildAllProfiles(){
    // aggregates by name across all loaded tournament summaries; needs full blobs -> we cache them in DB.fullCache
    const profiles = {};
    function ensure(name){
      if(!profiles[name]) profiles[name] = {tournaments:new Set(), totalPlayed:0, totalPts:0, firsts:0, rankSum:0, avgRank:0};
      return profiles[name];
    }
    (DB.fullCache||[]).forEach(t=>{
      (t.stages||[]).forEach(stage=>{
        (stage.matches||[]).forEach(m=>{
          if(!m.completed) return;
          m.slots.forEach(cid=>{
            const r = m.results && m.results[cid];
            if(!r) return;
            const comp = (t.competitors||[]).find(c=>c.id===cid);
            if(!comp || comp.type==='guest') return;
            const names = comp.memberNames && comp.memberNames.length ? comp.memberNames : [comp.name];
            names.forEach(nm=>{
              const p = ensure(nm);
              p.tournaments.add(t.id);
              p.totalPlayed++;
              p.totalPts += (typeof r.points==='number') ? r.points : (POINTS[r.rank]||0);
              if(r.rank===1) p.firsts++;
              p.rankSum += r.rank;
            });
          });
        });
      });
    });
    Object.values(profiles).forEach(p=>{ p.avgRank = p.totalPlayed>0 ? p.rankSum/p.totalPlayed : 0; });
    return profiles;
  }

  // Subject- and round-level breakdown from live NSMQ scoring data, for contest-analysis reports.
  // Builds a short auto-generated narrative from everything we already track for a student.
  function buildStudentNarrative(name, p, bd, att, asm){
    if(!p || p.totalPlayed===0) return `No recorded matches yet for ${name} — a narrative will build up automatically as results come in.`;
    const parts = [];
    const rankWord = p.avgRank<=1.5 ? 'consistently finishes at or near the top of the table'
      : p.avgRank<=2.2 ? 'usually finishes mid-table'
      : 'has mostly finished lower in matches so far';
    parts.push(`${name} has played ${p.totalPlayed} match${p.totalPlayed!==1?'es':''} across ${p.tournaments.size} tournament${p.tournaments.size!==1?'s':''}, with ${p.firsts} first-place finish${p.firsts!==1?'es':''} and an average finishing position of ${p.avgRank.toFixed(1)} — ${rankWord}.`);

    if(bd){
      const subjEntries = SUBJECTS.map(s=>{
        const v = bd.bySubject[s];
        return { s, pts:v.pts, correct:v.correct, wrong:v.wrong, attempts:v.correct+v.wrong };
      }).filter(x=>x.attempts>0);
      if(subjEntries.length>0){
        subjEntries.sort((a,b)=>b.pts-a.pts);
        const strongest = subjEntries[0];
        const weakest = subjEntries[subjEntries.length-1];
        const sAcc = Math.round(100*strongest.correct/strongest.attempts);
        parts.push(`Subject-wise, ${strongest.s} is the clear strength (${sAcc}% accuracy, ${strongest.pts.toFixed(1)} net points), which is worth leaning on in team selection.`);
        if(weakest.s!==strongest.s && subjEntries.length>1){
          const wAcc = Math.round(100*weakest.correct/weakest.attempts);
          parts.push(`${weakest.s} is comparatively weaker (${wAcc}% accuracy) and would benefit from targeted practice.`);
        }
      }
      const roundLabels = {fundamentals:'Fundamentals', speedRace:'the Speed Race', potd:'Problem of the Day', trueFalse:'True/False', riddles:'Riddles'};
      const roundEntries = Object.keys(roundLabels).map(k=>{
        const r = bd.byRound[k];
        const attempts = k==='potd' ? r.count : (k==='riddles' ? r.solved : r.correct+r.wrong);
        return { k, pts:r.pts, attempts };
      }).filter(x=>x.attempts>0);
      if(roundEntries.length>0){
        roundEntries.sort((a,b)=>b.pts-a.pts);
        const bestRound = roundEntries[0];
        parts.push(`Round-by-round, performance peaks in ${roundLabels[bestRound.k]}.`);
      }
    }

    if(att && att.count>0){
      const attWord = att.pct>=90?'excellent':att.pct>=75?'good':att.pct>=50?'inconsistent':'a real concern';
      parts.push(`Training attendance is ${attWord} at ${Math.round(att.pct)}% (${att.present}/${att.count} sessions).`);
    }
    if(asm && asm.count>0){
      parts.push(`Across ${asm.count} logged assessment${asm.count!==1?'s':''}, the average is ${Math.round(asm.pct)}%.`);
    }
    return parts.join(' ');
  }

  function buildContestBreakdown(){
    const out = {};
    function ensure(name){
      if(!out[name]) out[name] = {
        bySubject: Object.fromEntries(SUBJECTS.map(s=>[s,{correct:0,wrong:0,pts:0}])),
        byRound: {
          fundamentals:{pts:0,correct:0,wrong:0},
          speedRace:{pts:0,correct:0,wrong:0},
          potd:{pts:0,count:0},
          trueFalse:{pts:0,correct:0,wrong:0},
          riddles:{pts:0,solved:0}
        }
      };
      return out[name];
    }
    (DB.fullCache||[]).forEach(t=>{
      (t.stages||[]).forEach(stage=>{
        (stage.matches||[]).forEach(m=>{
          if(!m.completed || !m.live) return;
          const cidNames = {};
          m.slots.forEach(cid=>{
            const comp = (t.competitors||[]).find(c=>c.id===cid);
            if(comp && comp.type!=='guest') cidNames[cid] = comp.memberNames && comp.memberNames.length ? comp.memberNames : [comp.name];
          });
          function credit(cid, subject, pts, isCorrect, roundKey){
            const names = cidNames[cid]; if(!names) return;
            names.forEach(nm=>{
              const p = ensure(nm);
              if(subject){
                p.bySubject[subject].pts += pts;
                if(isCorrect===true) p.bySubject[subject].correct++;
                if(isCorrect===false) p.bySubject[subject].wrong++;
              }
              const rb = p.byRound[roundKey];
              rb.pts += pts;
              if(roundKey==='potd'){ rb.count++; return; }
              if(roundKey==='riddles'){ if(isCorrect) rb.solved++; return; }
              if(isCorrect===true) rb.correct++;
              if(isCorrect===false) rb.wrong++;
            });
          }
          function creditGridRound(roundKey){
            const info = ROUND_INFO[roundKey];
            (m.live[roundKey]||[]).forEach(slot=>{
              Object.entries(slot.turns||{}).forEach(([cid, turn])=>{
                if(turn.mainScore!=null){
                  credit(cid, slot.subject, turn.mainScore, turn.mainScore>=info.mainCorrect, roundKey);
                }
                if(turn.bonusCid && turn.bonusResult){
                  const pts = turn.bonusResult==='correct' ? info.bonusCorrect : info.bonusWrong;
                  credit(turn.bonusCid, slot.subject, pts, turn.bonusResult==='correct', roundKey);
                }
              });
            });
          }
          creditGridRound('fundamentals');
          (m.live.speedRace||[]).forEach(item=>{
            (item.attempts||[]).forEach((att,idx)=>{
              if(!att || !att.cid || !att.result) return;
              const ladder = ROUND_INFO.speedRace.ladder[idx]!==undefined?ROUND_INFO.speedRace.ladder[idx]:1;
              const pts = att.result==='correct'?ladder:ROUND_INFO.speedRace.wrong;
              credit(att.cid, item.subject, pts, att.result==='correct', 'speedRace');
            });
          });
          if(m.live.potd && !(m.live.skip&&m.live.skip.potd)){
            Object.entries(m.live.potd.scores||{}).forEach(([cid,score])=>{
              credit(cid, m.live.potd.subject, parseFloat(score)||0, null, 'potd');
            });
          }
          creditGridRound('trueFalse');
          (m.live.riddles||[]).forEach(item=>{
            if(item.winnerCid && item.clue){
              const pts = ROUND_INFO.riddles.cluePoints[item.clue]||ROUND_INFO.riddles.cluePoints[3];
              credit(item.winnerCid, item.subject, pts, true, 'riddles');
            }
          });
        });
      });
    });
    return out;
  }

  /* ============================= SQUAD: ATTENDANCE, ASSESSMENTS, AGGREGATE SCORE ============================= */
  function computeAttendancePct(name){
    let present=0, total=0;
    (DB.meetings||[]).forEach(mt=>{
      if(mt.attendance && Object.prototype.hasOwnProperty.call(mt.attendance, name)){
        total++;
        if(mt.attendance[name]) present++;
      }
    });
    return { pct: total>0 ? (present/total*100) : 0, count: total, present };
  }

  function computeAssessmentPct(name){
    let sum=0, count=0;
    (DB.assessments||[]).forEach(as=>{
      if(as.scores && Object.prototype.hasOwnProperty.call(as.scores, name) && as.maxScore>0){
        sum += (as.scores[name]/as.maxScore)*100;
        count++;
      }
    });
    return { pct: count>0 ? sum/count : 0, count };
  }

  function computeQuizPct(name, profiles){
    const p = profiles[name];
    if(!p || p.totalPlayed===0) return null;
    const val = ((3 - p.avgRank)/2)*100; // rank1=100%, rank2=50%, rank3=0%
    return Math.max(0, Math.min(100, val));
  }

  function computeAggregate(attPct, attCount, asmPct, asmCount, quizPct){
    const w = DB.weights;
    const parts = [];
    if(attCount>0) parts.push({v:attPct, w:w.attendance||0});
    if(asmCount>0) parts.push({v:asmPct, w:w.assessment||0});
    if(quizPct!=null) parts.push({v:quizPct, w:w.quiz||0});
    const totalW = parts.reduce((a,b)=>a+b.w,0);
    if(parts.length===0 || totalW<=0) return null;
    return parts.reduce((a,b)=>a+b.v*b.w,0)/totalW;
  }

  function renderAggregateTable(){
    const profiles = buildAllProfiles();
    const names = studentNames().slice().sort();
    let rows = names.map(name=>{
      const att = computeAttendancePct(name);
      const asm = computeAssessmentPct(name);
      const quiz = computeQuizPct(name, profiles);
      const agg = computeAggregate(att.pct, att.count, asm.pct, asm.count, quiz);
      return {name, att, asm, quiz, agg};
    });
    rows.sort((a,b)=>(b.agg==null?-1:b.agg)-(a.agg==null?-1:a.agg));

    let html = `<div class="card">
      <h2>Aggregate selection ranking</h2>`;
    if(rows.length===0){
      html += `<p class="small-note">No students on the roster yet — add contestants through a tournament, or add them directly below.</p>`;
    } else {
      html += `<table><thead><tr><th>#</th><th>Name</th><th>Attendance</th><th>Assessments</th><th>Quiz</th><th>Aggregate</th></tr></thead><tbody>`;
      rows.forEach((r,i)=>{
        html += `<tr>
          <td class="rank-num">${i+1}</td>
          <td>${escapeHtml(r.name)}</td>
          <td class="mono">${r.att.count>0?Math.round(r.att.pct)+'%':'—'}</td>
          <td class="mono">${r.asm.count>0?Math.round(r.asm.pct)+'%':'—'}</td>
          <td class="mono">${r.quiz!=null?Math.round(r.quiz)+'%':'—'}</td>
          <td class="mono" style="color:var(--brass-soft);font-weight:700;">${r.agg!=null?r.agg.toFixed(1)+'%':'—'}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
    if(DB.students.length===0){
      html += `<div class="divider"></div><p class="small-note">No students in the registry yet — add them on the <a class="link-btn" data-nav="students">Students</a> tab first.</p>`;

    html += `</div>`;

  }

  async function submitPinModal(){
    const m = ui.pinModal;
    const val = (m.value||'').trim();
    if(!val){ m.error = 'Enter a PIN first.'; render(); return; }
    let matched = null;
    if(DB.pins.coach && val===DB.pins.coach) matched='coach';
    else if(DB.pins.staff && val===DB.pins.staff) matched='staff';
    else if(DB.pins.scorer && val===DB.pins.scorer) matched='scorer';
    if(matched){
      ui.role = matched;
      syncRoleFlags();
      ui.pinModal = null;
      render();
    } else {
      m.error = 'That PIN is not recognized — try again.';
      render();
    }
  }

  /* ============================= ACTIONS ============================= */
  async function createTournamentFromForm(){
    if(!ui.isStaff){ alert('Staff or coach access is required to create a tournament.'); return; }
    const f = newTForm;
    const name = (f.name||'').trim() || 'Untitled tournament';
    let competitors = [];
    if(f.matchFormat==='individual'){
      competitors = f.names.map((n,i)=>({id:uid('c'), name:n, seed:f.seedIds.includes(i), type:'individual'}));
    } else {
      competitors = f.teams.map((tm,i)=>({id:uid('c'), name:tm[0]+' & '+tm[1], memberNames:tm, seed:f.seedIds.includes(i), type:'team'}));
    }
    const guestCompetitors = f.guests.map((n,i)=>({id:uid('c'), name:n, seed:f.guestSeedIds.includes(i), type:'guest'}));
    competitors = competitors.concat(guestCompetitors);
    if(competitors.length<3){
      alert('Add at least 3 competitors (or teams/guests) before creating the tournament.');
      return;
    }
    const t = {
      id: uid('t'),
      name,
      createdAt: Date.now(),
      matchFormat: f.matchFormat,
      competitors,
      stages: [{
        key:'prelims', label:'Prelims',
        gamesPerCompetitor: f.gamesPerCompetitor,
        competitorIds: competitors.map(c=>c.id),
        matches: [], qualifyN:null, locked:false
      }],
      currentStageIndex: 0,
      champion: null
    };
    await sSet('tournament:'+t.id, t);
    DB.tIndex.push({id:t.id, name:t.name, createdAt:t.createdAt, matchFormat:t.matchFormat, status:'live', stageLabel:'Prelims', competitorCount:competitors.length});
    await sSet('tournament_index', DB.tIndex);
    if(!DB.fullCache) DB.fullCache = [];
    DB.fullCache.push(t);
    currentTournament = t;
    ui.tId = t.id;
    ui.view = 'tournament';
    newTForm = null;
    render();
  }

  let tournamentUnsub = null;
  let pendingLocalSaves = 0; // count of our own writes still "in flight" — absorb their echo, don't re-render for them
  function stopWatchingTournament(){
    if(tournamentUnsub){ tournamentUnsub(); tournamentUnsub = null; }
    pendingLocalSaves = 0;
  }

  async function openTournament(id){
    stopWatchingTournament();
    const t = await sGet('tournament:'+id);
    if(!t){ alert('Could not load this tournament.'); return; }
    currentTournament = t;
    ui.tId = id;
    ui.view = 'tournament';
    ui.qualifySelection = null;
    ui.qualifySelectionStage = null;
    ui.viewingStageIdx = t.currentStageIndex;
    ui.lastFixtureError = null;
    render();
    // live sync: any device's changes to this tournament now appear here automatically
    tournamentUnsub = window.storage.subscribe('tournament:'+id, (val)=>{
      if(!val || ui.tId!==id || ui.view!=='tournament') return;
      if(pendingLocalSaves>0){
        // this is (most likely) our own write echoing back — data's already current
        // locally, so just absorb it silently instead of re-rendering on top of
        // whatever the person is doing right now (this was causing every click to
        // lag and occasionally swallow taps, like "Score live" not opening)
        pendingLocalSaves--;
        currentTournament = val;
        return;
      }
      currentTournament = val;
      const idx = (DB.fullCache||[]).findIndex(x=>x.id===id);
      if(idx>=0) DB.fullCache[idx] = val;
      render();
    });
  }

  async function ballotSeats(mi){
    if(!ui.isStaff){ toast('Staff or coach access is required.', 'error'); return; }
    const stage = currentTournament.stages[currentTournament.currentStageIndex];
    const m = stage.matches[mi];
    if(m.completed){ toast('This match is already recorded — reset it first to re-ballot.', 'error'); return; }

  async function resetFixtureForStage(stageIdx){
    const stage = currentTournament.stages[stageIdx];
    const anyCompleted = stage.matches.some(m=>m.completed);
    const allowed = anyCompleted ? ui.isCoach : ui.isStaff;
    if(!allowed){ toast(anyCompleted ? 'Coach access is required to clear recorded results.' : 'Staff or coach access is required.', 'error'); return; }
    openConfirm(
      'Reset this fixture?',
      anyCompleted
        ? 'This permanently clears every recorded result for this stage so you can regenerate it. This cannot be undone.'
        : 'This clears the current (unplayed) fixture so you can regenerate or edit contestants. Nothing has been recorded yet, so nothing is lost.',
      async ()=>{
        stage.matches = [];
        stage.qualifyN = null;
        stage.qualifiedIds = null;
        saveCurrentTournament();
        render();
      }
    );
  }

  async function saveCurrentTournament(){
    pendingLocalSaves++; // runs synchronously before any await, so it's counted before the echo can arrive
    const result = await sSet('tournament:'+currentTournament.id, currentTournament);
    if(!result){
      pendingLocalSaves = Math.max(0, pendingLocalSaves-1);
      toast('⚠️ Save failed — check your connection and try again.', 'error');
      return;
    }
    // update cache + index
    if(!DB.fullCache) DB.fullCache = [];
    const idx = DB.fullCache.findIndex(x=>x.id===currentTournament.id);
    if(idx>=0) DB.fullCache[idx] = currentTournament; else DB.fullCache.push(currentTournament);
    const iIdx = DB.tIndex.findIndex(x=>x.id===currentTournament.id);
    if(iIdx>=0){
      const stage = currentTournament.stages[currentTournament.currentStageIndex];
      DB.tIndex[iIdx].stageLabel = stage.label;
      DB.tIndex[iIdx].status = currentTournament.champion ? 'champion' : 'live';
      DB.tIndex[iIdx].competitorCount = currentTournament.competitors.length;
      await sSet('tournament_index', DB.tIndex);
    }
  }
