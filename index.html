  async function saveStudentEdit(id){
    if(!ui.isCoach) return;
    const s = DB.students.find(x=>x.id===id);
    if(!s) return;
    const nameEl = q(`#f-edit-student-name-${id}`), yearEl = q(`#f-edit-student-year-${id}`), classEl = q(`#f-edit-student-class-${id}`);
    const name = (nameEl?nameEl.value:'').trim();
    if(!name){ toast('Name cannot be empty.', 'error'); return; }
    s.name = name;
    s.yearOfAdmission = (yearEl?yearEl.value:'').trim();
    s.class = (classEl?classEl.value:'').trim();
    sSet('students', DB.students);
    ui.editingStudentId = null;
    toast('Student updated.', 'success');
    render();
  }

  async function deleteStudent(id){
    if(!ui.isCoach) return;
    DB.students = DB.students.filter(s=>s.id!==id);
    sSet('students', DB.students);
    render();
  }

  async function addMeeting(){
    if(!ui.isStaff) return;
    const nameEl = q('#f-meeting-name');
    const dateEl = q('#f-meeting-date');
    const name = (nameEl ? nameEl.value : '').trim();
    if(!name){ toast('Enter a meeting name.', 'error'); return; }
    const date = dateEl ? dateEl.value : '';
    const attendance = {};
    studentNames().forEach(n=>{ attendance[n] = false; });
    const mt = { id: uid('mt'), name, date, createdAt: Date.now(), attendance };
    DB.meetings.push(mt);
    sSet('meetings', DB.meetings);
    ui.expandedMeeting = mt.id;
    render();
  }

  async function toggleAttendance(meetingId, name, checked){
    if(!ui.isStaff) return;
    const mt = DB.meetings.find(m=>m.id===meetingId);
    if(!mt) return;
    if(!mt.attendance) mt.attendance = {};
    mt.attendance[name] = checked;
    sSet('meetings', DB.meetings);
  }

  async function deleteMeeting(id){
    if(!ui.isCoach) return;
    DB.meetings = DB.meetings.filter(m=>m.id!==id);
    sSet('meetings', DB.meetings);
    ui.expandedMeeting = null;
    render();
  }

  async function addAssessment(){
    if(!ui.isStaff) return;
    const nameEl = q('#f-assessment-name');
    const maxEl = q('#f-assessment-max');
    const dateEl = q('#f-assessment-date');
    const name = (nameEl ? nameEl.value : '').trim();
    if(!name){ toast('Enter a test name.', 'error'); return; }
    const max = maxEl ? (parseFloat(maxEl.value)||100) : 100;
    const date = dateEl ? dateEl.value : '';
    const as = { id: uid('as'), name, maxScore:max, date, createdAt: Date.now(), scores:{} };
    DB.assessments.push(as);
    sSet('assessments', DB.assessments);
    ui.expandedAssessment = as.id;
    render();
  }

  async function saveAssessmentScore(asId, name, value){
    if(!ui.isStaff) return;
    const as = DB.assessments.find(a=>a.id===asId);
    if(!as) return;
    if(!as.scores) as.scores = {};
    if(value===''||value==null) delete as.scores[name];
    else as.scores[name] = parseFloat(value);
    sSet('assessments', DB.assessments);
  }

  async function deleteAssessment(id){
    if(!ui.isCoach) return;
    DB.assessments = DB.assessments.filter(a=>a.id!==id);
    sSet('assessments', DB.assessments);
    ui.expandedAssessment = null;
    render();
  }

  async function generateFixtureForStage(stageIdx, mode){
    if(!ui.isStaff){ alert('Staff or coach access is required to generate a fixture.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    const seedIds = mode==='norepeat' ? stage.competitorIds.filter(cid=>{
      const c = t.competitors.find(x=>x.id===cid); return c && c.seed;
    }) : [];

    if(mode==='norepeat'){
      const result = generateNoRepeatFixture(stage.competitorIds, stage.gamesPerCompetitor, seedIds);
      if(!result.ok){ ui.lastFixtureError = result.reason; toast(result.reason, 'error'); render(); return; }
      const rounds = packIntoRounds(result.matches);
      stage.matches = [];
      rounds.forEach(round=>{
        round.forEach(m=>{
          stage.matches.push({id:uid('m'), slots:m.slots, results:{}, completed:false});
        });
      });
    } else {
      // serpentine — needs a rank order; use current standings if any prior data, else input order
      const priorStandings = computeStandings(t, stage);
      let rankedIds;
      const anyPlayed = priorStandings.some(s=>s.played>0);
      rankedIds = anyPlayed ? priorStandings.map(s=>s.cid) : stage.competitorIds.slice();
      const groups = generateSerpentineFixture(rankedIds, 3);
      // validate group sizes are all 3
      const bad = groups.find(g=>g.slots.length!==3);
      if(bad){
        const msg = 'Balanced grouping needs the competitor count to be a multiple of 3. Adjust qualifier count and try again.';
        ui.lastFixtureError = msg; toast(msg, 'error'); render(); return;
      }
      stage.matches = groups.map(g=>({id:uid('m'), slots:g.slots, results:{}, completed:false}));
    }
    ui.lastFixtureError = null;
    saveCurrentTournament();
    render();
  }

  async function generateFinalFixture(stageIdx, gamesCount){
    if(!ui.isStaff){ alert('Staff or coach access is required to generate a fixture.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    stage.gamesPerCompetitor = gamesCount;
    stage.matches = [];
    for(let i=0;i<gamesCount;i++){
      stage.matches.push({id:uid('m'), slots:stage.competitorIds.slice(), results:{}, completed:false});
    }
    saveCurrentTournament();
    render();
  }

  async function finishLiveMatch(mi){
    if(!ui.isScorer){ alert('Scorer, staff, or coach access is required.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const m = stage.matches[mi];
    if(!m.live){ toast('Nothing scored yet.', 'error'); return; }
    const totals = computeLiveTotals(m, m.slots);
    const ranked = computeRanksFromScores(totals);
    const anyTie = Object.values(ranked).some(r=>r.tied);
    m.results = ranked;
    m.completed = true;
    saveCurrentTournament();
    toast(anyTie ? 'Tied score detected — points for that position were split evenly.' : 'Match result saved.', anyTie?'info':'success');
    render();
  }

  async function advanceStage(){
    if(!ui.isStaff){ alert('Staff or coach access is required.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const labelEl = q('#f-next-label');
    const label = labelEl ? (labelEl.value.trim() || 'Next stage') : 'Next stage';
    const standings = computeStandings(t, stage);
    const qualified = (ui.qualifySelection && ui.qualifySelection.length>=3)
      ? ui.qualifySelection.slice()
      : standings.slice(0, suggestQualifyN(standings.length)).map(s=>s.cid);
    stage.qualifyN = qualified.length;
    stage.qualifiedIds = qualified;
    ui.qualifySelection = null;
    ui.qualifySelectionStage = null;

    const nextStage = {
      key: 'stage'+(t.stages.length),
      label,
      gamesPerCompetitor: qualified.length===3 ? 1 : 1,
      competitorIds: qualified,
      matches: [], qualifyN:null, locked:false
    };
    t.stages.push(nextStage);
    t.currentStageIndex = t.stages.length-1;
    ui.viewingStageIdx = t.currentStageIndex;
    saveCurrentTournament();
    render();
  }

  async function declareChampion(){
    if(!ui.isStaff){ alert('Staff or coach access is required.'); return; }
    const pickEl = q('#f-champion-pick');
    if(!pickEl) return;
    currentTournament.champion = pickEl.value;
    saveCurrentTournament();
    render();
  }

  /* ============================= UTIL ============================= */
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ============================= INIT ============================= */
  async function init(){
    const students = await sGet('students');
    const legacyRoster = await sGet('roster'); // migrate from the old free-text roster
    const tIndex = await sGet('tournament_index');
    const accessPins = await sGet('access_pins');
    const legacyCoachPin = await sGet('coach_pin'); // migrate from the old single-PIN system
    const meetings = await sGet('meetings');
    const assessments = await sGet('assessments');
    const weights = await sGet('selection_weights');
    const notes = await sGet('student_notes');
    if(students){
      DB.students = students;
    } else if(legacyRoster && legacyRoster.length){
      DB.students = legacyRoster.map(name=>({ id: uid('stu'), name, yearOfAdmission:'', class:'', createdAt: Date.now() }));
      await sSet('students', DB.students); // one-time migration — year/class left blank, fill in on the Students tab
    } else {
      DB.students = [];
    }
    DB.tIndex = tIndex || [];
    DB.meetings = meetings || [];
    DB.assessments = assessments || [];
    DB.weights = weights || {attendance:30, assessment:30, quiz:40};
    DB.notes = notes || {};
    if(accessPins){
      DB.pins = accessPins;
    } else if(legacyCoachPin){
      DB.pins = {coach: legacyCoachPin, staff:null, scorer:null};
      await sSet('access_pins', DB.pins); // one-time migration
    } else {
      DB.pins = {coach:null, staff:null, scorer:null};
    }
    DB.fullCache = [];
    // preload all tournament blobs for profile aggregation
    for(const summary of DB.tIndex){
      const full = await sGet('tournament:'+summary.id);
      if(full) DB.fullCache.push(full);
    }
    render();
  }

  init();
})();
</script>
