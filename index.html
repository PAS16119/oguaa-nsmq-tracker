<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oguaa NSMQ Team — Tournament Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1826;
    --panel:#152238;
    --panel-2:#1C2E4A;
    --hair:#2A3B57;
    --paper:#F4EFE3;
    --brass:#C9A227;
    --brass-soft:#E4C868;
    --green:#4F9A6E;
    --red:#C1553B;
    --text:#EAEFF6;
    --muted:#8FA1BC;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Fraunces',serif;}

  /* ---------- Header ---------- */
  header.top{
    padding:22px 20px 18px;
    border-bottom:1px solid var(--hair);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark-img{
    width:44px;height:44px;border-radius:8px;object-fit:cover;
    flex-shrink:0; box-shadow:0 0 0 1px var(--hair);
  }
  .brand h1{font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0; letter-spacing:0.2px;}
  .brand p{margin:0; font-size:12px; color:var(--muted); letter-spacing:0.4px; text-transform:uppercase;}
  nav.tabs{display:flex; gap:4px; flex-wrap:wrap;}
  nav.tabs button{
    background:transparent; border:1px solid transparent; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:999px; cursor:pointer; transition:all .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{background:var(--panel-2); color:var(--brass-soft); border-color:var(--hair);}

  main{max-width:960px; margin:0 auto; padding:24px 20px;}

  /* ---------- Generic components ---------- */
  .card{
    background:var(--panel); border:1px solid var(--hair); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:16px;
  }
  .card h2{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0 0 4px;}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:10px 16px; border-radius:8px; border:1px solid var(--hair);
    background:var(--panel-2); color:var(--text); cursor:pointer; transition:all .15s;
  }
  .btn:hover{border-color:var(--brass);}
  .btn-brass{background:var(--brass); border-color:var(--brass); color:var(--ink);}
  .btn-brass:hover{background:var(--brass-soft);}
  .btn-ghost{background:transparent;}
  .btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:rgba(193,85,59,0.12);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  input[type=text], input[type=number], select, textarea{
    background:var(--ink); border:1px solid var(--hair); color:var(--text);
    border-radius:6px; padding:9px 10px; font-family:'Inter',sans-serif; font-size:14px;
    width:100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--brass); outline-offset:1px;
  }
  label.field{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.3px;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .row > div{flex:1; min-width:140px;}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--panel-2); border:1px solid var(--hair); border-radius:999px;
    padding:4px 10px; font-size:12px; color:var(--muted);
  }
  .pill.gold{color:var(--brass-soft); border-color:var(--brass);}
  .empty{
    text-align:center; padding:40px 20px; color:var(--muted);
  }
  .empty .display{font-size:16px; color:var(--text); margin-bottom:6px;}
  .warn-box{
    background:rgba(193,85,59,0.1); border:1px solid var(--red); border-radius:8px;
    padding:10px 14px; font-size:13px; color:#E9A594; margin-bottom:12px;
  }
  .ok-box{
    background:rgba(79,154,110,0.1); border:1px solid var(--green); border-radius:8px;
    padding:10px 14px; font-size:13px; color:#A8D6BB; margin-bottom:12px;
  }
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--hair);
  }
  td{padding:9px 10px; border-bottom:1px solid rgba(42,59,87,0.5);}
  tr:last-child td{border-bottom:none;}
  .rank-num{font-family:'IBM Plex Mono',monospace; color:var(--brass-soft); font-weight:600;}
  .seed-star{color:var(--brass-soft); margin-left:3px;}

  /* ---------- Tournament list ---------- */
  .t-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background:var(--panel); border:1px solid var(--hair);
    border-radius:var(--radius); margin-bottom:10px; cursor:pointer; transition:border-color .15s;
  }
  .t-list-item:hover{border-color:var(--brass);}
  .t-list-item h3{font-family:'Fraunces',serif; font-size:16px; margin:0 0 3px; font-weight:600;}
  .t-list-item p{margin:0; font-size:12px; color:var(--muted);}
  .status-badge{
    font-size:10px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700;
    padding:3px 8px; border-radius:999px;
  }
  .status-live{background:rgba(201,162,39,0.15); color:var(--brass-soft);}
  .status-done{background:rgba(79,154,110,0.15); color:var(--green);}

  /* ---------- Stage stepper ---------- */
  .stepper{display:flex; align-items:center; gap:0; margin-bottom:18px; overflow-x:auto;}
  .step{
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    color:var(--muted); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .step.active{color:var(--brass-soft);}
  .step.done{color:var(--green);}
  .step-dot{width:8px;height:8px;border-radius:50%; background:var(--hair);}
  .step.active .step-dot{background:var(--brass-soft);}
  .step.done .step-dot{background:var(--green);}
  .step-sep{width:24px; height:1px; background:var(--hair);}

  /* ---------- Match ticket ---------- */
  .match-ticket{
    background:var(--panel); border:1px dashed var(--hair); border-radius:10px;
    padding:14px 16px; margin-bottom:12px; position:relative;
  }
  .match-ticket .m-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .match-ticket .m-head .m-label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .m-players{display:grid; gap:8px;}
  .m-player-row{
    display:flex; align-items:center; gap:10px; background:var(--ink);
    border:1px solid var(--hair); border-radius:7px; padding:8px 10px;
  }
  .m-player-row .name{flex:1; font-weight:600; font-size:14px;}
  .m-player-row select, .m-player-row input{width:auto; min-width:88px;}
  .m-player-row .score-input{width:70px;}
  .completed-tag{color:var(--green); font-size:11px; font-weight:700; text-transform:uppercase;}

  /* ---------- Standings ---------- */
  .form-dots{display:flex; gap:3px;}
  .form-dot{width:7px;height:7px;border-radius:50%;}
  .form-1{background:var(--brass-soft);}
  .form-2{background:#7996B8;}
  .form-3{background:#4A5C7A;}

  /* ---------- Profile card ---------- */
  .profile-card{
    background:var(--panel); border:1px solid var(--hair); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px;
  }
  .profile-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .profile-head h3{font-family:'Fraunces',serif; margin:0; font-size:17px;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:10px; margin-top:10px;}
  .stat-box{text-align:center; background:var(--ink); border-radius:8px; padding:8px 4px;}
  .stat-box .v{font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--brass-soft); font-weight:600;}
  .stat-box .l{font-size:10px; color:var(--muted); text-transform:uppercase; margin-top:2px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,10,18,0.7); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:var(--panel); border:1px solid var(--hair); border-radius:12px;
    padding:22px; max-width:420px; width:100%;
  }
  .modal h3{font-family:'Fraunces',serif; margin:0 0 8px;}
  .modal p{font-size:13px; color:var(--muted); margin:0 0 16px;}
  .modal .actions{display:flex; gap:10px; justify-content:flex-end;}

  .loading-screen{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px;}
  .checkbox-row input{width:auto;}
  .small-note{font-size:12px; color:var(--muted); margin-top:8px;}
  .divider{height:1px; background:var(--hair); margin:16px 0;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  a.link-btn{color:var(--brass-soft); font-size:13px; font-weight:600; text-decoration:none; cursor:pointer;}
  a.link-btn:hover{text-decoration:underline;}
  .tag-remove{cursor:pointer; color:var(--red); font-weight:700; margin-left:4px;}
  .name-chip{
    display:inline-flex; align-items:center; background:var(--panel-2); border:1px solid var(--hair);
    border-radius:999px; padding:5px 10px 5px 12px; font-size:13px; margin:3px 4px 3px 0;
  }
  @media (max-width:600px){
    header.top{padding:16px 14px;}
    main{padding:16px 14px;}
    nav.tabs{width:100%; justify-content:flex-start;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Loading Oguaa NSMQ tracker…</div></div>

<script type="module">
  // ---- Firebase-backed storage shim ----
  // Replaces Claude-artifact window.storage with a real shared backend so
  // this app works when deployed independently (e.g. on Vercel).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, get as fbGet, set as fbSet, remove as fbRemove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdaKKoga1GwS96RpKQSLpP5p7Hq9M_oXo",
    authDomain: "oguaa-nsmq.firebaseapp.com",
    databaseURL: "https://oguaa-nsmq-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "oguaa-nsmq",
    storageBucket: "oguaa-nsmq.firebasestorage.app",
    messagingSenderId: "758676948712",
    appId: "1:758676948712:web:b0ccab1939a21bbe9beb5d"
  };

  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);
  const ROOT = "oguaa_nsmq"; // matches the security rule path

  function safeKey(key){
    // Firebase RTDB paths can't contain . # $ [ ] — sanitize just in case
    return String(key).replace(/[.#$\[\]:]/g, "_");
  }

  window.storage = {
    async get(key){
      const snap = await fbGet(ref(db, ROOT + "/" + safeKey(key)));
      if(!snap.exists()) return null;
      return { key, value: snap.val(), shared: true };
    },
    async set(key, value){
      try{
        await fbSet(ref(db, ROOT + "/" + safeKey(key)), value);
        return { key, value, shared: true };
      }catch(e){
        console.error("firebase set failed", key, e);
        return null;
      }
    },
    async delete(key){
      try{
        await fbRemove(ref(db, ROOT + "/" + safeKey(key)));
        return { key, deleted:true, shared: true };
      }catch(e){
        return null;
      }
    },
    async list(){
      return { keys: [], shared: true }; // not used by this app
    }
  };
</script>

  /* ============================= FIXTURE ENGINE ============================= */
  // Greedy randomized: n competitors, g games each, no repeated pair, optional seed separation.
  function generateNoRepeatFixture(competitorIds, gamesEach, seedIds, maxAttempts){
    maxAttempts = maxAttempts || 4000;
    const seedSet = new Set(seedIds||[]);
    const n = competitorIds.length;
    if((n*gamesEach) % 3 !== 0){
      return {ok:false, reason:`${n} competitors × ${gamesEach} games = ${n*gamesEach} player-slots, which isn't divisible by 3. Adjust games-per-competitor or the roster size.`};
    }
    // feasibility check for seed separation: s <= 3n/(2g+3)
    if(seedSet.size>0){
      const maxSeeds = Math.floor((3*n)/(2*gamesEach+3));
      if(seedSet.size > maxSeeds){
        return {ok:false, reason:`Too many seeded/strong players for this pool. With ${n} competitors and ${gamesEach} games each, at most ${maxSeeds} can be kept apart from each other. You have ${seedSet.size} marked.`};
      }
    }
    for(let attempt=0; attempt<maxAttempts; attempt++){
      const res = attemptOnce(competitorIds, gamesEach, seedSet);
      if(res) return {ok:true, matches:res};
    }
    return {ok:false, reason:'Could not find a valid no-repeat schedule after many attempts. Try lowering games-per-competitor or the number of seeded players.'};
  }

  function attemptOnce(competitorIds, gamesEach, seedSet){
    const remaining = {}; competitorIds.forEach(c=> remaining[c]=gamesEach);
    const usedPairs = new Set();
    const triples = [];
    let guard = 0;
    while(true){
      guard++;
      if(guard>20000) return null;
      let avail = competitorIds.filter(c=>remaining[c]>0);
      if(avail.length===0) break;
      shuffleArr(avail);
      let found=false;
      outer:
      for(let i=0;i<avail.length;i++){
        for(let j=i+1;j<avail.length;j++){
          for(let k=j+1;k<avail.length;k++){
            const a=avail[i], b=avail[j], c=avail[k];
            if(remaining[a]<=0||remaining[b]<=0||remaining[c]<=0) continue;
            const strongCount = [a,b,c].filter(x=>seedSet.has(x)).length;
            if(strongCount>1) continue;
            const p1=pairKey(a,b), p2=pairKey(a,c), p3=pairKey(b,c);
            if(usedPairs.has(p1)||usedPairs.has(p2)||usedPairs.has(p3)) continue;
            triples.push([a,b,c]);
            usedPairs.add(p1); usedPairs.add(p2); usedPairs.add(p3);
            remaining[a]--; remaining[b]--; remaining[c]--;
            found=true;
            break outer;
          }
        }
      }
      if(!found) return null;
    }
    return triples;
  }
  function pairKey(a,b){ return [a,b].sort().join('|'); }
  function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

  // Balanced serpentine grouping by rank, group size 3, one match per group (single round)
  function generateSerpentineFixture(rankedIds, groupSize){
    groupSize = groupSize||3;
    const groups = [];
    const numGroups = Math.ceil(rankedIds.length/groupSize);
    for(let i=0;i<numGroups;i++) groups.push([]);
    let dir=1, gi=0;
    for(let i=0;i<rankedIds.length;i++){
      groups[gi].push(rankedIds[i]);
      gi += dir;
      if(gi===numGroups){ gi=numGroups-1; dir=-1; }
      else if(gi<0){ gi=0; dir=1; }
    }
    return groups.filter(g=>g.length>0).map(g=>({slots:g}));
  }

  function packIntoRounds(matches){
    // matches: array of [a,b,c]; returns rounds of disjoint-people matches
    const remaining = matches.map(m=>({slots:m}));
    const rounds = [];
    let guard=0;
    let pool = remaining.slice();
    while(pool.length>0 && guard<1000){
      guard++;
      const used = new Set();
      const roundMatches = [];
      const leftover = [];
      pool.forEach(m=>{
        const clash = m.slots.some(p=>used.has(p));
        if(!clash){ roundMatches.push(m); m.slots.forEach(p=>used.add(p)); }
        else leftover.push(m);
      });
      rounds.push(roundMatches);
      pool = leftover;
    }
    return rounds;
  }

  /* ============================= SCORING ============================= */
  const POINTS = {1:3, 2:2, 3:1};

  function competitorName(t, cid){
    const c = (t.competitors||[]).find(x=>x.id===cid);
    return c ? c.name : '(unknown)';
  }
  function competitorMembers(t, cid){
    const c = (t.competitors||[]).find(x=>x.id===cid);
    return c && c.memberNames ? c.memberNames : null;
  }

  function computeStandings(t, stage){
    const stats = {};
    (stage.competitorIds||[]).forEach(cid=>{ stats[cid] = {cid, played:0, pts:0, score:0, ranks:[], firsts:0}; });
    (stage.matches||[]).forEach(m=>{
      if(!m.completed) return;
      m.slots.forEach(cid=>{
        const r = m.results && m.results[cid];
        if(!r || !stats[cid]) return;
        stats[cid].played++;
        stats[cid].pts += POINTS[r.rank]||0;
        stats[cid].score += (r.score||0);
        stats[cid].ranks.push(r.rank);
        if(r.rank===1) stats[cid].firsts++;
      });
    });
    const list = Object.values(stats);
    list.sort((a,b)=> b.pts-a.pts || b.score-a.score || b.firsts-a.firsts);
    return list;
  }

      <p class="sub">Set up the ballot — add contestants, choose format, mark anyone known to be strong.</p>

      <div class="row">
        <div>
          <label class="field">Tournament name</label>
          <input type="text" id="f-name" value="${escapeAttr(f.name)}" placeholder="e.g. July Mock Prelims">
        </div>
        <div>
          <label class="field">Format</label>
          <select id="f-format">
            <option value="individual" ${f.matchFormat==='individual'?'selected':''}>Individual (3 people per match)</option>
            <option value="team" ${f.matchFormat==='team'?'selected':''}>Team (pairs of 2, teams face off 3-way)</option>
          </select>
        </div>
      </div>
    </div>`;

    if(f.matchFormat==='individual'){
      html += `<div class="card">
        <h2>Contestants</h2>
        <p class="sub">Add each student's name. Mark the ones you already know are relatively strong — the fixture will keep strong players apart in the prelims.</p>
        <div class="row">
          <div><input type="text" id="f-nameinput" placeholder="Student name" value="${escapeAttr(f.nameInput)}"></div>
          <div style="flex:0;"><button class="btn" data-add-name="1">Add</button></div>
        </div>
        <div style="margin-top:12px;">`;
      f.names.forEach((n,i)=>{
        const seeded = f.seedIds.includes(i);
        html += `<span class="name-chip">${seeded?'★ ':''}${escapeHtml(n)}
          <span class="tag-remove" data-remove-name="${i}">✕</span></span>`;

      html += `</div>
        <div class="small-note">${f.names.length} added</div>
        ${f.names.length>0?`<div class="divider"></div><label class="field">Mark strong / seeded contestants (tap to toggle)</label><div>` +
          f.names.map((n,i)=>`<button type="button" class="pill ${f.seedIds.includes(i)?'gold':''}" data-toggle-seed="${i}">${f.seedIds.includes(i)?'★ ':''}${escapeHtml(n)}</button>`).join(' ')
        +`</div>`:''}
      </div>`;
    } else {
      html += `<div class="card">
        <h2>Build teams</h2>
        <p class="sub">Pair two students into a team. Each match will still be 3-way — three teams competing.</p>
        <div class="row">
          <div><input type="text" id="f-teamA" placeholder="Student A" value="${escapeAttr(f.teamA)}"></div>
          <div><input type="text" id="f-teamB" placeholder="Student B" value="${escapeAttr(f.teamB)}"></div>
          <div style="flex:0;"><button class="btn" data-add-team="1">Add team</button></div>
        </div>
        <div style="margin-top:12px;">`;
      f.teams.forEach((tm,i)=>{
        const seeded = f.seedIds.includes(i);
        html += `<span class="name-chip">${seeded?'★ ':''}${escapeHtml(tm[0])} &amp; ${escapeHtml(tm[1])}
          <span class="tag-remove" data-remove-team="${i}">✕</span></span>`;
      });
      html += `</div>
        <div class="small-note">${f.teams.length} teams added</div>
        ${f.teams.length>0?`<div class="divider"></div><label class="field">Mark strong / seeded teams</label><div>`+
          f.teams.map((tm,i)=>`<button type="button" class="pill ${f.seedIds.includes(i)?'gold':''}" data-toggle-seed="${i}">${f.seedIds.includes(i)?'★ ':''}${escapeHtml(tm[0])}&${escapeHtml(tm[1])}</button>`).join(' ')
        +`</div>`:''}
      </div>`;
    }

    html += `<div class="card">
        <h2>Prelim games per competitor</h2>
        <div class="row">
          <div style="max-width:140px;">
            <input type="number" id="f-games" min="1" value="${f.gamesPerCompetitor}">
          </div>
        </div>
        <p class="small-note">Total competitors × games must divide evenly by 3 (each match seats 3).</p>
      </div>
      <button class="btn btn-brass" data-create-tournament="1">Create tournament &amp; go to fixture</button>
    </div>`;
    return html;
  }

  /* ============================= TOURNAMENT DETAIL ============================= */
  function renderTournament(){
    if(!currentTournament) return `<div class="empty">Loading…</div>`;
    const t = currentTournament;
    const stageIdx = t.currentStageIndex;
    const stage = t.stages[stageIdx];

    let html = `<a class="link-btn" data-nav="home">← All tournaments</a>
      <div class="flex-between" style="margin:14px 0 6px;">
        <h2 class="display" style="font-size:22px;margin:0;">${escapeHtml(t.name)}</h2>
        ${ui.isCoach ? `<button class="btn btn-danger btn-sm" data-reset-tournament="1">Delete tournament</button>` : ''}
      </div>`;

    html += `<div class="stepper">`;
    t.stages.forEach((s,i)=>{
      const cls = i===stageIdx?'active':(i<stageIdx?'done':'');
      html += `<div class="step ${cls}"><span class="step-dot"></span>${escapeHtml(s.label)}</div>`;
      if(i<t.stages.length-1) html += `<div class="step-sep"></div>`;
    });
    html += `</div>`;

    if(t.champion){
      html += `<div class="card" style="text-align:center; border-color:var(--brass);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Champion</div>
        <div class="display" style="font-size:28px;color:var(--brass-soft);margin-top:6px;">🏆 ${escapeHtml(competitorName(t, t.champion))}</div>
      </div>`;
    }

    html += renderStagePanel(t, stage, stageIdx);
    return html;
  }

  function renderStagePanel(t, stage, stageIdx){
    let html = `<div class="card">
      <div class="flex-between">
        <div>
          <h2>${escapeHtml(stage.label)}</h2>
          <p class="sub">${stage.competitorIds.length} competitors · ${stage.gamesPerCompetitor} game${stage.gamesPerCompetitor>1?'s':''} each</p>
        </div>
      </div>`;

    if(!stage.matches || stage.matches.length===0){
      // Fixture not generated yet
      html += `<div class="divider"></div>`;
      if(!ui.isCoach){
        html += `<p class="small-note">Fixture hasn't been generated yet — check back once your coach sets it up.</p>`;
      } else if(stage.competitorIds.length===3){
        html += `<p class="small-note">Only 3 competitors here — this is a straight decider match.</p>
          <div class="row">
            <div><label class="field">How many matches?</label><input type="number" id="f-stage-games" min="1" value="${stage.gamesPerCompetitor}"></div>
            <div style="flex:0;"><button class="btn btn-brass" data-gen-final="${stageIdx}">Generate</button></div>
          </div>`;
      } else {
        html += `<div class="row">
            <div style="flex:0;"><button class="btn btn-brass" data-gen-norepeat="${stageIdx}">Auto-generate (no repeat opponents)</button></div>
            <div style="flex:0;"><button class="btn" data-gen-serpentine="${stageIdx}">Auto-generate (balanced seed groups)</button></div>
          </div>
          <p class="small-note">"No repeat" spreads seeded players apart and guarantees nobody faces the same opponent twice — best for prelims. "Balanced seed groups" ranks competitors and snakes them into groups of 3 — best for knockout stages coming from a standings table.</p>`;
      }
    } else {
      html += renderFixtureWarnings(t, stage);
      html += `<div class="divider"></div><h3 class="display" style="font-size:15px;margin:0 0 10px;">Fixture</h3>`;
      let matchCounter = 0;
      stage.matches.forEach((m)=>{
        matchCounter++;
        html += renderMatchTicket(t, stage, stageIdx, m, matchCounter);
      });

      html += `<div class="divider"></div><h3 class="display" style="font-size:15px;margin:0 0 10px;">Standings</h3>`;
      html += renderStandingsTable(t, stage, stageIdx);
    }

    html += `</div>`;
    return html;
  }

  function renderFixtureWarnings(t, stage){
    // recompute duplicate pair / uneven appearance warnings live (in case of manual edits)
    const appearances = {}; const pairCount = {};
    stage.competitorIds.forEach(c=>appearances[c]=0);
    stage.matches.forEach(m=>{
      m.slots.forEach(c=>{ if(appearances[c]===undefined) appearances[c]=0; appearances[c]++; });
      for(let i=0;i<m.slots.length;i++) for(let j=i+1;j<m.slots.length;j++){
        const k = pairKey(m.slots[i], m.slots[j]);
        pairCount[k] = (pairCount[k]||0)+1;
      }
    });
    const uneven = Object.keys(appearances).filter(c=>appearances[c]!==stage.gamesPerCompetitor);
    const dupPairs = Object.keys(pairCount).filter(k=>pairCount[k]>1);
    if(uneven.length===0 && dupPairs.length===0) return '';
    let html = `<div class="warn-box">Fixture check: `;
    const bits = [];
    if(uneven.length>0) bits.push(`${uneven.length} competitor(s) don't have exactly ${stage.gamesPerCompetitor} games`);
    if(dupPairs.length>0 && stage.competitorIds.length>3) bits.push(`${dupPairs.length} pair(s) meet more than once`);
    html += bits.join(' · ') + `.</div>`;
    return html;
  }

  function renderMatchTicket(t, stage, stageIdx, m, num){
    let html = `<div class="match-ticket">
      <div class="m-head">
        <span class="m-label">Match ${num}${m.completed?' · <span class="completed-tag">Recorded</span>':''}</span>
      </div>
      <div class="m-players">`;
    const rankLabel = {1:'1st',2:'2nd',3:'3rd'};
    m.slots.forEach((cid, slotIdx)=>{
      const isSeed = (t.competitors.find(c=>c.id===cid)||{}).seed;
      const result = m.results && m.results[cid] ? m.results[cid] : {rank:'', score:''};
      if(ui.isCoach){
        html += `<div class="m-player-row">
          <select data-slot-edit="${stage.matches.indexOf(m)}|${slotIdx}" ${m.completed?'disabled':''}>
            ${stage.competitorIds.map(oc=>`<option value="${oc}" ${oc===cid?'selected':''}>${escapeHtml(competitorName(t,oc))}</option>`).join('')}
          </select>
          <select data-rank-input="${stage.matches.indexOf(m)}|${cid}">
            <option value="">Rank…</option>
            <option value="1" ${result.rank==1?'selected':''}>1st</option>
            <option value="2" ${result.rank==2?'selected':''}>2nd</option>
            <option value="3" ${result.rank==3?'selected':''}>3rd</option>
          </select>
          <input type="number" class="score-input" placeholder="Score" data-score-input="${stage.matches.indexOf(m)}|${cid}" value="${result.score!==undefined && result.score!==''?result.score:''}">
        </div>`;
      } else {
        html += `<div class="m-player-row">
          <span class="name">${escapeHtml(competitorName(t,cid))}${isSeed?'<span class="seed-star">★</span>':''}</span>
          ${m.completed ? `<span class="pill gold">${rankLabel[result.rank]||''}${result.score!==undefined&&result.score!==''?' · '+result.score:''}</span>` : `<span class="pill">Pending</span>`}
        </div>`;
      }
    });
    html += `</div>`;
    if(ui.isCoach){
      html += `<div style="margin-top:10px; display:flex; gap:8px;">
        <button class="btn btn-sm btn-brass" data-save-match="${stage.matches.indexOf(m)}">Save result</button>
        ${m.completed?`<button class="btn btn-sm btn-ghost" data-edit-match="${stage.matches.indexOf(m)}">Edit</button>`:''}
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  function renderStandingsTable(t, stage, stageIdx){
    const standings = computeStandings(t, stage);
    const anyCompleted = stage.matches.some(m=>m.completed);
    if(!anyCompleted){
      return `<p class="small-note">Standings will appear once results are recorded.</p>`;
    }
    let html = `<table><thead><tr>
      <th>#</th><th>Name</th><th>Played</th><th>Pts</th><th>Score</th><th>Form</th>
    </tr></thead><tbody>`;
    standings.forEach((s,i)=>{
      const isSeed = (t.competitors.find(c=>c.id===s.cid)||{}).seed;
      html += `<tr>
        <td class="rank-num">${i+1}</td>
        <td>${escapeHtml(competitorName(t,s.cid))}${isSeed?'<span class="seed-star">★</span>':''}</td>
        <td>${s.played}/${stage.gamesPerCompetitor}</td>
        <td class="mono">${s.pts}</td>
        <td class="mono">${s.score}</td>
        <td><div class="form-dots">${s.ranks.map(r=>`<span class="form-dot form-${r}"></span>`).join('')}</div></td>
      </tr>`;
    });
    html += `</tbody></table>`;

    const allComplete = stage.matches.every(m=>m.completed);
    const isLastStage = stageIdx === t.stages.length-1;
    if(allComplete && !ui.isCoach){
      html += `<div class="divider"></div><p class="small-note">All matches in — ask your coach to advance the tournament to the next stage.</p>`;
    }
    if(allComplete && ui.isCoach){
      if(isLastStage && stage.competitorIds.length<=3){
        html += `<div class="divider"></div>
          <p class="small-note">All matches recorded. Declare the champion:</p>
          <div class="row">
            <div>
              <select id="f-champion-pick">
                ${standings.map(s=>`<option value="${s.cid}">${escapeHtml(competitorName(t,s.cid))}</option>`).join('')}
              </select>
            </div>
            <div style="flex:0;"><button class="btn btn-brass" data-declare-champion="1">Crown champion</button></div>
          </div>`;
      } else {
        html += `<div class="divider"></div>
          <p class="small-note">Ready to advance. Choose how many qualify to the next stage:</p>
          <div class="row">
            <div><label class="field">Qualifiers</label><input type="number" id="f-qualify-n" min="3" max="${standings.length}" value="${suggestQualifyN(standings.length)}"></div>
            <div><label class="field">Next stage name</label><input type="text" id="f-next-label" value="${suggestNextLabel(t)}"></div>
            <div style="flex:0;"><button class="btn btn-brass" data-advance-stage="1">Advance top N</button></div>
          </div>`;
      }
    }
    return html;
  }

  function suggestQualifyN(n){
    if(n>=20) return 9;
    if(n>=9) return Math.max(3, Math.min(9, Math.floor(n/2)));
    return 3;
  }
  function suggestNextLabel(t){
    const remaining = t.stages.length - (t.currentStageIndex+1);
    const stage = t.stages[t.currentStageIndex];
    const nextPoolGuess = stage.competitorIds.length;
    if(nextPoolGuess<=9 && nextPoolGuess>3) return 'Semifinals';
    if(nextPoolGuess<=27) return 'Quarterfinals';
    return 'Next round';
  }

  /* ============================= PROFILES ============================= */
  function renderProfiles(){
    let html = `<h2 class="display" style="font-size:22px;">Student profiles</h2>
      <p class="sub">Performance across every tournament this student has played in.</p>
      <div class="row" style="margin-bottom:14px;">
        <div><input type="text" id="f-profile-filter" placeholder="Search a name…" value="${escapeAttr(ui.profileFilter)}"></div>
      </div>`;

    const profiles = buildAllProfiles();
    let names = Object.keys(profiles);
    if(ui.profileFilter.trim()){
      const q = ui.profileFilter.trim().toLowerCase();
      names = names.filter(n=>n.toLowerCase().includes(q));
    }
    names.sort((a,b)=>profiles[b].totalPts-profiles[a].totalPts);

    if(names.length===0){
      html += `<div class="empty card"><div class="display">No results yet</div><p>Once matches are recorded, students will show up here.</p></div>`;
      return html;
    }

    names.forEach(name=>{
      const p = profiles[name];
      const winRate = p.totalPlayed>0 ? Math.round(100*p.firsts/p.totalPlayed) : 0;
      html += `<div class="profile-card">
        <div class="profile-head">
          <h3>${escapeHtml(name)}</h3>
          <span class="pill">${p.tournaments.size} tournament${p.tournaments.size!==1?'s':''}</span>
        </div>
        <div class="stat-grid">
          <div class="stat-box"><div class="v">${p.totalPlayed}</div><div class="l">Matches</div></div>
          <div class="stat-box"><div class="v">${p.totalPts}</div><div class="l">Points</div></div>
          <div class="stat-box"><div class="v">${p.firsts}</div><div class="l">1st place</div></div>
          <div class="stat-box"><div class="v">${winRate}%</div><div class="l">Win rate</div></div>
          <div class="stat-box"><div class="v">${p.avgRank.toFixed(1)}</div><div class="l">Avg rank</div></div>
        </div>
      </div>`;
    });
    return html;
  }

  function buildAllProfiles(){
    // aggregates by name across all loaded tournament summaries; needs full blobs -> we cache them in DB.fullCache
    const profiles = {};
    function ensure(name){
      if(!profiles[name]) profiles[name] = {tournaments:new Set(), totalPlayed:0, totalPts:0, firsts:0, rankSum:0, avgRank:0};
      return profiles[name];
    }
    (DB.fullCache||[]).forEach(t=>{
      (t.stages||[]).forEach(stage=>{
        (stage.matches||[]).forEach(m=>{
          if(!m.completed) return;
          m.slots.forEach(cid=>{
            const r = m.results && m.results[cid];
            if(!r) return;
            const comp = (t.competitors||[]).find(c=>c.id===cid);
            if(!comp) return;
            const names = comp.memberNames && comp.memberNames.length ? comp.memberNames : [comp.name];
            names.forEach(nm=>{
              const p = ensure(nm);
              p.tournaments.add(t.id);
              p.totalPlayed++;
              p.totalPts += POINTS[r.rank]||0;
              if(r.rank===1) p.firsts++;
              p.rankSum += r.rank;
            });
          });
        });
      });
    });
    Object.values(profiles).forEach(p=>{ p.avgRank = p.totalPlayed>0 ? p.rankSum/p.totalPlayed : 0; });
    return profiles;
  }

  /* ============================= EVENTS ============================= */
  function bindEvents(){
    qa('[data-nav]').forEach(el=>el.addEventListener('click', async ()=>{
      const v = el.getAttribute('data-nav');
      if(v==='new') newTForm = freshNewTForm();
      ui.view = v;
      render();
    }));

    qa('[data-open-t]').forEach(el=>el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-open-t');
      await openTournament(id);
    }));

    // New tournament form
    const nameEl = q('#f-name');
    if(nameEl) nameEl.addEventListener('input', e=>{ newTForm.name = e.target.value; });
    const fmtEl = q('#f-format');
    if(fmtEl) fmtEl.addEventListener('change', e=>{ newTForm.matchFormat = e.target.value; render(); });
    const gamesEl = q('#f-games');
    if(gamesEl) gamesEl.addEventListener('input', e=>{ newTForm.gamesPerCompetitor = parseInt(e.target.value)||3; });

    const nameInputEl = q('#f-nameinput');
    if(nameInputEl){
      nameInputEl.addEventListener('input', e=>{ newTForm.nameInput = e.target.value; });
      nameInputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addNameToForm(); } });
    }
    const addNameBtn = q('[data-add-name]');
    if(addNameBtn) addNameBtn.addEventListener('click', addNameToForm);
    qa('[data-remove-name]').forEach(el=>el.addEventListener('click', ()=>{
      const i = parseInt(el.getAttribute('data-remove-name'));
      newTForm.names.splice(i,1);
      newTForm.seedIds = newTForm.seedIds.filter(x=>x!==i).map(x=>x>i?x-1:x);
      render();
    }));
    qa('[data-toggle-seed]').forEach(el=>el.addEventListener('click', ()=>{
      const i = parseInt(el.getAttribute('data-toggle-seed'));
      const idx = newTForm.seedIds.indexOf(i);
      if(idx>=0) newTForm.seedIds.splice(idx,1); else newTForm.seedIds.push(i);
      render();
    }));

    const teamAEl = q('#f-teamA'); if(teamAEl) teamAEl.addEventListener('input', e=>{ newTForm.teamA = e.target.value; });
    const teamBEl = q('#f-teamB'); if(teamBEl) teamBEl.addEventListener('input', e=>{ newTForm.teamB = e.target.value; });
    const addTeamBtn = q('[data-add-team]');
    if(addTeamBtn) addTeamBtn.addEventListener('click', ()=>{
      if(newTForm.teamA.trim() && newTForm.teamB.trim()){
        newTForm.teams.push([newTForm.teamA.trim(), newTForm.teamB.trim()]);
        newTForm.teamA=''; newTForm.teamB='';
        render();
      }
    });
    qa('[data-remove-team]').forEach(el=>el.addEventListener('click', ()=>{
      const i = parseInt(el.getAttribute('data-remove-team'));
      newTForm.teams.splice(i,1);
      newTForm.seedIds = newTForm.seedIds.filter(x=>x!==i).map(x=>x>i?x-1:x);
      render();
    }));

    const createBtn = q('[data-create-tournament]');
    if(createBtn) createBtn.addEventListener('click', createTournamentFromForm);

    // Tournament detail events
    const resetTBtn = q('[data-reset-tournament]');
    if(resetTBtn) resetTBtn.addEventListener('click', ()=>{
      openConfirm('Delete this tournament?', 'This removes all fixtures, results and standings for this tournament. This cannot be undone.', async ()=>{
        await deleteTournament(currentTournament.id);
      });
    });

    qa('[data-gen-norepeat]').forEach(el=>el.addEventListener('click', async ()=>{
      await generateFixtureForStage(parseInt(el.getAttribute('data-gen-norepeat')), 'norepeat');
    }));
    qa('[data-gen-serpentine]').forEach(el=>el.addEventListener('click', async ()=>{
      await generateFixtureForStage(parseInt(el.getAttribute('data-gen-serpentine')), 'serpentine');
    }));
    qa('[data-gen-final]').forEach(el=>el.addEventListener('click', async ()=>{
      const stageIdx = parseInt(el.getAttribute('data-gen-final'));
      const gEl = q('#f-stage-games');
      const g = gEl ? (parseInt(gEl.value)||1) : 1;
      await generateFinalFixture(stageIdx, g);
    }));

    qa('[data-slot-edit]').forEach(el=>el.addEventListener('change', e=>{
      const [mi, slotIdx] = el.getAttribute('data-slot-edit').split('|').map(Number);
      const stage = currentTournament.stages[currentTournament.currentStageIndex];
      stage.matches[mi].slots[slotIdx] = e.target.value;
      saveCurrentTournament();
      render();
    }));

    qa('[data-save-match]').forEach(el=>el.addEventListener('click', async ()=>{
      await saveMatchResult(parseInt(el.getAttribute('data-save-match')));
    }));
    qa('[data-edit-match]').forEach(el=>el.addEventListener('click', ()=>{
      const mi = parseInt(el.getAttribute('data-edit-match'));
      currentTournament.stages[currentTournament.currentStageIndex].matches[mi].completed = false;
      saveCurrentTournament(); render();
    }));

    const advanceBtn = q('[data-advance-stage]');
    if(advanceBtn) advanceBtn.addEventListener('click', advanceStage);
    const champBtn = q('[data-declare-champion]');
    if(champBtn) champBtn.addEventListener('click', declareChampion);

    const resetAllBtn = q('[data-reset-all]');
    if(resetAllBtn) resetAllBtn.addEventListener('click', ()=>{
      openConfirm('Reset everything?', 'This deletes every tournament, roster entry and result. This cannot be undone.', resetEverything);
    });

    // modal
    const backdrop = q('[data-modal-backdrop]');
    if(backdrop){
      backdrop.addEventListener('click', e=>{ if(e.target===backdrop){ ui.confirmModal=null; render(); } });
      const cancel = q('[data-modal-cancel]'); if(cancel) cancel.addEventListener('click', ()=>{ ui.confirmModal=null; render(); });
      const confirmBtn = q('[data-modal-confirm]');
      if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
        const fn = ui.confirmModal.onConfirm;
        ui.confirmModal = null;
        if(fn) await fn();
      });
    }

    const profFilter = q('#f-profile-filter');
    if(profFilter) profFilter.addEventListener('input', e=>{ ui.profileFilter = e.target.value; render(); });

    // Coach PIN controls
    const openPinBtn = q('[data-open-pin]');
    if(openPinBtn) openPinBtn.addEventListener('click', ()=>{
      ui.pinModal = { mode: openPinBtn.getAttribute('data-open-pin'), value:'', error:'' };
      render();
    });
    const lockBtn = q('[data-lock-coach]');
    if(lockBtn) lockBtn.addEventListener('click', ()=>{
      ui.isCoach = false;
      if(ui.view==='new') ui.view='home';
      render();
    });
    const pinValEl = q('#f-pin-value');
    if(pinValEl){
      pinValEl.addEventListener('input', e=>{ ui.pinModal.value = e.target.value; });
      pinValEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitPinModal(); } });
    }
    const pinCancel = q('[data-pin-cancel]');
    if(pinCancel) pinCancel.addEventListener('click', ()=>{ ui.pinModal=null; render(); });
    const pinSubmit = q('[data-pin-submit]');
    if(pinSubmit) pinSubmit.addEventListener('click', submitPinModal);
    const pinBackdrop = q('[data-pin-backdrop]');
    if(pinBackdrop) pinBackdrop.addEventListener('click', e=>{ if(e.target===pinBackdrop){ ui.pinModal=null; render(); } });
  }

  async function submitPinModal(){
    const m = ui.pinModal;
    const val = (m.value||'').trim();
    if(!val){ m.error = 'Enter a PIN first.'; render(); return; }
    if(m.mode==='setup'){
      DB.coachPin = val;
      await sSet('coach_pin', val);
      ui.isCoach = true;
      ui.pinModal = null;
      render();
    } else {
      if(val === DB.coachPin){
        ui.isCoach = true;
        ui.pinModal = null;
        render();
      } else {
        m.error = 'That PIN is not right — try again.';
        render();
      }
    }
  }

  function q(sel){ return appEl.querySelector(sel); }
  function qa(sel){ return Array.from(appEl.querySelectorAll(sel)); }
  function openConfirm(title, body, onConfirm){ ui.confirmModal = {title, body, onConfirm}; render(); }

  function addNameToForm(){
    const v = (newTForm.nameInput||'').trim();
    if(v){ newTForm.names.push(v); newTForm.nameInput=''; render(); }
  }

  /* ============================= ACTIONS ============================= */
  async function createTournamentFromForm(){
    if(!ui.isCoach){ alert('Coach mode is required to create a tournament.'); return; }
    const f = newTForm;
    const name = (f.name||'').trim() || 'Untitled tournament';
    let competitors = [];
    if(f.matchFormat==='individual'){
      competitors = f.names.map((n,i)=>({id:uid('c'), name:n, seed:f.seedIds.includes(i)}));
    } else {
      competitors = f.teams.map((tm,i)=>({id:uid('c'), name:tm[0]+' & '+tm[1], memberNames:tm, seed:f.seedIds.includes(i)}));
    }
    if(competitors.length<3){
      alert('Add at least 3 competitors (or teams) before creating the tournament.');
      return;
    }
    const t = {
      id: uid('t'),
      name,
      createdAt: Date.now(),
      matchFormat: f.matchFormat,
      competitors,
      stages: [{
        key:'prelims', label:'Prelims',
        gamesPerCompetitor: f.gamesPerCompetitor,
        competitorIds: competitors.map(c=>c.id),
        matches: [], qualifyN:null, locked:false
      }],
      currentStageIndex: 0,
      champion: null
    };
    await sSet('tournament:'+t.id, t);
    DB.tIndex.push({id:t.id, name:t.name, createdAt:t.createdAt, matchFormat:t.matchFormat, status:'live', stageLabel:'Prelims', competitorCount:competitors.length});
    await sSet('tournament_index', DB.tIndex);
    await refreshRosterFromCompetitors(competitors);
    if(!DB.fullCache) DB.fullCache = [];
    DB.fullCache.push(t);
    currentTournament = t;
    ui.tId = t.id;
    ui.view = 'tournament';
    newTForm = null;
    render();
  }

  async function refreshRosterFromCompetitors(competitors){
    const names = new Set(DB.roster);
    competitors.forEach(c=>{
      if(c.memberNames) c.memberNames.forEach(n=>names.add(n));
      else names.add(c.name);
    });
    DB.roster = Array.from(names);
    await sSet('roster', DB.roster);
  }

  async function openTournament(id){
    const t = await sGet('tournament:'+id);
    if(!t){ alert('Could not load this tournament.'); return; }
    currentTournament = t;
    ui.tId = id;
    ui.view = 'tournament';
    render();
  }

  async function saveCurrentTournament(){
    await sSet('tournament:'+currentTournament.id, currentTournament);
    // update cache + index
    if(!DB.fullCache) DB.fullCache = [];
    const idx = DB.fullCache.findIndex(x=>x.id===currentTournament.id);
    if(idx>=0) DB.fullCache[idx] = currentTournament; else DB.fullCache.push(currentTournament);
    const iIdx = DB.tIndex.findIndex(x=>x.id===currentTournament.id);
    if(iIdx>=0){
      const stage = currentTournament.stages[currentTournament.currentStageIndex];
      DB.tIndex[iIdx].stageLabel = stage.label;
      DB.tIndex[iIdx].status = currentTournament.champion ? 'champion' : 'live';
      await sSet('tournament_index', DB.tIndex);
    }
  }

  async function deleteTournament(id){
    if(!ui.isCoach){ alert('Coach mode is required.'); return; }
    await sDelete('tournament:'+id);
    DB.tIndex = DB.tIndex.filter(x=>x.id!==id);
    await sSet('tournament_index', DB.tIndex);
    if(DB.fullCache) DB.fullCache = DB.fullCache.filter(x=>x.id!==id);
    currentTournament = null;
    ui.view = 'home';
    render();
  }

  async function resetEverything(){
    if(!ui.isCoach){ alert('Coach mode is required.'); return; }
    for(const t of DB.tIndex){ await sDelete('tournament:'+t.id); }
    DB.tIndex = [];
    DB.roster = [];
    DB.fullCache = [];
    await sSet('tournament_index', []);
    await sSet('roster', []);
    currentTournament = null;
    ui.view = 'home';
    render();
  }

  async function generateFixtureForStage(stageIdx, mode){
    if(!ui.isCoach){ alert('Coach mode is required to generate a fixture.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    const seedIds = mode==='norepeat' ? stage.competitorIds.filter(cid=>{
      const c = t.competitors.find(x=>x.id===cid); return c && c.seed;
    }) : [];

    if(mode==='norepeat'){
      const result = generateNoRepeatFixture(stage.competitorIds, stage.gamesPerCompetitor, seedIds);
      if(!result.ok){ alert(result.reason); return; }
      const rounds = packIntoRounds(result.matches);
      stage.matches = [];
      rounds.forEach(round=>{
        round.forEach(m=>{
          stage.matches.push({id:uid('m'), slots:m.slots, results:{}, completed:false});
        });
      });
    } else {
      // serpentine — needs a rank order; use current standings if any prior data, else input order
      const priorStandings = computeStandings(t, stage);
      let rankedIds;
      const anyPlayed = priorStandings.some(s=>s.played>0);
      rankedIds = anyPlayed ? priorStandings.map(s=>s.cid) : stage.competitorIds.slice();
      const groups = generateSerpentineFixture(rankedIds, 3);
      // validate group sizes are all 3
      const bad = groups.find(g=>g.slots.length!==3);
      if(bad){ alert('Balanced grouping needs the competitor count to be a multiple of 3. Adjust qualifier count and try again.'); return; }
      stage.matches = groups.map(g=>({id:uid('m'), slots:g.slots, results:{}, completed:false}));
    }
    await saveCurrentTournament();
    render();
  }

  async function generateFinalFixture(stageIdx, gamesCount){
    if(!ui.isCoach){ alert('Coach mode is required to generate a fixture.'); return; }
    const t = currentTournament;
    const stage = t.stages[stageIdx];
    stage.gamesPerCompetitor = gamesCount;
    stage.matches = [];
    for(let i=0;i<gamesCount;i++){
      stage.matches.push({id:uid('m'), slots:stage.competitorIds.slice(), results:{}, completed:false});
    }
    await saveCurrentTournament();
    render();
  }

  async function saveMatchResult(mi){
    if(!ui.isCoach){ alert('Coach mode is required.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const m = stage.matches[mi];
    const ranks = {};
    let missing = false, dupe = false;
    const seen = new Set();
    m.slots.forEach(cid=>{
      const rankEl = appEl.querySelector(`[data-rank-input="${mi}|${cid}"]`);
      const scoreEl = appEl.querySelector(`[data-score-input="${mi}|${cid}"]`);
      const rankVal = rankEl ? rankEl.value : '';
      if(!rankVal){ missing = true; return; }
      const rNum = parseInt(rankVal);
      if(seen.has(rNum)) dupe = true;
      seen.add(rNum);
      ranks[cid] = { rank: rNum, score: scoreEl && scoreEl.value!=='' ? parseFloat(scoreEl.value) : undefined };
    });
    if(missing){ alert('Please set a rank (1st/2nd/3rd) for every player before saving.'); return; }
    if(dupe){ alert('Two players cannot share the same rank in one match — check for a duplicate.'); return; }
    m.results = ranks;
    m.completed = true;
    await saveCurrentTournament();
    render();
  }

  async function advanceStage(){
    if(!ui.isCoach){ alert('Coach mode is required.'); return; }
    const t = currentTournament;
    const stage = t.stages[t.currentStageIndex];
    const nEl = q('#f-qualify-n');
    const labelEl = q('#f-next-label');
    const n = nEl ? parseInt(nEl.value) : suggestQualifyN(stage.competitorIds.length);
    const label = labelEl ? (labelEl.value.trim() || 'Next stage') : 'Next stage';
    const standings = computeStandings(t, stage);
    const qualified = standings.slice(0, n).map(s=>s.cid);
    stage.qualifyN = n;
    stage.qualifiedIds = qualified;

    const nextStage = {
      key: 'stage'+(t.stages.length),
      label,
      gamesPerCompetitor: qualified.length===3 ? 1 : 1,
      competitorIds: qualified,
      matches: [], qualifyN:null, locked:false
    };
    t.stages.push(nextStage);
    t.currentStageIndex = t.stages.length-1;
    await saveCurrentTournament();
    render();
  }

  async function declareChampion(){
    if(!ui.isCoach){ alert('Coach mode is required.'); return; }
    const pickEl = q('#f-champion-pick');
    if(!pickEl) return;
    currentTournament.champion = pickEl.value;
    await saveCurrentTournament();
    render();
  }

  /* ============================= UTIL ============================= */
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ============================= INIT ============================= */
  async function init(){
    const roster = await sGet('roster');
    const tIndex = await sGet('tournament_index');
    const coachPin = await sGet('coach_pin');
    DB.roster = roster || [];
    DB.tIndex = tIndex || [];
    DB.coachPin = coachPin || null;
    DB.fullCache = [];
    // preload all tournament blobs for profile aggregation
    for(const summary of DB.tIndex){
      const full = await sGet('tournament:'+summary.id);
      if(full) DB.fullCache.push(full);
    }
    render();
  }

  init();
})();
</script>
